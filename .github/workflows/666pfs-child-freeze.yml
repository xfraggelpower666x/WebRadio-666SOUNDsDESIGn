name: 666PFS 666STREAM Child Freeze

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - ".github/workflows/666pfs-child-freeze.yml"
      - ".github/workflows/deploy-cloudflare-workers.yml"
      - "docs/666PFS_CHILD_666STREAM_DEPLOYMENT_CONTRACT_v1.0.0.md"
      - "external-workers/**"
      - "public/**"
      - "worker.js"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "tests/**"
      - "worker-addons/**"
  workflow_run:
    workflows:
      - Deploy WebRadio Cloudflare Workers
    branches:
      - WebRadio-666SOUNDsDESIGn
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: 666pfs-666stream-child-freeze-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify-readback-and-freeze:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FREEZE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      BACKUP_CLASS: ${{ github.event_name == 'workflow_run' && 'POST_DEPLOY_VERIFIED_TREE' || 'PR_TREE_CANDIDATE' }}
      PRODUCTION_ORIGIN: https://webradio.666soundsdesign-broadcaster.com
      PFS_CHILD_TARGET: 666PFS/Child_Systems/666STREAM_DEPLOYMENT
    steps:
      - name: Checkout exact repository tree
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FREEZE_SHA }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository verification
        run: npm run verify

      - name: Read back exact deployed production commit
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          CACHE_BUST="${FREEZE_SHA}-${{ github.event.workflow_run.id }}-$(date +%s)"
          MARKER="PRODUCTION_READBACK_${FREEZE_SHA}.json"
          IDENTITY="PRODUCTION_DEPLOYMENT_IDENTITY_${FREEZE_SHA}.json"
          INDEX="PRODUCTION_INDEX_${FREEZE_SHA}.html"

          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --max-time 30 \
            "${PRODUCTION_ORIGIN}/666pfs-child-release.json?verify=${CACHE_BUST}" \
            --output "$MARKER"

          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --max-time 30 \
            "${PRODUCTION_ORIGIN}/666pfs-deployed-commit.json?verify=${CACHE_BUST}" \
            --output "$IDENTITY"

          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --max-time 30 \
            "${PRODUCTION_ORIGIN}/?verify=${CACHE_BUST}" \
            --output "$INDEX"

          node - "$MARKER" "$IDENTITY" "$FREEZE_SHA" "${{ github.event.workflow_run.id }}" <<'NODE'
          const fs = require('node:fs');
          const markerPath = process.argv[2];
          const identityPath = process.argv[3];
          const expectedCommit = process.argv[4];
          const expectedWorkflowRunId = process.argv[5];
          const data = JSON.parse(fs.readFileSync(markerPath, 'utf8'));
          const identity = JSON.parse(fs.readFileSync(identityPath, 'utf8'));
          const expected = {
            systemId: '666PFS-666STREAM-DEPLOYMENT-001',
            parentSystem: '666PFS',
            version: '1.0.2',
            backupAllowedAfter: 'DEPLOYMENT_READBACK_PASS',
            childAutoload: false,
            secondBootstrap: false,
            secondUpdateRoute: false,
            lyvra: 'EXTERNAL_UNCHANGED'
          };
          for (const [key, value] of Object.entries(expected)) {
            if (data[key] !== value) {
              throw new Error(`Production marker mismatch for ${key}: ${JSON.stringify(data[key])}`);
            }
          }
          if (identity.schema !== '666pfs-666stream-deployed-commit-v1') {
            throw new Error(`Deployment identity schema mismatch: ${JSON.stringify(identity.schema)}`);
          }
          if (identity.systemId !== expected.systemId) {
            throw new Error(`Deployment identity system mismatch: ${JSON.stringify(identity.systemId)}`);
          }
          if (identity.sourceCommit !== expectedCommit) {
            throw new Error(`DEPLOYED_COMMIT_MISMATCH expected=${expectedCommit} actual=${identity.sourceCommit}`);
          }
          if (String(identity.workflowRunId) !== String(expectedWorkflowRunId)) {
            throw new Error(`DEPLOYMENT_RUN_MISMATCH expected=${expectedWorkflowRunId} actual=${identity.workflowRunId}`);
          }
          NODE

          grep -Eiq '<!doctype html|<html' "$INDEX"

          {
            echo "DEPLOYMENT_WORKFLOW_RUN_ID=${{ github.event.workflow_run.id }}"
            echo "DEPLOYMENT_HEAD_SHA=${FREEZE_SHA}"
            echo "PRODUCTION_ORIGIN=${PRODUCTION_ORIGIN}"
            echo "MARKER_PATH=/666pfs-child-release.json"
            echo "IDENTITY_PATH=/666pfs-deployed-commit.json"
            echo "MARKER_SCHEMA=666pfs-666stream-child-release-v1"
            echo "IDENTITY_SCHEMA=666pfs-deployed-commit-v1"
            echo "IDENTITY_SOURCE_COMMIT=${FREEZE_SHA}"
            echo "DEPLOYMENT_IDENTITY_MATCH=PASS"
            echo "DEPLOYMENT_READBACK=PASS"
            echo "FUNCTIONAL_HTTP_READBACK=PASS"
          } > "PRODUCTION_READBACK_RECEIPT_${FREEZE_SHA}.txt"

      - name: Build immutable repository tree archive
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="666PFS_666STREAM_REPOSITORY_TREE_${FREEZE_SHA}.zip"
          TREE="REPOSITORY_TREE_${FREEZE_SHA}.txt"
          METADATA="666PFS_666STREAM_FREEZE_METADATA_${FREEZE_SHA}.txt"

          git archive --format=zip --output="$ARCHIVE" "$FREEZE_SHA"
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          git ls-tree -r --long "$FREEZE_SHA" > "$TREE"

          HASH="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          SIZE="$(stat -c%s "$ARCHIVE")"
          ENTRIES="$(unzip -Z1 "$ARCHIVE" | wc -l | tr -d ' ')"
          unzip -t "$ARCHIVE" > "ZIP_CRC_${FREEZE_SHA}.txt"

          {
            echo "SYSTEM_ID=666PFS-666STREAM-DEPLOYMENT-001"
            echo "PARENT_SYSTEM=666PFS"
            echo "SOURCE_REPOSITORY=${GITHUB_REPOSITORY}"
            echo "SOURCE_COMMIT=${FREEZE_SHA}"
            echo "SOURCE_EVENT=${GITHUB_EVENT_NAME}"
            echo "SOURCE_REF=${GITHUB_REF}"
            echo "ARCHIVE=${ARCHIVE}"
            echo "ARCHIVE_SHA256=${HASH}"
            echo "ARCHIVE_SIZE=${SIZE}"
            echo "ARCHIVE_ENTRIES=${ENTRIES}"
            echo "ZIP_CRC=PASS"
            echo "VERIFY_COMMAND=npm run verify"
            echo "BACKUP_CLASS=${BACKUP_CLASS}"
            echo "PFS_CHILD_TARGET=${PFS_CHILD_TARGET}"
            echo "PFS_STORAGE_OWNER=666PFS"
            echo "DEPLOYMENT_IDENTITY_MATCH=$([[ \"${GITHUB_EVENT_NAME}\" == \"workflow_run\" ]] && echo PASS || echo PENDING)"
            echo "DEPLOYMENT_READBACK=$([[ \"${GITHUB_EVENT_NAME}\" == \"workflow_run\" ]] && echo PASS || echo PENDING)"
          } > "$METADATA"

          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"
          echo "entries=${ENTRIES}" >> "$GITHUB_OUTPUT"
          echo "source_commit=${FREEZE_SHA}" >> "$GITHUB_OUTPUT"
          echo "metadata=${METADATA}" >> "$GITHUB_OUTPUT"
          echo "tree=${TREE}" >> "$GITHUB_OUTPUT"

      - name: Build 666PFS child handoff package
        id: handoff
        env:
          PFS_ARCHIVE: ${{ steps.freeze.outputs.archive }}
          PFS_ARCHIVE_SHA256: ${{ steps.freeze.outputs.hash }}
          PFS_SOURCE_COMMIT: ${{ steps.freeze.outputs.source_commit }}
          PFS_TREE_FILE: ${{ steps.freeze.outputs.tree }}
          PFS_METADATA_FILE: ${{ steps.freeze.outputs.metadata }}
          PFS_BACKUP_CLASS: ${{ env.BACKUP_CLASS }}
          PFS_CHILD_TARGET: ${{ env.PFS_CHILD_TARGET }}
        run: python scripts/pfs-child-handoff-package.py

      - name: Upload 666PFS child freeze and handoff artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 666pfs-666stream-repository-tree-${{ steps.freeze.outputs.source_commit }}
          path: |
            ${{ steps.freeze.outputs.archive }}
            ${{ steps.freeze.outputs.archive }}.sha256
            ${{ steps.freeze.outputs.tree }}
            ${{ steps.freeze.outputs.metadata }}
            ZIP_CRC_${{ steps.freeze.outputs.source_commit }}.txt
            PRODUCTION_READBACK_${{ steps.freeze.outputs.source_commit }}.json
            PRODUCTION_DEPLOYMENT_IDENTITY_${{ steps.freeze.outputs.source_commit }}.json
            PRODUCTION_READBACK_RECEIPT_${{ steps.freeze.outputs.source_commit }}.txt
            666PFS_666STREAM_HANDOFF_${{ steps.freeze.outputs.source_commit }}.zip
            666PFS_666STREAM_HANDOFF_${{ steps.freeze.outputs.source_commit }}.zip.sha256
            PFS_HANDOFF_MANIFEST_${{ steps.freeze.outputs.source_commit }}.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish post-deploy receipt to associated pull request
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        env:
          SOURCE_COMMIT: ${{ steps.freeze.outputs.source_commit }}
          ARCHIVE_SHA256: ${{ steps.freeze.outputs.hash }}
          ARCHIVE_SIZE: ${{ steps.freeze.outputs.size }}
          ARCHIVE_ENTRIES: ${{ steps.freeze.outputs.entries }}
          ARTIFACT_NAME: 666pfs-666stream-repository-tree-${{ steps.freeze.outputs.source_commit }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const commit_sha = process.env.SOURCE_COMMIT;
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha });
            const body = [
              '## 666PFS 666STREAM Commit-Bound Post-Deploy Freeze Receipt',
              '',
              `- SOURCE_COMMIT=${commit_sha}`,
              `- DEPLOYMENT_WORKFLOW_RUN_ID=${context.payload.workflow_run.id}`,
              `- FREEZE_WORKFLOW_RUN_ID=${context.runId}`,
              '- DEPLOYMENT_IDENTITY_MATCH=PASS',
              '- DEPLOYMENT_READBACK=PASS',
              '- FUNCTIONAL_HTTP_READBACK=PASS',
              '- REPOSITORY_VERIFY=PASS',
              '- ZIP_CRC=PASS',
              `- ZIP_SHA256=${process.env.ARCHIVE_SHA256}`,
              `- ZIP_SIZE=${process.env.ARCHIVE_SIZE}`,
              `- ZIP_ENTRIES=${process.env.ARCHIVE_ENTRIES}`,
              `- ARTIFACT_NAME=${process.env.ARTIFACT_NAME}`,
              '- BACKUP_CLASS=POST_DEPLOY_VERIFIED_TREE',
              '- PFS_HANDOFF_PACKAGE=READY',
              '- PFS_CHILD_TARGET=666PFS/Child_Systems/666STREAM_DEPLOYMENT',
              '- PFS_STORAGE_OWNER=666PFS',
              '- RADIO_DRIVE_CREDENTIALS=NOT_REQUIRED',
              '- CHILD_BACKUP_REGISTRATION=PFS_INTAKE_REQUIRED',
              '- LYVRA=EXTERNAL_UNCHANGED'
            ].join('\n');
            if (pulls.length === 0) {
              core.warning(`No pull request associated with ${commit_sha}; receipt remains in the workflow artifact.`);
              return;
            }
            for (const pull of pulls) {
              await github.rest.issues.createComment({ owner, repo, issue_number: pull.number, body });
            }
