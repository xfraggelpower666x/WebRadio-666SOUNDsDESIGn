name: Adopt Existing VELUNA Messenger Trigger 20260811

on:
  push:
    branches:
      - repair/player-alert-backend-global-messenger-20260811

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/player-alert-backend-global-messenger-20260811
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reuse existing VELUNA Messenger trigger
        run: node scripts/adopt-existing-veluna-message-button-20260811.mjs
      - name: Commit repaired runtime files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No repair delta pending."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/messenger-overlay.js public/js/messenger-overlay.js tests/player-alert-global-backend-repair.test.mjs
          git commit -m "Reuse existing VELUNA Messenger trigger"
          git push origin HEAD:repair/player-alert-backend-global-messenger-20260811
