name: Apply All Player Mute

on:
  push:
    branches:
      - feature/all-player-mute-20260816

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/all-player-mute-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wire shared mute runtime and tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('config/veluna-assets.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace("const version = '2026-07-23-reactive-visual-v183';", "const version = '2026-08-16-all-player-mute-v184';", 1)

          marker = "  loadStyle(`/css/audio-policy-core.css?v=${version}`, 'smfpAudioPolicy');\n"
          insert = marker + "  loadStyle(`/css/all-player-mute.css?v=${version}`, 's666AllPlayerMute');\n"
          if marker not in text:
              raise SystemExit('audio-policy style marker missing')
          text = text.replace(marker, insert, 1)

          marker2 = "  const artworkReady = () => !!window.SMFPArtworkCore;\n"
          insert2 = marker2 + "  const muteReady = () => !!window.S666AllPlayerMute?.version;\n"
          if marker2 not in text:
              raise SystemExit('artwork ready marker missing')
          text = text.replace(marker2, insert2, 1)

          marker3 = "  void loadScript(`/js/artwork-core.js?v=${version}`, 'smfpArtworkCore', artworkReady)\n"
          mute_block = "  void loadScript(`/js/all-player-mute.js?v=${version}`, 's666AllPlayerMute', muteReady)\n    .then(() => {\n      try { window.S666AllPlayerMute?.sync?.(); } catch (_) {}\n    })\n    .catch(() => {});\n\n"
          if marker3 not in text:
              raise SystemExit('artwork loader marker missing')
          text = text.replace(marker3, mute_block + marker3, 1)
          path.write_text(text, encoding='utf-8')
          Path('public/config/veluna-assets.js').write_text(text, encoding='utf-8')

          test = r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          const read = path => readFile(new URL(`../${path}`, import.meta.url), 'utf8');
          const PLAYER_ENTRIES = [
            'index.html',
            'veluna/index.html',
            'VELUNA/index.html',
            'public/index.html',
            'public/veluna/index.html',
            'public/VELUNA/index.html',
            'worker.js',
            'workers/webradio-666soundsdesign-worker/worker.js'
          ];

          test('all canonical players receive one shared mute runtime through the common asset bootstrap', async () => {
            const config = await read('config/veluna-assets.js');
            assert.equal(await read('public/config/veluna-assets.js'), config);
            assert.match(config, /all-player-mute\.css/);
            assert.match(config, /all-player-mute\.js/);
            assert.match(config, /S666AllPlayerMute/);
            for (const entry of PLAYER_ENTRIES) {
              assert.match(await read(entry), /\/config\/veluna-assets\.js\?v=/, entry);
            }
          });

          test('mute runtime changes only media muted state and preserves volume audio graph EQ boost and stream contracts', async () => {
            const runtime = await read('js/all-player-mute.js');
            assert.equal(await read('public/js/all-player-mute.js'), runtime);
            assert.equal(await read('public/css/all-player-mute.css'), await read('css/all-player-mute.css'));
            assert.match(runtime, /audio\.muted = !audio\.muted/);
            assert.match(runtime, /volumechange/);
            assert.doesNotMatch(runtime, /audio\.volume\s*=/);
            assert.doesNotMatch(runtime, /createMediaElementSource|AudioContext|webkitAudioContext|createGain|createBiquadFilter|DynamicsCompressor/);
            assert.doesNotMatch(runtime, /\/stream|fallback-stream|api\/nowplaying|discord|player-alert/i);
          });

          test('mute control is accessible, visible and survives late audio remounts', async () => {
            const runtime = await read('js/all-player-mute.js');
            const css = await read('css/all-player-mute.css');
            assert.match(runtime, /aria-pressed/);
            assert.match(runtime, /aria-label/);
            assert.match(runtime, /MutationObserver/);
            assert.match(runtime, /findAudio\(\) !== boundAudio/);
            assert.match(css, /\.s666-mute-button/);
            assert.match(css, /safe-area-inset-right/);
            assert.match(css, /safe-area-inset-bottom/);
          });
          '''
          test = '\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines()) + '\n'
          Path('tests/all-player-mute.test.mjs').write_text(test, encoding='utf-8')
          PY

          cp js/all-player-mute.js public/js/all-player-mute.js
          cp css/all-player-mute.css public/css/all-player-mute.css
          npm ci
          npm run verify
      - name: Commit verified mute integration
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/veluna-assets.js public/config/veluna-assets.js js/all-player-mute.js public/js/all-player-mute.js css/all-player-mute.css public/css/all-player-mute.css tests/all-player-mute.test.mjs
          git diff --cached --check
          git commit -m 'feat: integrate mute across all canonical players'
          git push origin HEAD:feature/all-player-mute-20260816
