name: Apply Main Worker PW Auth Fallback v1

on:
  push:
    branches:
      - repair-main-worker-pw-auth-fallback-20260719
    paths:
      - ".github/one-time/apply-main-worker-pw-auth-fallback-v1.py"
      - ".github/workflows/apply-main-worker-pw-auth-fallback-v1.yml"
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - ".github/one-time/apply-main-worker-pw-auth-fallback-v1.py"
      - ".github/workflows/apply-main-worker-pw-auth-fallback-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-main-worker-pw-auth-fallback-20260719
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply canonical PW/Auth fallback repair
        run: python .github/one-time/apply-main-worker-pw-auth-fallback-v1.py
      - name: Verify complete release
        run: |
          npm ci
          npm run verify
      - name: Commit verified product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            worker-addons/radio-admin-config-addon.js \
            workers/webradio-666soundsdesign-worker/worker-addons/radio-admin-config-addon.js \
            tests/admin-hardlock.test.mjs
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "repair: fallback to canonical PW and Auth workers"
          git push origin HEAD:repair-main-worker-pw-auth-fallback-20260719
