name: Apply Player Message Overlay Inert v1

on:
  push:
    branches:
      - repair-player-message-overlay-inert-v1-20260719
    paths:
      - ".github/one-time/apply_player_message_overlay_inert_v1.py"
      - ".github/workflows/apply-player-message-overlay-inert-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-player-message-overlay-inert-v1-20260719
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply overlay repair
        run: python .github/one-time/apply_player_message_overlay_inert_v1.py
      - name: Verify complete release
        run: |
          npm ci
          npm run verify
      - name: Commit verified product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            js/player-alert-client.js public/js/player-alert-client.js \
            css/veluna-theme.css public/css/veluna-theme.css \
            js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js \
            index.html public/index.html \
            veluna/index.html VELUNA/index.html public/veluna/index.html public/VELUNA/index.html \
            worker.js workers/webradio-666soundsdesign-worker/worker.js \
            tests/frontend-contracts.test.mjs tests/worker-smoke.test.mjs
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "repair: make Player Message overlay truly inert when closed"
          git push origin HEAD:repair-player-message-overlay-inert-v1-20260719
