name: Apply Player Message Overlay Inert v1

on:
  push:
    branches:
      - repair-player-message-overlay-inert-v1-20260719
    paths:
      - ".github/one-time/apply_player_message_overlay_inert_v1.py"
      - ".github/workflows/apply-player-message-overlay-inert-v1.yml"
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - ".github/one-time/apply_player_message_overlay_inert_v1.py"
      - ".github/workflows/apply-player-message-overlay-inert-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-player-message-overlay-inert-v1-20260719
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply overlay repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/one-time/apply_player_message_overlay_inert_v1.py')
          text = path.read_text(encoding='utf-8')
          old = "assert.match(client, /pointer-events[^\\n]*none/);"
          new = "assert.match(client, /pointer-events.*none/);"
          if old not in text:
              raise SystemExit('overlay test regex anchor missing')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python .github/one-time/apply_player_message_overlay_inert_v1.py
      - name: Verify complete release
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci >/tmp/npm-ci.log 2>&1 || { cp /tmp/npm-ci.log /tmp/verify.log; exit 1; }
          npm run verify >/tmp/verify.log 2>&1
      - name: Persist verification diagnostics
        if: steps.verify.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/verify.log .github/one-time/verify-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/one-time/verify-failure.txt
          git commit -m "ci: capture overlay repair verification failure"
          git push origin HEAD:repair-player-message-overlay-inert-v1-20260719
          exit 1
      - name: Commit verified product files
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            js/player-alert-client.js public/js/player-alert-client.js \
            css/veluna-theme.css public/css/veluna-theme.css \
            js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js \
            index.html public/index.html \
            veluna/index.html VELUNA/index.html public/veluna/index.html public/VELUNA/index.html \
            worker.js workers/webradio-666soundsdesign-worker/worker.js \
            tests/frontend-contracts.test.mjs tests/worker-smoke.test.mjs
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "repair: make Player Message overlay truly inert when closed"
          git push origin HEAD:repair-player-message-overlay-inert-v1-20260719
