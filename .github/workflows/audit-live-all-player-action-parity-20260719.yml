name: Audit Live All Player Action Parity 20260719

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - ".github/workflows/audit-live-all-player-action-parity-20260719.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Cloudflare deployment and propagation
        run: sleep 90
      - name: Fetch live players and shared modules
        shell: bash
        run: |
          set -euo pipefail
          base="https://webradio.666soundsdesign-broadcaster.com"
          stamp="$(date +%s)"
          curl --fail --silent --show-error --location --retry 10 --retry-delay 10 --retry-all-errors "$base/?audit=$stamp" -o /tmp/main.html
          curl --fail --silent --show-error --location --retry 10 --retry-delay 10 --retry-all-errors "$base/internal?audit=$stamp" -o /tmp/internal.html
          curl --fail --silent --show-error --location --retry 10 --retry-delay 10 --retry-all-errors "$base/veluna?audit=$stamp" -o /tmp/veluna.html
          curl --fail --silent --show-error --location --retry 10 --retry-delay 10 --retry-all-errors "$base/js/skip-control.js?audit=$stamp" -o /tmp/skip.js
          curl --fail --silent --show-error --location --retry 10 --retry-delay 10 --retry-all-errors "$base/js/player-stage-v2.js?audit=$stamp" -o /tmp/stage.js
          curl --fail --silent --show-error --location --retry 10 --retry-delay 10 --retry-all-errors "$base/js/addons/discord-player-addon-v3.js?audit=$stamp" -o /tmp/discord.js
      - name: Verify Main player parity
        shell: bash
        run: |
          set -euo pipefail
          grep -F '/js/skip-control.js?v=2026-07-19-action-parity-v1' /tmp/main.html
          grep -F '/js/player-stage-v2.js?v=2026-07-19-action-parity-v1' /tmp/main.html
          grep -F '/js/addons/discord-player-addon-v3.js?v=2026-07-19-overlay-status-v51' /tmp/main.html
      - name: Verify VELUNA player parity
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'id="skipBtn"' /tmp/veluna.html
          grep -F 'id="discordBtn"' /tmp/veluna.html
          grep -F '/js/skip-control.js?v=2026-07-19-action-parity-v1' /tmp/veluna.html
          grep -F '/js/addons/discord-player-addon-v3.js?v=2026-07-19-overlay-status-v51' /tmp/veluna.html
          grep -F 'S666SkipControl.skip' /tmp/veluna.html
          ! grep -F 'S666AdminAuth.fetch(ENDPOINTS.skip' /tmp/veluna.html
          ! grep -F 'async function ensureAdmin' /tmp/veluna.html
          ! grep -F 'Admin-Passwort für VELUNA Discord Shooter' /tmp/veluna.html
      - name: Verify Internal player parity
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'data-veluna-page="internal"' /tmp/internal.html
          grep -F 'id="skipBtn"' /tmp/internal.html
          grep -F 'id="discordBtn"' /tmp/internal.html
          grep -F 'id="internalMessageBtn"' /tmp/internal.html
          grep -F 'id="internalActionStatus"' /tmp/internal.html
          grep -F '/js/admin-auth-client.js?v=2026-07-19-auth-errors-v1220' /tmp/internal.html
          grep -F '/js/skip-control.js?v=2026-07-19-action-parity-v1' /tmp/internal.html
          grep -F '/js/player-alert-client.js?v=2026-06-25-hardlock1' /tmp/internal.html
          grep -F '/js/messenger-overlay.js?v=2026-07-19-overlay-status-v2' /tmp/internal.html
          grep -F '/js/addons/discord-player-addon-v3.js?v=2026-07-19-overlay-status-v51' /tmp/internal.html
          grep -F 'S666SkipControl.skip' /tmp/internal.html
          grep -F 'S666DiscordPlayerAddonV3.messagePost' /tmp/internal.html
          grep -F 'S666Messenger.open' /tmp/internal.html
          ! grep -F 'Admin-Passwort für den Discord Shooter' /tmp/internal.html
      - name: Verify shared ownership modules
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'function ensureInteractiveAuth(options)' /tmp/skip.js
          grep -F 'S666AdminAuth.ensure' /tmp/skip.js
          grep -F 'S666AdminAuth.fetch' /tmp/skip.js
          grep -F '/api/admin/skip' /tmp/skip.js
          grep -F '/api/radio/skip' /tmp/skip.js

          grep -F 'S666SkipControl.skip' /tmp/stage.js
          grep -F 'openDiscordShooter' /tmp/stage.js
          ! grep -F 'withGate(' /tmp/stage.js
          ! grep -F 'Admin-Passwort für den Discord Shooter' /tmp/stage.js
          ! grep -F 'S666AdminAuth' /tmp/stage.js

          grep -F "V4.11-20260719-PUBLIC-DISCORD-CENTRAL-SKIP" /tmp/discord.js
          grep -F '✓ Erfolgreich an Discord gesendet' /tmp/discord.js
          grep -F '✓ Erfolgreich an die Hörer gesendet' /tmp/discord.js
          ! grep -F 'ensureInteractiveAuth' /tmp/discord.js
          ! grep -F 'S666AdminAuth.ensure' /tmp/discord.js

          echo 'LIVE_ALL_PLAYER_ACTION_PARITY_OK'
