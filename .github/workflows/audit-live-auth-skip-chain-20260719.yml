name: Audit Live Auth Skip Chain 20260719

on:
  push:
    branches:
      - audit-live-auth-skip-chain-20260719
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - ".github/workflows/audit-live-auth-skip-chain-20260719.yml"
      - ".github/one-time/audit-live-auth-skip-chain.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-auth-skip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEBUG_TOKEN: ${{ secrets.DEBUG_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Run concise live auth and skip audit
        shell: bash
        run: |
          set -o pipefail
          bash .github/one-time/audit-live-auth-skip-chain.sh | tee /tmp/auth-skip-result.txt
      - name: Upload concise audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-auth-skip-result
          path: /tmp/auth-skip-result.txt
          if-no-files-found: warn
          retention-days: 1
