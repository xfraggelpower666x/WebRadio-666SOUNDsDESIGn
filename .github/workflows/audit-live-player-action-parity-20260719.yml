name: Audit Live Internal Player Diagnostics 20260719

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - ".github/workflows/audit-live-player-action-parity-20260719.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect live Internal route
        shell: bash
        run: |
          set -euo pipefail
          base="https://webradio.666soundsdesign-broadcaster.com"
          stamp="$(date +%s)"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 8 --retry-all-errors \
            "$base/internal?audit=$stamp" -o /tmp/internal.html
          echo "INTERNAL_SIZE=$(wc -c < /tmp/internal.html)"
          echo "INTERNAL_TITLE=$(grep -o '<title>[^<]*' /tmp/internal.html | head -1 || true)"
          echo 'INTERNAL_SCRIPTS_BEGIN'
          grep -o '<script[^>]*src="[^"]*"[^>]*>' /tmp/internal.html || true
          echo 'INTERNAL_SCRIPTS_END'
          echo 'INTERNAL_ACTION_MARKERS_BEGIN'
          grep -E 'S666|Discord|DISCORD|SKIP|Skip|skip|Internal|INTERNAL|player-stage|skip-control|admin-auth' /tmp/internal.html | head -160 || true
          echo 'INTERNAL_ACTION_MARKERS_END'
          echo 'LIVE_INTERNAL_DIAGNOSTICS_OK'
