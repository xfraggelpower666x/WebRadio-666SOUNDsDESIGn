name: Temporary Audit LYVRA Authority Worker

on:
  push:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - ".github/workflows/audit-lyvra-authority-worker-temp.yml"

permissions:
  contents: write

jobs:
  current-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-authority-audit-20260820

      - name: Capture Cloudflare and live current state read-only
        shell: bash
        run: |
          set -euo pipefail
          REPORT=cloudflare-authority-current-state-20260820.md
          base_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/lyvrasystem"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          curl -fsS "${auth[@]}" "$base_api" > /tmp/script.bin
          curl -fsS "${auth[@]}" "$base_api/deployments" > /tmp/deployments.json
          curl -fsS "https://lyvrasystem.666soundsdesign-broadcaster.com/health" > /tmp/health.json || true
          curl -fsS "https://lyvrasystem.666soundsdesign-broadcaster.com/v2/systems" > /tmp/v2systems.json || true

          {
            echo "# Cloudflare LYVRA Authority Worker Current State"
            echo
            echo "GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "TARGET_SCRIPT=lyvrasystem"
            echo "READ_ONLY=TRUE"
            echo "LIVE_SCRIPT_SHA256=$(sha256sum /tmp/script.bin | awk '{print $1}')"
            jq -r '.result.deployments[0]? | "DEPLOYMENT_ID=\(.id // "unknown")\nDEPLOYMENT_CREATED_ON=\(.created_on // "unknown")\nDEPLOYMENT_SOURCE=\(.source // "unknown")\nDEPLOYMENT_VERSION_ID=\(.versions[0].version_id // "unknown")"' /tmp/deployments.json
            if jq -e '.ok == true' /tmp/health.json >/dev/null 2>&1; then
              echo "HEALTH_OK=true"
              echo "HEALTH_SERVICE=$(jq -r '.service // "unknown"' /tmp/health.json)"
              echo "HEALTH_VERSION=$(jq -r '.version // "unknown"' /tmp/health.json)"
              echo "HEALTH_STATUS=$(jq -r '.status // "unknown"' /tmp/health.json)"
            else
              echo "HEALTH_OK=false"
            fi
            if jq -e '.ok == true' /tmp/v2systems.json >/dev/null 2>&1; then
              echo "V2_SYSTEMS_OK=true"
              echo "V2_SCOPE=$(jq -r '.personal_worker_applies_to // "unknown"' /tmp/v2systems.json)"
            else
              echo "V2_SYSTEMS_OK=false"
            fi
          } > "$REPORT"

      - name: Persist current-state receipt on isolated audit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-authority-current-state-20260820.md
          if ! git diff --cached --quiet; then
            git commit -m "Record current lyvrasystem state"
            git push origin HEAD:cloudflare-authority-audit-20260820
          fi
