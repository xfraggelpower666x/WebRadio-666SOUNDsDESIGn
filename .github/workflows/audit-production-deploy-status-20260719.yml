name: Audit Production Deploy Status 20260719

on:
  push:
    branches:
      - audit-live-auth-skip-chain-20260719
    paths:
      - ".github/workflows/audit-production-deploy-status-20260719.yml"
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - ".github/workflows/audit-production-deploy-status-20260719.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy-status:
    runs-on: ubuntu-latest
    steps:
      - name: Export latest failed production deploy log
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api_headers=(
            -H "authorization: Bearer $GH_TOKEN"
            -H 'accept: application/vnd.github+json'
            -H 'x-github-api-version: 2022-11-28'
          )
          curl --fail --silent --show-error "${api_headers[@]}" \
            "https://api.github.com/repos/$REPO/actions/workflows/deploy-cloudflare-workers.yml/runs?branch=WebRadio-666SOUNDsDESIGn&event=push&per_page=5" \
            -o /tmp/runs.json
          python - <<'PY'
          import json
          from pathlib import Path
          runs=json.loads(Path('/tmp/runs.json').read_text()).get('workflow_runs') or []
          assert runs
          latest=runs[0]
          Path('/tmp/latest-run-id').write_text(str(latest['id']))
          Path('/tmp/deploy-summary.txt').write_text(
              'latestDeployRunId='+str(latest.get('id'))+'\n'+
              'latestDeployHeadSha='+str(latest.get('head_sha'))+'\n'+
              'latestDeployStatus='+str(latest.get('status'))+'\n'+
              'latestDeployConclusion='+str(latest.get('conclusion'))+'\n'
          )
          PY
          run_id="$(cat /tmp/latest-run-id)"
          curl --fail --silent --show-error "${api_headers[@]}" \
            "https://api.github.com/repos/$REPO/actions/runs/$run_id/jobs?per_page=100" \
            -o /tmp/jobs.json
          python - <<'PY'
          import json
          from pathlib import Path
          jobs=json.loads(Path('/tmp/jobs.json').read_text()).get('jobs') or []
          failed=[job for job in jobs if job.get('conclusion') == 'failure']
          assert failed
          job=failed[0]
          Path('/tmp/failed-job-id').write_text(str(job['id']))
          with Path('/tmp/deploy-summary.txt').open('a') as out:
              out.write('failedDeployJobId='+str(job.get('id'))+'\n')
              out.write('failedDeployJobName='+str(job.get('name'))+'\n')
          PY
          job_id="$(cat /tmp/failed-job-id)"
          curl --fail --silent --show-error --location "${api_headers[@]}" \
            "https://api.github.com/repos/$REPO/actions/jobs/$job_id/logs" \
            -o /tmp/raw-job-logs
          if unzip -t /tmp/raw-job-logs >/dev/null 2>&1; then
            unzip -p /tmp/raw-job-logs > /tmp/job.log
          else
            cp /tmp/raw-job-logs /tmp/job.log
          fi
          {
            cat /tmp/deploy-summary.txt
            echo '--- FAILED WRANGLER LOG TAIL ---'
            tail -n 160 /tmp/job.log
            echo '--- END FAILED WRANGLER LOG TAIL ---'
          } > /tmp/failed-deploy-result.txt
          cat /tmp/deploy-summary.txt
      - name: Upload exact failed deploy result
        uses: actions/upload-artifact@v4
        with:
          name: failed-production-deploy-result
          path: /tmp/failed-deploy-result.txt
          if-no-files-found: error
          retention-days: 1
