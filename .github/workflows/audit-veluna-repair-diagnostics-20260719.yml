name: Audit Veluna Repair Diagnostics 20260719

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - ".github/workflows/audit-veluna-repair-diagnostics-20260719.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply prepared repair
        run: python .github/one-time/apply_veluna_overlay_auth_pc_repair.py
      - name: Install dependencies
        run: npm ci
      - name: Capture verification output
        shell: bash
        run: |
          set +e
          npm run verify > /tmp/VERIFY-OUTPUT.txt 2>&1
          code=$?
          echo "$code" > /tmp/VERIFY-EXIT-CODE.txt
          cat /tmp/VERIFY-OUTPUT.txt
          exit 0
      - name: Stage diagnostics and generated files
        run: |
          mkdir -p /tmp/veluna-repair
          cp --parents css/veluna-theme.css public/css/veluna-theme.css js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js js/admin-auth-client.js public/js/admin-auth-client.js veluna/index.html VELUNA/index.html public/veluna/index.html public/VELUNA/index.html index.html public/index.html worker.js workers/webradio-666soundsdesign-worker/worker.js /tmp/veluna-repair/
          cp /tmp/VERIFY-OUTPUT.txt /tmp/VERIFY-EXIT-CODE.txt /tmp/veluna-repair/
          cd /tmp/veluna-repair
          sha256sum $(find . -type f -print | sort) > VERIFIED-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: veluna-overlay-auth-pc-repair-diagnostics
          path: /tmp/veluna-repair
          if-no-files-found: error
          retention-days: 7
