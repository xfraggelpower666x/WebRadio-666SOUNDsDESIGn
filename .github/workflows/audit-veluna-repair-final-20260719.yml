name: Audit Veluna Repair Final 20260719

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - ".github/workflows/audit-veluna-repair-final-20260719.yml"
      - ".github/one-time/apply_veluna_auth_contract_bridge.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply prepared repair
        run: python .github/one-time/apply_veluna_overlay_auth_pc_repair.py
      - name: Apply protected auth contract bridge
        run: python .github/one-time/apply_veluna_auth_contract_bridge.py
      - name: Verify complete release
        run: |
          npm ci
          npm run verify
      - name: Stage verified files
        run: |
          mkdir -p /tmp/veluna-repair
          cp --parents css/veluna-theme.css public/css/veluna-theme.css js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js js/admin-auth-client.js public/js/admin-auth-client.js veluna/index.html VELUNA/index.html public/veluna/index.html public/VELUNA/index.html index.html public/index.html worker.js workers/webradio-666soundsdesign-worker/worker.js /tmp/veluna-repair/
          cd /tmp/veluna-repair
          sha256sum $(find . -type f -print | sort) > VERIFIED-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: veluna-overlay-auth-pc-repair-final-verified
          path: /tmp/veluna-repair
          if-no-files-found: error
          retention-days: 7
