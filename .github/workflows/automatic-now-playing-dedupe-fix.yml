name: Apply Automatic Now Playing Dedupe Fix

"on":
  push:
    branches:
      - repair/automatic-now-playing-dedupe-20260806
    paths:
      - .github/workflows/automatic-now-playing-dedupe-fix.yml

permissions:
  contents: write

concurrency:
  group: automatic-now-playing-dedupe-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-verify-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 99eb6f3eb32c7c0785e8ca3f16e9ee620a48cb2f
      PATCH_SHA: 481574542a709f2e81ee53a276755e1d5f78d5ab0960c6b7d405ef6fa182031b
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply minimal dedupe repair
        shell: bash
        run: |
          set -euo pipefail
          echo "${PATCH_SHA}  .github/automatic-now-playing-dedupe-fix.patch" | sha256sum --check --strict
          git apply --check .github/automatic-now-playing-dedupe-fix.patch
          git apply .github/automatic-now-playing-dedupe-fix.patch

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete verification
        run: npm run verify

      - name: Verify automatic destination ownership and mirrors
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum js/addons/discord-player-addon-v3.js | cut -d' ' -f1)" = "3e61d6897d0f5eee74c3acc596103f591bb951f6d1323f210fa30057f94f813b"
          test "$(sha256sum public/js/addons/discord-player-addon-v3.js | cut -d' ' -f1)" = "3e61d6897d0f5eee74c3acc596103f591bb951f6d1323f210fa30057f94f813b"
          test "$(sha256sum tests/direct-discord-runtime-owner-repair.test.mjs | cut -d' ' -f1)" = "5540e007f1f4199603bdd1caa02aeec0a499a9767c6b13b6cd86f18e06621a7c"
          test "$(sha256sum tests/discord-startup-autopost-retry.test.mjs | cut -d' ' -f1)" = "0b52c2b56b50697571fe9acb80060ca9094051d8b8331f3ede2faf31c83bed3e"
          cmp -s js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js
          grep -F "commitsAutomaticKey = data.directTarget === loadDirectSettings().autoTarget" js/addons/discord-player-addon-v3.js
          grep -F "if (commitsAutomaticKey && lifecycleIsCurrent(postLifecycle)" js/addons/discord-player-addon-v3.js

      - name: Remove transport files and verify exact final scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/automatic-now-playing-dedupe-fix.patch
          rm -f .github/workflows/automatic-now-playing-dedupe-fix.yml
          git add -A
          cat > /tmp/expected-files.txt <<'EOF'
          js/addons/discord-player-addon-v3.js
          public/js/addons/discord-player-addon-v3.js
          tests/direct-discord-runtime-owner-repair.test.mjs
          tests/discord-startup-autopost-retry.test.mjs
          EOF
          git diff --cached --name-only "${BASE_SHA}" | LC_ALL=C sort > /tmp/actual-files.txt
          LC_ALL=C sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          test "$(wc -l < /tmp/actual-files.txt)" -eq 4
          test -z "$(git diff --cached --name-only "${BASE_SHA}" | grep -E '^\.github/' || true)"

      - name: Commit clean verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve automatic Now Playing delivery after manual category posts"
          git push origin HEAD:${GITHUB_REF_NAME}
