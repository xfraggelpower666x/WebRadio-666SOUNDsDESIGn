# Deploy trigger: canonical PW/Auth fallback repair 2026-07-19
name: Deploy WebRadio Cloudflare Workers

on:
  push:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - ".github/workflows/deploy-cloudflare-workers.yml"
      - "external-workers/**"
      - "public/**"
      - "worker.js"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "tests/**"
      - "worker-addons/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webradio-cloudflare-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Verify required AutoDJ production secret binding
        shell: bash
        env:
          S666_AUTODJ_SKIP_ACCESS_TOKEN: ${{ secrets.S666_AUTODJ_SKIP_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${S666_AUTODJ_SKIP_ACCESS_TOKEN:-}" ]]; then
            echo "::error::Required repository secret S666_AUTODJ_SKIP_ACCESS_TOKEN is not configured."
            exit 1
          fi
          echo "Required AutoDJ production secret binding is configured."

  deploy-password-worker:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: external-workers/666-system-pw-worker
          wranglerVersion: "4.111.0"
          command: deploy

  deploy-auth-worker:
    needs: deploy-password-worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: external-workers/666-system-auth-worker
          wranglerVersion: "4.111.0"
          command: deploy

  deploy-webradio-worker:
    needs: deploy-auth-worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Generate commit-bound production identity marker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const marker = {
            schema: '666pfs-666stream-deployed-commit-v1',
            systemId: '666PFS-666STREAM-DEPLOYMENT-001',
            sourceCommit: process.env.GITHUB_SHA,
            workflowRunId: process.env.GITHUB_RUN_ID,
            repository: process.env.GITHUB_REPOSITORY,
            productionBranch: process.env.GITHUB_REF_NAME,
            generatedAt: new Date().toISOString()
          };
          fs.writeFileSync(
            'public/666pfs-deployed-commit.json',
            `${JSON.stringify(marker, null, 2)}\n`,
            'utf8'
          );
          NODE

      # Cloudflare 10215: upload the AutoDJ token in the same Worker code deploy.
      # No secret values are printed or committed; the transient payload is deleted.
      - name: Prepare ephemeral Wrangler secrets file
        shell: bash
        env:
          S666_AUTODJ_SKIP_ACCESS_TOKEN: ${{ secrets.S666_AUTODJ_SKIP_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const token = process.env.S666_AUTODJ_SKIP_ACCESS_TOKEN;
          if (!token) {
            console.error('Required AutoDJ secret not configured');
            process.exit(1);
          }
          const file = path.join(process.env.RUNNER_TEMP, '666stream-webradio-deploy-secrets.json');
          fs.writeFileSync(file, JSON.stringify({ S666_AUTODJ_SKIP_ACCESS_TOKEN: token }), { mode: 0o600 });
          NODE

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.111.0"
          command: deploy --secrets-file ${{ runner.temp }}/666stream-webradio-deploy-secrets.json

      - name: Remove ephemeral Wrangler secrets file
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/666stream-webradio-deploy-secrets.json"
