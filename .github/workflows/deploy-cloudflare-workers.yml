# Deploy trigger: verified Veluna overlay/auth/PC repair 2026-07-19
name: Deploy WebRadio Cloudflare Workers

on:
  push:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - ".github/workflows/deploy-cloudflare-workers.yml"
      - "external-workers/**"
      - "public/**"
      - "worker.js"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "tests/**"
      - "worker-addons/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webradio-cloudflare-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  deploy-password-worker:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: external-workers/666-system-pw-worker
          wranglerVersion: "4.111.0"
          command: deploy

  deploy-auth-worker:
    needs: deploy-password-worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: external-workers/666-system-auth-worker
          wranglerVersion: "4.111.0"
          command: deploy

  deploy-webradio-worker:
    needs: deploy-auth-worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.111.0"
          command: deploy
