name: Diagnose Discord Worker Secret Bindings

on:
  push:
    branches:
      - repair/discord-secret-binding-diagnostics-20260808
    paths:
      - ".github/workflows/diagnose-discord-worker-secret-bindings.yml"
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - ".github/workflows/diagnose-discord-worker-secret-bindings.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read Cloudflare secret names only
        id: secret_names
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.111.0 secret list --name webradio-666soundsdesign-worker --format json > /tmp/s666-secret-list.json
          node <<'NODE'
          const fs = require('node:fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/s666-secret-list.json', 'utf8'));
          const names = Array.isArray(raw)
            ? raw.map(item => typeof item === 'string' ? item : item && item.name).filter(Boolean)
            : [];
          names.sort();

          const groups = {
            main: [
              'DISCORD_WEBHOOK_URL',
              'DISCORD_WEBHOOK',
              'DISCORD_WEBHOOK_URI',
              'DISCORD_WEBHOOK_ENDPOINT',
              'WEBHOOK_URL'
            ],
            secondary: [
              'DISCORD_WEBHOOK_URL2',
              'DISCORD_WEBHOOK_2',
              'DISCORD_SECONDARY_WEBHOOK_URL',
              'DISCORD_BROADCAST_WEBHOOK_URL2'
            ],
            privateTrack: [
              'DISCORD_PRIVATE_TRACK_WEBHOOK_URL',
              'DISCORD_PRIVATE_WEBHOOK_URL',
              'DISCORD_RUBY_TRACK_WEBHOOK_URL',
              'DISCORD_TRACK_PRIVATE_WEBHOOK',
              'PRIVATE_DISCORD_WEBHOOK_URL',
              'PRIVATE_TRACK_SHOOTER'
            ]
          };

          const present = wanted => wanted.filter(name => names.includes(name));
          const report = {
            worker: 'webradio-666soundsdesign-worker',
            security: 'SECRET_VALUES_NOT_READ_OR_PRINTED',
            totalSecretNames: names.length,
            discord: {
              mainAliasesPresent: present(groups.main),
              secondaryAliasesPresent: present(groups.secondary),
              privateTrackAliasesPresent: present(groups.privateTrack)
            },
            possibleAliasCollision: {
              main: present(groups.main).length > 1,
              secondary: present(groups.secondary).length > 1,
              privateTrack: present(groups.privateTrack).length > 1
            }
          };

          fs.writeFileSync('/tmp/s666-discord-secret-binding-report.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Upload secret-safe diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: s666-discord-secret-binding-report
          path: /tmp/s666-discord-secret-binding-report.json
          if-no-files-found: error
          retention-days: 7
