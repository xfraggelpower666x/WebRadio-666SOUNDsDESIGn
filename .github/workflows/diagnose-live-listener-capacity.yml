name: Apply Live Listener Capacity Repair

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-live-listener-capacity.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/live-maxlisteners-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch player max-listener fallback and remove diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          files = [Path('js/player-core.js'), Path('public/js/player-core.js')]
          for path in files:
              text = path.read_text(encoding='utf-8')
              marker = "function parseMetadata(payload) {"
              if text.count(marker) != 1:
                  raise SystemExit(f'{path}: parseMetadata marker count != 1')
              text = text.replace(marker, "const MAX_LISTENERS_UNKNOWN = '—';\n\nfunction parseMetadata(payload) {", 1)

              old_idle = "      listeners: '0 / 250',"
              new_idle = "      listeners: `0 / ${MAX_LISTENERS_UNKNOWN}` ,"
              if text.count(old_idle) != 1:
                  raise SystemExit(f'{path}: idle 250 marker count != 1')
              text = text.replace(old_idle, new_idle, 1)

              old_max = "  const max = payload.maxlisteners || payload.maxListeners || payload.listener_capacity || 250;"
              new_max = "  const rawMaxListeners = payload.maxlisteners ?? payload.maxListeners ?? payload.listener_capacity ?? payload.listenerCapacity;\n  const parsedMaxListeners = Number(rawMaxListeners);\n  const max = Number.isFinite(parsedMaxListeners) && parsedMaxListeners > 0\n    ? Math.round(parsedMaxListeners)\n    : MAX_LISTENERS_UNKNOWN;"
              if text.count(old_max) != 1:
                  raise SystemExit(f'{path}: max 250 marker count != 1')
              text = text.replace(old_max, new_max, 1)
              path.write_text(text, encoding='utf-8')
          PY
          rm -f tests/live-listener-capacity-diagnostic.test.mjs
          rm -f .github/workflows/diagnose-live-listener-capacity.yml
      - name: Verify repository
        run: |
          npm ci
          npm run verify
      - name: Commit clean repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'fix: read max listeners from live stream stats'
          git push origin HEAD:repair/live-maxlisteners-20260816
