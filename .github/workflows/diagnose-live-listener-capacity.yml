name: Diagnose Live Listener Capacity

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-live-listener-capacity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect public stream status capacity
        shell: bash
        run: |
          set -Eeuo pipefail
          urls=(
            'https://webradio.666soundsdesign-broadcaster.com/api/nowplaying?diag=listener-capacity'
            'https://my.idjstream.com/cp/get_info.php?p=8686&diag=listener-capacity'
            'https://my.idjstream.com:8686/status-json.xsl'
            'https://my.idjstream.com:8686/stats?sid=1&json=1'
            'https://my.idjstream.com:8686/statistics?json=1'
          )
          labels=(LIVE_PROXY UPSTREAM_META ICECAST_STATUS SHOUTCAST_STATS SHOUTCAST_STATISTICS)
          for i in "${!urls[@]}"; do
            file="$(mktemp)"
            code="$(curl -k -sS -L --connect-timeout 4 --max-time 6 -H 'Cache-Control: no-cache' -o "$file" -w '%{http_code}' "${urls[$i]}" || true)"
            echo "${labels[$i]}_HTTP=${code:-curl_error}"
            if [[ "$code" == "200" && -s "$file" ]]; then
              LABEL="${labels[$i]}" FILE="$file" node <<'NODE'
              const fs = require('node:fs');
              const raw = fs.readFileSync(process.env.FILE, 'utf8');
              let value;
              try { value = JSON.parse(raw); } catch { value = { __nonJsonLength: raw.length, __preview: raw.slice(0, 100).replace(/\s+/g, ' ') }; }
              const found = {};
              const walk = (v, p='') => {
                if (!v || typeof v !== 'object') return;
                for (const [k, x] of Object.entries(v)) {
                  const path = p ? `${p}.${k}` : k;
                  if (/listen|max|client|slot|capacity/i.test(k) && (typeof x === 'number' || /^\d+$/.test(String(x)))) found[path] = x;
                  if (x && typeof x === 'object') walk(x, path);
                }
              };
              walk(value);
              console.log(`${process.env.LABEL}_KEYS=${Object.keys(value).sort().join(',')}`);
              console.log(`${process.env.LABEL}_LISTENER_FIELDS=${JSON.stringify(found)}`);
              NODE
            fi
            rm -f "$file"
          done
