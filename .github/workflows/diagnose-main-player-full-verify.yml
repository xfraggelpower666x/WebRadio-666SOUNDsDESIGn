name: Diagnose Main Player Full Verify

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-main-player-reactivity-metadata-20260723
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact repaired state
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/finalize-main-player-live-reactivity.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Prepare canonical repair payload\n        shell: python\n        run: |\n'
          end_marker = '      - name: Repair canonical visual and metadata ownership\n'
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, 'prepare-main-reactive.py', 'exec'), {'__name__':'__main__'})
          exec(compile(Path('/tmp/transform-main-reactive.py').read_text(encoding='utf-8'), 'transform-main-reactive.py', 'exec'), {'__name__':'__main__'})
          for path in [Path('css/audio-policy-core.css'), Path('public/css/audio-policy-core.css')]:
              source = path.read_text(encoding='utf-8')
              old = ':is(.veluna-global-header img,.mff-cyber-header img,.s666-main-header img)'
              new = ':is(.veluna-global-header img,.mff-cyber-header img,.s666-main-header img,.s666-canonical-header-image)'
              path.write_text(source.replace(old, new, 1), encoding='utf-8')
      - name: Capture full verification output
        shell: bash
        run: |
          set +e
          npm run verify > /tmp/main-player-full-verify.log 2>&1
          echo $? > /tmp/main-player-full-verify-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: main-player-full-verify-diagnostic
          path: |
            /tmp/main-player-full-verify.log
            /tmp/main-player-full-verify-exit.txt
