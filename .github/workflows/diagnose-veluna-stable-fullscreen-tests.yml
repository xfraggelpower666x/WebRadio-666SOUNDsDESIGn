name: Diagnose VELUNA Stable Fullscreen Tests

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-veluna-stable-fullscreen-no-reboot-20260723
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply the same repair in diagnostic workspace
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/finalize-veluna-stable-fullscreen-v2.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Apply verified repair and reconcile legacy contracts\n        shell: python\n        run: |\n'
          end_marker = '      - name: JavaScript syntax\n'
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, 'diagnostic-repair.py', 'exec'), {'__name__':'__main__'})
      - name: Run contracts separately
        shell: bash
        run: |
          set +e
          : > failed-tests.txt
          node scripts/check-release.mjs > check-release.log 2>&1
          if [ $? -ne 0 ]; then echo 'scripts/check-release.mjs' >> failed-tests.txt; fi
          for file in tests/*.test.mjs; do
            node --test "$file" > "$(basename "$file").log" 2>&1
            if [ $? -ne 0 ]; then echo "$file" >> failed-tests.txt; fi
          done
          if [ ! -s failed-tests.txt ]; then echo 'NONE' > failed-tests.txt; fi
          cat failed-tests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: veluna-stable-fullscreen-failed-tests
          path: |
            failed-tests.txt
            *.log
