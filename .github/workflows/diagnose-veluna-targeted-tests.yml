name: Diagnose Targeted VELUNA Tests

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-veluna-mobile-layout-central-runtime-20260722
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply the same targeted repair in the diagnostic workspace
        shell: python
        run: |
          from pathlib import Path
          source = Path('.github/workflows/finalize-veluna-targeted-repair.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Apply targeted repair in existing layers\n        shell: python\n        run: |\n'
          end_marker = '      - name: JavaScript syntax\n'
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, 'targeted-veluna-repair.py', 'exec'), {'__name__':'__main__'})
      - name: Release structure check
        run: npm run check
      - name: Run every Node contract separately
        id: contracts
        continue-on-error: true
        shell: bash
        run: |
          : > failing-tests.txt
          for file in tests/*.test.mjs; do
            echo "=== $file ==="
            if ! node --test "$file"; then
              echo "$file" >> failing-tests.txt
            fi
          done
          if [ -s failing-tests.txt ]; then exit 1; fi
      - name: Upload failed contract names
        if: steps.contracts.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: veluna-failing-contracts
          path: failing-tests.txt
          if-no-files-found: error
