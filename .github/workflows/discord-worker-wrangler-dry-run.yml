name: Discord Worker Wrangler Dry Run

on:
  pull_request:

permissions:
  contents: read

jobs:
  wrangler-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wrangler production-config bundle check
        run: npx --yes wrangler@4.111.0 deploy --dry-run --config wrangler.jsonc
