name: Finalize AutoSkip Auth Chain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply AutoSkip authority and auth-error repair
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def once(text, old, new, label):
              count = text.count(old)
              if count != 1: raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          # 1. Central MyIDJ worker proxy contract.
          for path in ['worker-addons/skip-api-addon.js', 'workers/webradio-666soundsdesign-worker/worker-addons/skip-api-addon.js']:
              text = read(path)
              text = once(text, 'VERSION: 1.0.3', 'VERSION: 1.1.0', f'{path} version')
              old = '''function myIdjWorkerUrl(env = {}) {
  return String(env.MYIDJ_WORKER_SKIP_URL || env.MYIDJ_PUBLIC_SKIP_URL || DEFAULT_MYIDJ_SKIP_URL).trim();
}
'''
              new = '''function myIdjWorkerUrl(env = {}) {
  return String(env.MYIDJ_WORKER_SKIP_URL || env.MYIDJ_PUBLIC_SKIP_URL || DEFAULT_MYIDJ_SKIP_URL).trim();
}

function myIdjWorkerToken(env = {}) {
  return String(env.MYIDJ_WORKER_ADMIN_TOKEN || env.MYIDJ_ADMIN_TOKEN || env.ADMIN_TOKEN || "").trim();
}

function myIdjProxyConfigured(env = {}) {
  return Boolean(myIdjWorkerUrl(env) && myIdjWorkerToken(env));
}

function normalizeMyIdjWorkerError(data = {}, status = 0) {
  const raw = String(data?.error || data?.message || "").trim();
  const normalized = raw.toLowerCase().replace(/[^a-z0-9_]+/g, "_").replace(/^_+|_+$/g, "");
  if (status === 401 || normalized === "unauthorized" || normalized.includes("admin_token")) return "myidj_admin_token_rejected";
  if (normalized === "skip_target_not_configured") return "skip_target_not_configured";
  if (normalized === "worker_exception") return "myidj_worker_exception";
  if (normalized === "method_not_allowed_use_post") return "myidj_method_contract_error";
  return normalized || `myidj_skip_http_${status || 502}`;
}
'''
              text = once(text, old, new, f'{path} worker helpers')
              pattern = re.compile(r'''async function proxyMyIdjSkip\(request, env = \{\}\) \{.*?\n\}\n\nexport async function handleSkipApi''', re.S)
              replacement = '''export async function callMyIdjSkip(payload = {}, env = {}) {
  const target = myIdjWorkerUrl(env);
  if (!target) return { ok: false, success: false, status: 503, error: "myidj_worker_skip_url_missing", upstream: "myidj-worker" };
  const token = myIdjWorkerToken(env);
  if (!token) return { ok: false, success: false, status: 503, error: "myidj_admin_token_missing", upstream: "myidj-worker" };

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8500);
  try {
    const headers = new Headers({
      accept: "application/json",
      "content-type": "application/json",
      "cache-control": "no-store",
      "user-agent": "666soundsdesign-main-worker-myidj-skip-proxy-v1.1.0",
      authorization: `Bearer ${token}`,
      "x-admin-token": token
    });
    const response = await fetch(target, {
      method: "POST",
      headers,
      body: JSON.stringify({ ...payload, source: payload.source || "main-player-myidj-proxy" }),
      redirect: "manual",
      signal: controller.signal
    });
    const text = await response.text().catch(() => "");
    let data = {};
    try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text.slice(0, 500) }; }
    if (!response.ok || data.ok === false) {
      return {
        ok: false,
        success: false,
        status: response.status || 502,
        error: normalizeMyIdjWorkerError(data, response.status),
        upstream: "myidj-worker",
        data
      };
    }
    return {
      ok: true,
      success: true,
      status: response.status,
      upstream: "myidj-worker",
      route: target.replace(/^https?:\\/\\//, ""),
      data
    };
  } catch (error) {
    return {
      ok: false,
      success: false,
      status: 502,
      error: error?.name === "AbortError" ? "myidj_skip_timeout" : "myidj_skip_unreachable",
      upstream: "myidj-worker"
    };
  } finally {
    clearTimeout(timer);
  }
}

async function proxyMyIdjSkip(request, env = {}) {
  if (!sameOriginEvidenceOk(request)) return json({ ok: false, error: "origin_rejected" }, 403);
  let payload = {};
  try { payload = await request.json(); } catch {}
  const result = await callMyIdjSkip(payload, env);
  return json(result, result.ok ? 200 : (result.status || 502));
}

export async function handleSkipApi'''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1: raise SystemExit(f'{path} proxy block: expected 1 match, got {count}')
              text = once(text,
                  '      configured: skipConfigured(env),\n',
                  '      configured: myIdjProxyConfigured(env),\n      myIdjAdminTokenConfigured: Boolean(myIdjWorkerToken(env)),\n      legacyDirectConfigured: skipConfigured(env),\n',
                  f'{path} status config')
              write(path, text)

          # 2. Protected admin route delegates to the central MyIDJ worker.
          for path in ['worker-addons/radio-admin-config-addon.js', 'workers/webradio-666soundsdesign-worker/worker-addons/radio-admin-config-addon.js']:
              text = read(path)
              text = once(text, 'VERSION: 1.0.2', 'VERSION: 1.1.0', f'{path} version')
              marker = '*/\n\nconst DEFAULT_CONFIG_PATH'
              text = once(text, marker, '*/\n\nimport { callMyIdjSkip } from "./skip-api-addon.js";\n\nconst DEFAULT_CONFIG_PATH', f'{path} import')
              text = once(text,
                  '    [/invalid password|password rejected|login rejected/, "password_rejected"],\n',
                  '    [/invalid password|password rejected/, "password_rejected"],\n    [/service auth rejected|service_auth_rejected/, "service_auth_rejected"],\n    [/login rate limited|login_rate_limited/, "login_rate_limited"],\n    [/login rejected|login_rejected/, "login_rejected"],\n    [/invalid json|non[- ]?json|protocol error|protocol_error/, "pw_login_protocol_error"],\n',
                  f'{path} error map')
              old = '''      const data = await response.json().catch(() => ({}));

      if (!response.ok || data?.ok !== true || !data?.token) {
        const error = normalizeAdminError(data?.error, "login_rejected");
        lastFailure = { status: response.status || 502, error };
        if (error === "password_rejected" || error === "login_rate_limited") break;
        continue;
      }
'''
              new = '''      const raw = await response.text().catch(() => "");
      let data = {};
      let jsonOk = false;
      try { data = raw ? JSON.parse(raw) : {}; jsonOk = true; } catch {}

      if (!response.ok || data?.ok !== true || !data?.token) {
        const fallback = response.status >= 500 ? `pw_login_http_${response.status}` : "login_rejected";
        const error = jsonOk ? normalizeAdminError(data?.error, fallback) : "pw_login_protocol_error";
        lastFailure = {
          status: response.status || 502,
          error,
          stage: "player-admin-login",
          upstream: loginUrl === CANONICAL_PW_LOGIN_URL ? "canonical" : "configured"
        };
        const definitivePasswordFailure = response.status === 401 && error === "password_rejected";
        if (definitivePasswordFailure || error === "login_rate_limited") break;
        continue;
      }
'''
              text = once(text, old, new, f'{path} login response parsing')
              text = once(text,
                  '  return adminJson({ ok: false, error: lastFailure.error }, lastFailure.status || 502);\n',
                  '  return adminJson({ ok: false, error: lastFailure.error, stage: lastFailure.stage || "player-admin-login", credentialType: "player-admin-password", upstream: lastFailure.upstream || null }, lastFailure.status || 502);\n',
                  f'{path} login failure response')
              old_skip = '''  const result = await performShoutcastSkip(env, "admin-player");
  if (!result.ok) return adminJson(result, 502);
  const until = Date.now() + cooldownMs;
  await writeSkipCooldown(cooldown.key, until);
  return adminJson({ ...result, cooldownMs, cooldownUntil: new Date(until).toISOString() });
'''
              new_skip = '''  const result = await callMyIdjSkip({ source: "admin-player" }, env);
  if (!result.ok) return adminJson(result, result.status || 502);
  const until = Date.now() + cooldownMs;
  await writeSkipCooldown(cooldown.key, until);
  return adminJson({ ...result, skipAuthority: "666myidjstreamadmin", cooldownMs, cooldownUntil: new Date(until).toISOString() });
'''
              text = once(text, old_skip, new_skip, f'{path} admin skip authority')
              text = once(text,
                  '    skipConfigured: skipConfig(env).configured\n',
                  '    skipConfigured: Boolean(env.MYIDJ_WORKER_ADMIN_TOKEN || env.MYIDJ_ADMIN_TOKEN || env.ADMIN_TOKEN),\n    skipAuthority: "666myidjstreamadmin",\n    myIdjWorkerAdminTokenConfigured: Boolean(env.MYIDJ_WORKER_ADMIN_TOKEN || env.MYIDJ_ADMIN_TOKEN || env.ADMIN_TOKEN),\n    legacyDirectSkipConfigured: skipConfig(env).configured\n',
                  f'{path} debug status')
              write(path, text)

          # 3. Frontend distinguishes Player Admin auth from Shoutcast credentials.
          for path in ['js/admin-auth-client.js', 'public/js/admin-auth-client.js']:
              text = read(path)
              text = once(text, 'HARDLOCK v1.2.6:', 'HARDLOCK v1.2.22:', f'{path} header version')
              text = once(text,
                  "      password_rejected: 'Das eingegebene Admin-Passwort stimmt nicht mit dem aktuell im Passwort-Worker gespeicherten Wert überein.',",
                  "      password_rejected: 'Das Player-Admin-Passwort wurde vom Passwort-Worker ausdrücklich abgelehnt. Der Shoutcast-Benutzername wird hier nicht geprüft.',",
                  f'{path} password message')
              text = once(text,
                  "      login_rejected: 'Der Passwort-Worker hat die Anmeldung abgelehnt. Worker-Version und Secrets prüfen.',",
                  "      login_rejected: 'Der Passwort-Worker hat die Anmeldung abgelehnt. Das ist kein bestätigter Passwortfehler; Worker-Route und Service-Token prüfen.',",
                  f'{path} login rejected message')
              text = once(text,
                  "      pw_login_unreachable: 'Passwort-Worker ist nicht erreichbar.',",
                  "      pw_login_unreachable: 'Passwort-Worker ist nicht erreichbar.',\n      pw_login_protocol_error: 'Die Passwort-Worker-Route lieferte keine gültige Login-Antwort. Wahrscheinlich falsche Route, alter Deploy-Stand oder HTML/Proxy-Fehler.',",
                  f'{path} protocol message')
              text = text.replace('>ADMIN AUTH</div>', '>PLAYER ADMIN AUTH</div>')
              text = text.replace('Admin-Passwort eingeben.</div>', 'Player-Admin-Passwort eingeben. Shoutcast-Benutzername und Stream-Passwort bleiben im Worker.</div>')
              text = text.replace("message || 'Admin-Passwort eingeben.'", "message || 'Player-Admin-Passwort eingeben (nicht Shoutcast-Login).'" )
              text = once(text,
                  "    version: '1.2.20-exact-auth-errors',",
                  "    version: '1.2.22-autoskip-auth-chain',",
                  f'{path} api version')
              write(path, text)

          for path in ['js/skip-control.js', 'public/js/skip-control.js']:
              text = read(path)
              old_norm = '''  function normalizeError(response, data) {
    if (data && data.retryAfterMs) return 'Skip-Cooldown: ' + Math.max(1, Math.ceil(Number(data.retryAfterMs) / 1000)) + ' s';
    return String((data && (data.error || data.message)) || (response ? 'HTTP ' + response.status : 'skip_failed'));
  }
'''
              new_norm = '''  function normalizeError(response, data) {
    if (data && (data.retryAfterMs || data.remainingMs)) return 'Skip-Cooldown: ' + Math.max(1, Math.ceil(Number(data.retryAfterMs || data.remainingMs) / 1000)) + ' s';
    var code = String((data && (data.error || data.message)) || (response ? 'HTTP ' + response.status : 'skip_failed'));
    var messages = {
      myidj_admin_token_missing: 'MyIDJ-Worker-Token fehlt im Haupt-Worker. Das Player-Passwort ist nicht die Ursache.',
      myidj_admin_token_rejected: 'MyIDJ-Worker-Token wurde abgelehnt. ADMIN_TOKEN und MYIDJ_WORKER_ADMIN_TOKEN müssen übereinstimmen.',
      skip_target_not_configured: 'Der MyIDJ-Worker hat kein gültiges Shoutcast-Skip-Ziel konfiguriert.',
      myidj_skip_unreachable: 'Der zentrale MyIDJ-Skip-Worker ist nicht erreichbar.',
      myidj_skip_timeout: 'Der zentrale MyIDJ-Skip-Worker antwortet nicht rechtzeitig.',
      myidj_worker_exception: 'Der zentrale MyIDJ-Skip-Worker meldet einen internen Fehler.'
    };
    return messages[code] || code;
  }
'''
              text = once(text, old_norm, new_norm, f'{path} error normalization')
              text = text.replace("options.prompt || 'Admin-Passwort für Auto-DJ Skip eingeben:'", "options.prompt || 'Player-Admin-Passwort für Auto-DJ Skip eingeben (nicht Shoutcast-Login):'")
              write(path, text)

          # 4. Cache-bust every player/worker mirror without touching layout.
          cache_files = ['index.html','public/index.html','VELUNA/index.html','public/VELUNA/index.html','veluna/index.html','public/veluna/index.html','worker.js','workers/webradio-666soundsdesign-worker/worker.js']
          for path in cache_files:
              text = read(path)
              text = re.sub(r'admin-auth-client\.js\?v=[^"\'<>\\s]+', 'admin-auth-client.js?v=2026-07-24-autoskip-auth-v1222', text)
              text = re.sub(r'skip-control\.js\?v=[^"\'<>\\s]+', 'skip-control.js?v=2026-07-24-autoskip-authority-v2', text)
              text = text.replace('Admin-Passwort für VELUNA Auto-DJ Skip eingeben:', 'Player-Admin-Passwort für VELUNA Auto-DJ Skip eingeben (nicht Shoutcast-Login):')
              write(path, text)

          # 5. Regression tests.
          admin_test = Path('tests/admin-hardlock.test.mjs')
          text = admin_test.read_text(encoding='utf-8')
          addition = '''\n\ntest("generic login_rejected from a stale configured route falls back and is not called password_rejected", async () => {
  const seen = [];
  await withMockFetch(async (url) => {
    const value = String(url);
    seen.push(value);
    if (value.includes("configured-pw.example")) return Response.json({ ok: false, error: "login_rejected" }, { status: 403 });
    if (value.includes("666-system-pw")) return Response.json({ ok: true, token: "abc.def", expiresAt: FUTURE });
    if (value.includes("666-system-auth")) return Response.json({ ok: true, valid: true, payload: { iss: "666-system-pw", aud: AUDIENCE, scope: "admin", exp: FUTURE } });
    throw new Error("unexpected_fetch:" + value);
  }, async () => {
    const response = await handleRadioAdminConfigAddon(request("/api/admin/login", {
      method: "POST",
      headers: { origin: "https://radio.test", "content-type": "application/json" },
      body: JSON.stringify({ password: "correct" })
    }), {
      PW_LOGIN_URL: "https://configured-pw.example/login",
      ADMIN_SERVICE_ORIGIN: "https://radio.test",
      ADMIN_SERVICE_TOKEN: "service-secret",
      AUTH_AUDIENCE: AUDIENCE
    });
    assert.equal(response.status, 200);
    assert.equal((await response.json()).ok, true);
    assert.deepEqual(seen, [
      "https://configured-pw.example/login",
      "https://666-system-pw.666soundsdesign-broadcaster.com/login",
      "https://666-system-auth.666soundsdesign-broadcaster.com/verify"
    ]);
  });
});
'''
          if 'generic login_rejected from a stale configured route' not in text: text += addition
          admin_test.write_text(text, encoding='utf-8')

          Path('tests/autoskip-auth-chain.test.mjs').write_text('''// AutoSkip authority and authentication-chain regression contract v1.0.0.
import test from "node:test";
import assert from "node:assert/strict";
import { handleRadioAdminConfigAddon } from "../worker-addons/radio-admin-config-addon.js";

const FUTURE = Math.floor(Date.now() / 1000) + 3600;
const AUDIENCE = "666SOUNDsDESIGn-WebRadio-Admin";
function req(path, init = {}) { return new Request(`https://radio.test${path}`, init); }
async function withMockFetch(mock, fn) { const original = globalThis.fetch; globalThis.fetch = mock; try { return await fn(); } finally { globalThis.fetch = original; } }
function validAuth() { return Response.json({ ok: true, valid: true, payload: { iss: "666-system-pw", aud: AUDIENCE, scope: "admin", exp: FUTURE } }); }

test("protected AutoSkip delegates to 666myidjstreamadmin with a server-side token", async () => {
  const seen = [];
  await withMockFetch(async (url, init = {}) => {
    const value = String(url); const headers = new Headers(init.headers || {}); seen.push({ value, authorization: headers.get("authorization"), adminToken: headers.get("x-admin-token") });
    if (value.includes("auth.test")) return validAuth();
    if (value.includes("myidj.test")) return Response.json({ ok: true, action: "skip", status: 200 });
    throw new Error(`unexpected_fetch:${value}`);
  }, async () => {
    const response = await handleRadioAdminConfigAddon(req("/api/admin/skip", { method: "POST", headers: { origin: "https://radio.test", authorization: "Bearer player-token", "content-type": "application/json" }, body: "{}" }), {
      ADMIN_AUTH_VERIFY_URL: "https://auth.test/verify", AUTH_AUDIENCE: AUDIENCE,
      MYIDJ_WORKER_SKIP_URL: "https://myidj.test/api/radio/skip", MYIDJ_WORKER_ADMIN_TOKEN: "myidj-secret"
    });
    const data = await response.json();
    assert.equal(response.status, 200); assert.equal(data.ok, true); assert.equal(data.skipAuthority, "666myidjstreamadmin");
    assert.equal(seen.length, 2); assert.equal(seen[1].authorization, "Bearer myidj-secret"); assert.equal(seen[1].adminToken, "myidj-secret");
    assert.doesNotMatch(seen.map(item => item.value).join(" "), /admin\.cgi/);
  });
});

test("missing MyIDJ worker token is reported as configuration error, not wrong password", async () => {
  await withMockFetch(async (url) => String(url).includes("auth.test") ? validAuth() : (() => { throw new Error("unexpected"); })(), async () => {
    const response = await handleRadioAdminConfigAddon(req("/api/admin/skip", { method: "POST", headers: { origin: "https://radio.test", authorization: "Bearer player-token", "content-type": "application/json" }, body: "{}" }), {
      ADMIN_AUTH_VERIFY_URL: "https://auth.test/verify", AUTH_AUDIENCE: AUDIENCE, MYIDJ_WORKER_SKIP_URL: "https://myidj.test/api/radio/skip"
    });
    const data = await response.json();
    assert.equal(response.status, 503); assert.equal(data.error, "myidj_admin_token_missing"); assert.notEqual(data.error, "password_rejected");
  });
});

test("MyIDJ token rejection remains distinct from Player Admin password rejection", async () => {
  await withMockFetch(async (url) => {
    const value = String(url); if (value.includes("auth.test")) return validAuth();
    if (value.includes("myidj.test")) return Response.json({ ok: false, error: "UNAUTHORIZED" }, { status: 401 });
    throw new Error(`unexpected_fetch:${value}`);
  }, async () => {
    const response = await handleRadioAdminConfigAddon(req("/api/admin/skip", { method: "POST", headers: { origin: "https://radio.test", authorization: "Bearer player-token", "content-type": "application/json" }, body: "{}" }), {
      ADMIN_AUTH_VERIFY_URL: "https://auth.test/verify", AUTH_AUDIENCE: AUDIENCE,
      MYIDJ_WORKER_SKIP_URL: "https://myidj.test/api/radio/skip", MYIDJ_WORKER_ADMIN_TOKEN: "wrong-token"
    });
    const data = await response.json();
    assert.equal(response.status, 401); assert.equal(data.error, "myidj_admin_token_rejected"); assert.notEqual(data.error, "password_rejected");
  });
});
''', encoding='utf-8')

          # Update exact legacy version expectations if present.
          for path in Path('tests').glob('*.mjs'):
