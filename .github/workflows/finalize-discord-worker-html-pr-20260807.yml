name: Finalize Discord Worker HTML PR 20260807

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'repair/discord-worker-restore-20260807-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/discord-worker-restore-20260807-final
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final Worker override repair
        run: python .github/finalize-discord-worker-html-20260807.py
      - name: Verify complete repository
        run: |
          node --check js/addons/discord-player-addon-v3.js
          npm ci
          npm test
          npm run verify
          cmp -s js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js
          cmp -s index.html public/index.html
          cmp -s VELUNA/index.html veluna/index.html
          cmp -s VELUNA/index.html public/VELUNA/index.html
          cmp -s VELUNA/index.html public/veluna/index.html
      - name: Commit clean final repair
        run: |
          rm -f .github/workflows/finalize-discord-worker-html-pr-20260807.yml
          rm -f .github/finalize-discord-worker-html-20260807.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Activate Worker transport in all production player mirrors"
          git push origin HEAD:repair/discord-worker-restore-20260807-final
