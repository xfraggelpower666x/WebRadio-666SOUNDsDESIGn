name: Finalize Main Now Playing PR

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-main-now-playing-single-writer-20260722
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Execute stored single-writer repair
        shell: python
        run: |
          from pathlib import Path
          source = Path('.github/workflows/finalize-main-now-playing-single-writer.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Apply single-writer repair\n        shell: python\n        run: |\n'
          end_marker = '      - name: JavaScript syntax\n'
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, 'stored-single-writer-repair.py', 'exec'), {'__name__':'__main__'})
      - name: JavaScript syntax
        run: |
          node --check js/addons/discord-player-addon-v3.js
          node --check js/player-core.js
          node --check js/veluna-ui.js
          node --check js/veluna-splash.js
      - name: Single-writer contract
        run: node --test tests/main-now-playing-single-writer.test.mjs
      - name: Full repository verification
        run: npm run verify
      - name: Commit final repaired state
        run: |
          rm -f .github/workflows/finalize-main-now-playing-single-writer.yml
          rm -f .github/workflows/finalize-main-now-playing-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Repair main Now Playing single-writer ownership"
          git push origin HEAD:repair-main-now-playing-single-writer-20260722
