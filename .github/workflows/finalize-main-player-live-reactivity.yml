name: Finalize Main Player Live Reactivity

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-main-player-reactivity-metadata-20260723
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Prepare canonical repair payload
        shell: python
        run: |
          from pathlib import Path
          import base64, zlib
          payloads = {
            '/tmp/player-stage-v2.js': '',
            '/tmp/player-stage-v2.css': '',
            '/tmp/effects.css': '',
            '/tmp/audio-policy-core.css': '',
            '/tmp/transform-main-reactive.py': '',
            '/tmp/transform-main-reactive.py': ''}
          for target, packed in payloads.items():
              Path(target).write_bytes(zlib.decompress(base64.b64decode(packed)))
      - name: Repair canonical visual and metadata ownership
        run: python /tmp/transform-main-reactive.py
      - name: JavaScript syntax
        run: |
          node --check js/player-stage-v2.js
          node --check js/equalizer.js
          node --check js/player-core.js
          node --check js/veluna-ui.js
      - name: Targeted live-reactive contract
        run: node --test tests/main-player-reactive-visual-contract.test.mjs
      - name: Full repository verification
        run: npm run verify
      - name: Python syntax audit without bytecode
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('.').rglob('*.py'):
              if any(part in {'.git','node_modules','.venv','venv'} for part in path.parts):
                  continue
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print('Python syntax PASS')
          PY
      - name: Remove temporary workflow and publish repaired state
        run: |
          rm -f .github/workflows/finalize-main-player-live-reactivity.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Repair main player live audio reactivity and metadata presentation"
          git push origin HEAD:repair-main-player-reactivity-metadata-20260723
