name: Finalize PC EQ Balanced Headroom

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply balanced visual headroom repair
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          for path in ['js/equalizer.js', 'public/js/equalizer.js']:
              text = read(path)
              text = replace_once(text,
                  '666SOUNDsDESIGn canonical audio visualizer authority V13.',
                  '666SOUNDsDESIGn canonical audio visualizer authority V14.',
                  f'{path} authority version')
              text = replace_once(text,
                  'Twenty-four independent logarithmic real-frequency bands with perceptual high-frequency compensation.',
                  'Twenty-four independent logarithmic real-frequency bands with balanced perceptual compensation and peak headroom.',
                  f'{path} authority description')
              text = replace_once(text,
                  "      highFrequencyCompensation: true,\n",
                  "      highFrequencyCompensation: true,\n      visualHeadroom: 'balanced',\n      visualCeiling: 'peak-dependent',\n",
                  f'{path} meter bus diagnostics')
              text = replace_once(text,
                  '      if (bandReference.length !== bandCount) bandReference = new Array(bandCount).fill(18);',
                  '      if (bandReference.length !== bandCount) bandReference = new Array(bandCount).fill(24);',
                  f'{path} reference initialization')

              pattern = re.compile(r"""        const localGate = clamp\(\(local - 2\) / 14, 0, 1\);\n        const currentReference = bandReference\[index\] \|\| 18;\n        const desiredReference = Math\.max\(8, local\);\n        bandReference\[index\] = desiredReference > currentReference\n\s*\? currentReference \+ \(desiredReference - currentReference\) \* 0\.08\n\s*: Math\.max\(8, currentReference \* 0\.9985\);\n        const relative = clamp\(local / Math\.max\(8, bandReference\[index\]\), 0, 1\);\n        const visualTilt = 1 \+ Math\.pow\(position, 1\.18\) \* 1\.10;\n        const spectral = Math\.pow\(absolute, 0\.52\) \* visualTilt;\n        const spectralResponse = spectral \* \(0\.35 \+ localGate \* 0\.65\);\n        const adaptiveResponse = Math\.pow\(relative, 0\.70\) \* 0\.22 \* localGate;\n        const target = signalPresent && localGate > 0\n\s*\? clamp\(spectralResponse \* 0\.92 \+ adaptiveResponse, 0\.012, 1\)\n\s*: 0\.012;\n        const previous = bandEnvelope\[index\] \|\| 0\.012;\n        const attack = 0\.76 \+ position \* 0\.12;\n        const release = 0\.15 \+ position \* 0\.03;""")
              replacement = """        const localGate = clamp((local - 6) / 26, 0, 1);
        const currentReference = bandReference[index] || 24;
        const desiredReference = Math.max(14, local);
        bandReference[index] = desiredReference > currentReference
          ? currentReference + (desiredReference - currentReference) * 0.025
          : Math.max(14, currentReference * 0.9994);
        const relative = clamp(local / Math.max(14, bandReference[index]), 0, 1);
        const visualTilt = 1 + Math.pow(position, 1.24) * 0.34;
        const spectral = Math.pow(absolute, 0.74) * visualTilt;
        const spectralResponse = spectral * (0.20 + localGate * 0.80);
        const adaptiveResponse = Math.pow(relative, 0.82) * 0.065 * localGate;
        const transient = clamp((localPeak - average) / 255, 0, 1);
        const transientResponse = Math.pow(transient, 0.72) * 0.14 * localGate;
        const energy = spectralResponse * 0.68 + adaptiveResponse + transientResponse;
        const peakHeadroom = 0.78 + clamp(localPeak / 255, 0, 1) * 0.22;
        const target = signalPresent && localGate > 0
          ? clamp(energy, 0.012, peakHeadroom)
          : 0.012;
        const previous = bandEnvelope[index] || 0.012;
        const attack = 0.62 + position * 0.08;
        const release = 0.13 + position * 0.02;"""
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{path} compensation block: expected 1 match, got {count}')
              write(path, text)

          for path in ['index.html', 'public/index.html', 'js/player-core.js', 'public/js/player-core.js']:
              text = read(path)
              count = text.count('2026-07-24-high-response-v13')
              if count < 1:
                  raise SystemExit(f'{path} cache marker missing')
              write(path, text.replace('2026-07-24-high-response-v13', '2026-07-24-balanced-headroom-v14'))

          for path in ['tests/pc-high-frequency-response.test.mjs', 'tests/pc-real-spectrum-layout.test.mjs', 'tests/frontend-contracts.test.mjs']:
              text = read(path)
              text = text.replace('canonical audio visualizer authority V13', 'canonical audio visualizer authority V14')
              text = text.replace('2026-07-24-high-response-v13', '2026-07-24-balanced-headroom-v14')
              write(path, text)

          path = 'tests/pc-high-frequency-response.test.mjs'
          text = read(path)
          text = replace_once(text,
              "// PC high-frequency response regression contract v1.0.1.",
              "// PC high-frequency response regression contract v1.1.0.",
              'high-frequency contract version')
          old = """  assert.match(eq, /const visualTilt = 1 \\+ Math\\.pow\\(position, 1\\.18\\) \\* 1\\.10/);
  assert.match(eq, /const localGate = clamp\\(\\(local - 2\\) \\/ 14/);
  assert.match(eq, /const adaptiveResponse = Math\\.pow\\(relative, 0\\.70\\) \\* 0\\.22 \\* localGate/);
  assert.match(eq, /const attack = 0\\.76 \\+ position \\* 0\\.12/);"""
          new = """  assert.match(eq, /const visualTilt = 1 \\+ Math\\.pow\\(position, 1\\.24\\) \\* 0\\.34/);
  assert.match(eq, /const localGate = clamp\\(\\(local - 6\\) \\/ 26/);
  assert.match(eq, /const adaptiveResponse = Math\\.pow\\(relative, 0\\.82\\) \\* 0\\.065 \\* localGate/);
  assert.match(eq, /const transientResponse = Math\\.pow\\(transient, 0\\.72\\) \\* 0\\.14 \\* localGate/);
  assert.match(eq, /const energy = spectralResponse \\* 0\\.68 \\+ adaptiveResponse \\+ transientResponse/);
  assert.match(eq, /const peakHeadroom = 0\\.78 \\+ clamp\\(localPeak \\/ 255, 0, 1\\) \\* 0\\.22/);
  assert.match(eq, /const attack = 0\\.62 \\+ position \\* 0\\.08/);
  assert.match(eq, /visualHeadroom: 'balanced'/);
  assert.doesNotMatch(eq, /position, 1\\.18\\) \\* 1\\.10|spectralResponse \\* 0\\.92|0\\.22 \\* localGate/);"""
          text = replace_once(text, old, new, 'high-frequency compensation assertions')
          write(path, text)

          Path('tests/pc-eq-balanced-headroom.test.mjs').write_text("""// PC EQ balanced-headroom regression contract v1.0.0.
import test from 'node:test';
import assert from 'node:assert/strict';
import { readFile } from 'node:fs/promises';
const read = path => readFile(new URL(`../${path}`, import.meta.url), 'utf8');

test('PC EQ keeps logarithmic mapping while restoring visual headroom', async () => {
  const eq = await read('js/equalizer.js');
  assert.equal(await read('public/js/equalizer.js'), eq);
  assert.match(eq, /canonical audio visualizer authority V14/);
  assert.match(eq, /const visualTilt = 1 \+ Math\.pow\(position, 1\.24\) \* 0\.34/);
  assert.match(eq, /const spectral = Math\.pow\(absolute, 0\.74\) \* visualTilt/);
  assert.match(eq, /const localGate = clamp\(\(local - 6\) \/ 26/);
  assert.match(eq, /const energy = spectralResponse \* 0\.68 \+ adaptiveResponse \+ transientResponse/);
  assert.match(eq, /const peakHeadroom = 0\.78 \+ clamp\(localPeak \/ 255, 0, 1\) \* 0\.22/);
  assert.match(eq, /visualCeiling: 'peak-dependent'/);
  assert.doesNotMatch(eq, /Math\.sin|useHybrid|const mirrored|spectralResponse \* 0\.92/);
});

test('balanced-headroom cache marker is mirrored', async () => {
  const html = await read('index.html');
  const core = await read('js/player-core.js');
  assert.equal(await read('public/index.html'), html);
  assert.equal(await read('public/js/player-core.js'), core);
  assert.match(html, /2026-07-24-balanced-headroom-v14/);
  assert.match(core, /equalizer\.js\?v=2026-07-24-balanced-headroom-v14/);
});
""", encoding='utf-8')

      - name: JavaScript syntax
        run: |
          node --check js/equalizer.js
          node --check js/player-core.js
      - name: Balanced-headroom contract
        run: node --test tests/pc-eq-balanced-headroom.test.mjs tests/pc-high-frequency-response.test.mjs tests/pc-real-spectrum-layout.test.mjs tests/frontend-contracts.test.mjs
      - name: Full repository verification
        run: npm run verify
