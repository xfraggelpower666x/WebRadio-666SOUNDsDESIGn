name: Finalize VELUNA Stable Fullscreen V3

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-veluna-stable-fullscreen-no-reboot-20260723
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Apply verified repair and all exact contract reconciliations
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/finalize-veluna-stable-fullscreen-v2.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Apply verified repair and reconcile legacy contracts\n        shell: python\n        run: |\n'
          end_marker = '      - name: JavaScript syntax\n'
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, 'veluna-stable-fullscreen-repair-v3.py', 'exec'), {'__name__':'__main__'})

          target_path = Path('tests/veluna-targeted-mobile-repair.test.mjs')
          target = target_path.read_text(encoding='utf-8')
          target = target.replace(r'geometry lock v1\.2\.30', r'stable iPhone fullscreen geometry lock v1\.3\.0')
          target = target.replace("  assert.match(root, /spacerMinimum = 0/);\n", '')
          target = target.replace(
              r"  assert.match(root, /minmax\(\$\{displayMinimum\}px,1fr\) auto \$\{spacerMinimum\}px/);",
              r"  assert.match(root, /minmax\(\$\{displayMinimum\}px,1fr\) auto 0px/);"
          )
          target = target.replace(r'central-artwork-v1230', r'no-delayed-splash-v1231')
          target_path.write_text(target, encoding='utf-8')
      - name: JavaScript syntax
        run: |
          node --check js/veluna-ui.js
          node --check js/veluna-viewport-lock.js
      - name: All directly affected contracts
        run: |
          node --test tests/veluna-stable-fullscreen-no-reboot.test.mjs
          node --test tests/frontend-contracts.test.mjs
          node --test tests/viewport-fullscreen.test.mjs
          node --test tests/veluna-targeted-mobile-repair.test.mjs
      - name: Full repository verification
        run: npm run verify
      - name: Python syntax audit without bytecode
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('.').rglob('*.py'):
              if any(part in {'.git','node_modules','.venv','venv'} for part in path.parts):
                  continue
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print('Python syntax PASS')
          PY
      - name: Remove temporary workflows and publish repaired state
        run: |
          rm -f .github/workflows/finalize-veluna-stable-fullscreen.yml
          rm -f .github/workflows/finalize-veluna-stable-fullscreen-v2.yml
          rm -f .github/workflows/finalize-veluna-stable-fullscreen-v3.yml
          rm -f .github/workflows/diagnose-veluna-stable-fullscreen-tests.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Stop VELUNA delayed reboot and lock stable iPhone fullscreen"
          git push origin HEAD:repair-veluna-stable-fullscreen-no-reboot-20260723
