name: Finalize Targeted VELUNA Repair

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-veluna-mobile-layout-central-runtime-20260722
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Apply targeted repair in existing layers
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          # Discord/Messenger functionality stays; only the old cover/layout writer is removed.
          cleaned_addon = subprocess.check_output([
              'git','show','358c99d138c354593d7e365eeb6eac5b2ebdc153:js/addons/discord-player-addon-v3.js'
          ], text=True)
          write('js/addons/discord-player-addon-v3.js', cleaned_addon)
          write('public/js/addons/discord-player-addon-v3.js', cleaned_addon)

          # Main player metadata delegates artwork to the central core when available.
          for path in ['js/player-core.js','public/js/player-core.js']:
              text = read(path)
              text = replace_once(
                  text,
                  '    updateNowCover(data);',
                  '    if (window.SMFPArtworkCore?.update) window.SMFPArtworkCore.update(raw);\n    else updateNowCover(data);',
                  f'{path} artwork delegation'
              )
              write(path, text)

          # VELUNA keeps its original DOM and splash. Fallback ownership moves to the central artwork core.
          for path in ['js/veluna-ui.js','public/js/veluna-ui.js']:
              text = read(path)
              text = replace_once(
                  text,
                  "    const fallback = A.fallbackCover || '/assets/veluna/covers/veluna-stream-fallback.webp';\n    for (const img of document.querySelectorAll('#nowCover,.now-cover,[data-stream-cover]')) {\n      if (!img.dataset.trackArtworkActive) img.src = fallback;\n    }\n    window.dispatchEvent(new CustomEvent('veluna:fallback-ready',{detail:{src:fallback}}));",
                  "    const fallback = A.fallbackCover || '/assets/veluna/covers/veluna-stream-fallback.webp';\n    if (window.SMFPArtworkCore?.enforce) { window.SMFPArtworkCore.enforce(); return; }\n    for (const img of document.querySelectorAll('#nowCover,.now-cover,[data-stream-cover]')) {\n      if (!img.getAttribute('src')) img.src = fallback;\n    }",
                  f'{path} fallback ownership'
              )
              write(path, text)

          # iPhone geometry: the old empty spacer becomes Now Playing height.
          for path in ['js/veluna-viewport-lock.js','public/js/veluna-viewport-lock.js']:
              text = read(path)
              text = replace_once(text, 'fullscreen geometry lock v1.2.28', 'fullscreen geometry lock v1.2.30', f'{path} version')
              text = replace_once(text, '    const displayMinimum = compact ? 118 : 140;', '    const displayMinimum = compact ? 150 : 188;', f'{path} display minimum')
              text = replace_once(text, '    const spacerMinimum = compact ? 4 : 8;', '    const spacerMinimum = 0;', f'{path} spacer')
              text = replace_once(text, "root.style.setProperty('--veluna-safe-player-bottom','max(7px, env(safe-area-inset-bottom))');", "root.style.setProperty('--veluna-safe-player-bottom','max(1px, calc(env(safe-area-inset-bottom) - 12px))');", f'{path} bottom extent')
              text = replace_once(
                  text,
                  '`auto auto auto minmax(${displayMinimum}px,1.15fr) auto minmax(${spacerMinimum}px,.38fr) auto auto auto auto auto auto`',
                  '`auto auto auto minmax(${displayMinimum}px,1fr) auto ${spacerMinimum}px auto auto auto auto auto auto`',
                  f'{path} grid allocation'
              )
              text = replace_once(text, "displayWindow.style.setProperty('min-height',compact ? '92px' : '112px','important');", "displayWindow.style.setProperty('min-height',compact ? '124px' : '158px','important');", f'{path} artwork height')
              write(path, text)

          # Existing VELUNA HTML structure remains byte-for-byte except current runtime URLs.
          html_paths = ['VELUNA/index.html','veluna/index.html','public/VELUNA/index.html','public/veluna/index.html']
          for path in html_paths:
              text = read(path)
              text = replace_once(text, '/js/boost-core.js?v=2026-07-06-veluna-v126', '/js/boost-core.js?v=2026-07-22-central-audio-v202', f'{path} boost cache')
              text = replace_once(text, '/js/addons/discord-player-addon-v3.js?v=2026-07-19-overlay-inert-v52', '/js/addons/discord-player-addon-v3.js?v=2026-07-22-single-writer-v54', f'{path} addon cache')
              text = replace_once(text, '/config/veluna-assets.js?v=2026-07-09-veluna-v1212', '/config/veluna-assets.js?v=2026-07-22-central-audio-artwork-v182', f'{path} config cache')
              text = replace_once(text, '/js/veluna-ui.js?v=2026-07-19-touch-feedback-v1225', '/js/veluna-ui.js?v=2026-07-22-central-artwork-v1230', f'{path} ui cache')
              write(path, text)

          test = r'''// Targeted VELUNA iPhone and central-runtime regression contract v1.0.0.
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const read = path => readFile(new URL(`../${path}`, import.meta.url), 'utf8');

          test('VELUNA iPhone uses free space for a larger Now Playing image', async () => {
            const root = await read('js/veluna-viewport-lock.js');
            assert.equal(await read('public/js/veluna-viewport-lock.js'), root);
            assert.match(root, /geometry lock v1\.2\.30/);
            assert.match(root, /displayMinimum = compact \? 150 : 188/);
            assert.match(root, /spacerMinimum = 0/);
            assert.match(root, /minmax\(\$\{displayMinimum\}px,1fr\) auto \$\{spacerMinimum\}px/);
            assert.match(root, /compact \? '124px' : '158px'/);
          });

          test('VELUNA keeps original DOM and loads current central audio/artwork runtimes', async () => {
            const files = ['VELUNA/index.html','veluna/index.html','public/VELUNA/index.html','public/veluna/index.html'];
            const canonical = await read(files[0]);
            for (const path of files.slice(1)) assert.equal(await read(path), canonical, path);
            assert.match(canonical, /central-audio-v202/);
            assert.match(canonical, /single-writer-v54/);
            assert.match(canonical, /central-audio-artwork-v182/);
            assert.match(canonical, /central-artwork-v1230/);
            assert.doesNotMatch(canonical, /s666SplashPreflight|s666SplashPrepaintGate/);
            assert.match(canonical, /id="coverImage"/);
            assert.match(canonical, /id="listenersText"/);
            assert.match(canonical, /id="primaryBtn"/);
            assert.match(canonical, /id="playBtn"/);
          });

          test('central artwork is the only cover owner while Discord and Messenger remain', async () => {
            const addon = await read('js/addons/discord-player-addon-v3.js');
            assert.equal(await read('public/js/addons/discord-player-addon-v3.js'), addon);
            assert.doesNotMatch(addon, /installSharedVisualStyle|applyCoverToPlayers|syncSharedCoverLogic|TRACK_COVER_MS/);
            assert.match(addon, /velunaMessengerBridge:\s*true/);
            assert.match(addon, /sharedVisualBridge:\s*false/);
            const ui = await read('js/veluna-ui.js');
            assert.equal(await read('public/js/veluna-ui.js'), ui);
            assert.match(ui, /SMFPArtworkCore\?\.enforce/);
            const artwork = await read('js/artwork-core.js');
            assert.match(artwork, /TRACK_MS = 18000/);
            assert.match(artwork, /stream\/station artwork -> local fallback/);
          });

          test('central sound policy remains 160 ms with mobile hardware volume and desktop boost one', async () => {
            const core = await read('js/boost-core.js');
            assert.match(core, /RAMP_SECONDS = 0\.16/);
            assert.match(core, /maxBoostStage: mobile \? 5 : 1/);
            assert.match(core, /playerVolume: !mobile/);
            assert.match(core, /hardwareVolume: mobile/);
            const policy = await read('js/audio-policy-core.js');
            assert.match(policy, /engine\.applyEq/);
            assert.match(policy, /engine\.applyBoost/);
          });
          '''
          write('tests/veluna-targeted-mobile-repair.test.mjs', '\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines()) + '\n')
      - name: JavaScript syntax
        run: |
          node --check js/addons/discord-player-addon-v3.js
          node --check js/player-core.js
          node --check js/veluna-ui.js
          node --check js/veluna-viewport-lock.js
          node --check js/boost-core.js
          node --check js/audio-policy-core.js
          node --check js/artwork-core.js
      - name: Targeted regression contract
        run: node --test tests/veluna-targeted-mobile-repair.test.mjs
      - name: Full repository verification
        run: npm run verify
      - name: Python syntax audit without bytecode
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('.').rglob('*.py'):
              if any(part in {'.git','node_modules','.venv','venv'} for part in path.parts):
                  continue
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print('Python syntax PASS')
          PY
      - name: Remove temporary workflow and publish repaired state
        run: |
          rm -f .github/workflows/finalize-veluna-targeted-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Repair VELUNA mobile layout and central runtime activation"
          git push origin HEAD:repair-veluna-mobile-layout-central-runtime-20260722
