name: Fix Inline Async And Verify

on:
  pull_request:
    branches: [WebRadio-666SOUNDsDESIGn]
    paths:
      - 'scripts/fix-inline-async-and-verify-20260727.mjs'
      - '.github/workflows/fix-inline-async-and-verify-20260727.yml'

permissions:
  contents: write

jobs:
  fix-inline-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair and verify inline scripts
        run: node scripts/fix-inline-async-and-verify-20260727.mjs
      - name: Verify focused runtime contract
        run: node --test tests/player-runtime-single-audio-owner-contract.test.mjs
      - name: Remove temporary automation
        run: |
          rm -f scripts/fix-inline-async-and-verify-20260727.mjs
          rm -f .github/workflows/fix-inline-async-and-verify-20260727.yml
      - name: Run complete tests
        run: npm test
      - name: Commit corrected runtime repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html public/index.html scripts/fix-inline-async-and-verify-20260727.mjs .github/workflows/fix-inline-async-and-verify-20260727.yml
          git commit -m 'Fix inline runtime syntax and add verification'
          git push
