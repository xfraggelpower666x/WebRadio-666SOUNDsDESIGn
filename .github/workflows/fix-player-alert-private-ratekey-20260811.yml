name: Fix Player Alert Private RateKey 20260811

on:
  push:
    branches:
      - repair/player-alert-backend-global-messenger-20260811

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/player-alert-backend-global-messenger-20260811
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Keep rateKey backend-only
        run: node scripts/fix-player-alert-private-ratekey-20260811.mjs
      - name: Commit repaired runtime files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No repair delta pending."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js workers/webradio-666soundsdesign-worker/worker.js tests/player-alert-global-backend-repair.test.mjs
          git commit -m "Keep Player Alert rateKey private to backend relay"
          git push origin HEAD:repair/player-alert-backend-global-messenger-20260811
