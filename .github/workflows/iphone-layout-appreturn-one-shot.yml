name: iPhone Layout App Return One Shot

on:
  push:
    branches:
      - repair/iphone-layout-appreturn-audio-20260904

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply repair
        run: node scripts/repair-iphone-layout-appreturn-audio.mjs
      - name: Install dependencies
        run: npm ci
      - name: Focus regression
        run: node --test tests/iphone-layout-app-return-audio.test.mjs
      - name: Full verify
        run: npm run verify
      - name: Commit verified repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html public/index.html js/player-core.js public/js/player-core.js js/media-session-ios.js public/js/media-session-ios.js css/mobile-patches.css public/css/mobile-patches.css veluna/index.html VELUNA/index.html public/veluna/index.html public/VELUNA/index.html tests
          git commit -m "Repair iPhone layout and app-return audio lifecycle"
          git push
