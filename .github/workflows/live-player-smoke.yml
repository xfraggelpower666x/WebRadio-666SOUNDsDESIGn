name: Live Player Smoke

on:
  push:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - ".github/workflows/live-player-smoke.yml"
      - "_headers"
      - "public/_headers"
      - "index.html"
      - "public/index.html"
      - "VELUNA/index.html"
      - "veluna/index.html"
      - "public/VELUNA/index.html"
      - "public/veluna/index.html"
      - "worker.js"
      - "workers/webradio-666soundsdesign-worker/worker.js"
      - "js/player-alert-client.js"
      - "public/js/player-alert-client.js"
      - "js/messenger-overlay.js"
      - "public/js/messenger-overlay.js"
      - "js/equalizer.js"
      - "public/js/equalizer.js"
      - "js/player-stage-v2.js"
      - "public/js/player-stage-v2.js"
      - "js/veluna-ui.js"
      - "public/js/veluna-ui.js"
      - "css/player-stage-v2.css"
      - "public/css/player-stage-v2.css"
      - "css/primary-player-actions.css"
      - "public/css/primary-player-actions.css"
      - "css/veluna-theme.css"
      - "public/css/veluna-theme.css"
  pull_request:
    paths:
      - ".github/workflows/live-player-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: live-player-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://webradio.666soundsdesign-broadcaster.com
      PLAYER_ALERT_BACKEND_URL: https://666soundsdesign-alert-service.onrender.com
    steps:
      - name: Check live routes, Messenger bus and repaired assets
        shell: bash
        run: |
          set -Eeuo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          fetch_url() {
            local url_base="$1"
            local output="$2"
            local label="$3"
            local attempt code url

            for attempt in $(seq 1 18); do
              url="${url_base}"
              if [[ "$url" == *\?* ]]; then
                url="${url}&smoke=${GITHUB_SHA}-${attempt}"
              else
                url="${url}?smoke=${GITHUB_SHA}-${attempt}"
              fi

              code="$(curl \
                --silent \
                --show-error \
                --location \
                --connect-timeout 10 \
                --max-time 35 \
                --header 'Cache-Control: no-cache' \
                --header 'Pragma: no-cache' \
                --output "$output" \
                --write-out '%{http_code}' \
                "$url" || true)"

              if [[ "$code" == "200" && -s "$output" ]]; then
                echo "PASS ${label} (${code}, $(wc -c < "$output") bytes)"
                return 0
              fi

              echo "WAIT ${label}: attempt ${attempt}/18 returned ${code:-curl_error}"
              sleep 10
            done

            echo "FAIL ${label}: live service did not return a usable HTTP 200 response" >&2
            return 1
          }

          fetch_live() {
            local path="$1"
            local output="$2"
            fetch_url "${BASE_URL}${path}" "$output" "$path"
          }

          fetch_live "/" "$workdir/root.html"
          fetch_live "/veluna/" "$workdir/veluna.html"
          fetch_live "/internal/" "$workdir/internal.html"
          fetch_live "/js/player-alert-client.js" "$workdir/player-alert-client.js"
          fetch_live "/js/messenger-overlay.js" "$workdir/messenger-overlay.js"
          fetch_live "/api/player-alert/status" "$workdir/player-alert-status.json"
          fetch_live "/api/player-alert/current" "$workdir/player-alert-current.json"

          # Wake and identify the existing Render service before asserting Player Alert routes.
          fetch_url "${PLAYER_ALERT_BACKEND_URL}/health" "$workdir/render-health.json" "Render health"
          fetch_url "${PLAYER_ALERT_BACKEND_URL}/openapi.json" "$workdir/render-openapi.json" "Render OpenAPI"

          render_status_code="$(curl \
            --silent \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 35 \
            --header 'Cache-Control: no-cache' \
            --output "$workdir/render-player-alert-status.json" \
            --write-out '%{http_code}' \
            "${PLAYER_ALERT_BACKEND_URL}/api/player-alert/status?smoke=${GITHUB_SHA}" || true)"

          fetch_live "/js/equalizer.js" "$workdir/equalizer.js"
          fetch_live "/js/player-stage-v2.js" "$workdir/player-stage-v2.js"
          fetch_live "/js/veluna-ui.js" "$workdir/veluna-ui.js"
          fetch_live "/css/player-stage-v2.css" "$workdir/player-stage-v2.css"
          fetch_live "/css/primary-player-actions.css" "$workdir/primary-player-actions.css"
          fetch_live "/css/veluna-theme.css" "$workdir/veluna-theme.css"

          grep -Fq "Root Main Player" "$workdir/root.html"
          grep -Fq "app.id='mffApp'" "$workdir/root.html"
          grep -Fq "/js/player-alert-client.js" "$workdir/root.html"
          grep -Fq "/js/messenger-overlay.js" "$workdir/root.html"

          grep -Fq 'data-veluna-page="veluna"' "$workdir/veluna.html"
          grep -Fq "/js/player-alert-client.js" "$workdir/veluna.html"
          grep -Fq "/js/messenger-overlay.js" "$workdir/veluna.html"

          grep -Fq 'data-veluna-page="internal"' "$workdir/internal.html"
          grep -Fq 'id="internalMessageBtn"' "$workdir/internal.html"
          grep -Fq "/js/player-alert-client.js" "$workdir/internal.html"
          grep -Fq "/js/messenger-overlay.js" "$workdir/internal.html"

          grep -Fq "/api/player-alert/send" "$workdir/player-alert-client.js"
          grep -Fq "/api/player-alert/current" "$workdir/player-alert-client.js"
          grep -Fq "Broadcast-Nachricht senden" "$workdir/messenger-overlay.js"

          node - "$workdir/player-alert-status.json" "$workdir/player-alert-current.json" "$workdir/render-health.json" "$workdir/render-openapi.json" "$workdir/render-player-alert-status.json" "$render_status_code" <<'NODE'
          const fs = require('node:fs');
          const [workerPath, currentPath, healthPath, openapiPath, renderStatusPath, renderStatusCode] = process.argv.slice(2);
          const worker = JSON.parse(fs.readFileSync(workerPath, 'utf8'));
          const current = JSON.parse(fs.readFileSync(currentPath, 'utf8'));
          const health = JSON.parse(fs.readFileSync(healthPath, 'utf8'));
          const openapi = JSON.parse(fs.readFileSync(openapiPath, 'utf8'));
          const paths = Object.keys(openapi.paths || {});

          if (worker.ok !== true) throw new Error(`Worker Player Alert status not ok: ${JSON.stringify(worker)}`);
          if (typeof current.active !== 'boolean') throw new Error(`Worker Player Alert current contract invalid: ${JSON.stringify(current)}`);
          if (health.ok !== true) throw new Error(`Render health not ok: ${JSON.stringify(health)}`);

          const requiredPaths = [
            '/api/player-alert/status',
            '/api/player-alert/send',
            '/api/player-alert/current',
            '/api/player-alert/history'
          ];
          const missingPaths = requiredPaths.filter(path => !paths.includes(path));
          if (missingPaths.length) {
            console.error(`RENDER_HEALTH=${JSON.stringify(health)}`);
            console.error(`RENDER_OPENAPI_PATHS=${JSON.stringify(paths)}`);
            throw new Error(`Render deployment is missing Player Alert routes: ${missingPaths.join(', ')}`);
          }

          if (String(renderStatusCode) !== '200') {
            throw new Error(`Render Player Alert status returned HTTP ${renderStatusCode}`);
          }
          const render = JSON.parse(fs.readFileSync(renderStatusPath, 'utf8'));
          if (render.ok !== true) throw new Error(`Render Player Alert status not ok: ${JSON.stringify(render)}`);
          if (render.release_ready !== true) throw new Error(`Render Player Alert backend not release-ready: ${JSON.stringify(render)}`);
          if (render.shared_persistence !== true) throw new Error(`Render Player Alert backend has no shared persistence: ${JSON.stringify(render)}`);
          if (render.storage_scope !== 'shared-postgres') throw new Error(`Render Player Alert storage is not shared-postgres: ${JSON.stringify(render)}`);

          console.log('PLAYER ALERT LIVE BUS PASS');
          console.log(`WORKER_STATUS=${JSON.stringify(worker)}`);
          console.log(`CURRENT_SOURCE=${String(current.source || '')}`);
          console.log(`RENDER_HEALTH=${JSON.stringify(health)}`);
          console.log(`RENDER_STORAGE_SCOPE=${render.storage_scope}`);
          NODE

          grep -Fq "canonical audio visualizer authority" "$workdir/equalizer.js"
          grep -Fq "__S666_PLAYER_STAGE_V2_CORRECTION__" "$workdir/player-stage-v2.js"
          grep -Fq -- "--s666-side-panel-width:clamp(220px" "$workdir/player-stage-v2.css"
          grep -Fq "margin:6px auto!important" "$workdir/player-stage-v2.css"
          grep -Fq "align-items:center!important;justify-content:center!important" "$workdir/veluna-theme.css"
          grep -Fq "height:clamp(76px,10vh,96px)!important" "$workdir/veluna-theme.css"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            grep -Fq "Main-player geometry belongs to player-stage-v2.css" "$workdir/primary-player-actions.css"
            if grep -Fq "player-shell > .visualizer" "$workdir/primary-player-actions.css"; then
              echo "FAIL primary-player-actions.css still owns visualizer geometry" >&2
              exit 1
            fi
            grep -Fq "VELUNA Central UI Runtime v1.2.26" "$workdir/veluna-ui.js"
            grep -Fq "installPersistentActiveState" "$workdir/veluna-ui.js"
            grep -Fq "velunaVolumeSlider" "$workdir/veluna-ui.js"
            grep -Fq "veluna_volume_v1" "$workdir/veluna-ui.js"
          fi

          echo "LIVE PLAYER SMOKE PASS"
