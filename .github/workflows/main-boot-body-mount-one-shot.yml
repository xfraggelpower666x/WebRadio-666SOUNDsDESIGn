name: Main Boot Body Mount One Shot

on:
  push:
    branches:
      - repair/main-boot-half-render-delay-20260903

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/main-boot-half-render-delay-20260903
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bump repaired audio-start cache identity
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files=[
            'index.html','VELUNA/index.html','veluna/index.html',
            'public/index.html','public/VELUNA/index.html','public/veluna/index.html'
          ];
          const oldKey='audio-start-core.js?v=20260902-owner-collision-v2';
          const newKey='audio-start-core.js?v=20260903-main-boot-body-mount-v3';
          for(const file of files){
            let text=fs.readFileSync(file,'utf8');
            const count=text.split(oldKey).length-1;
            if(count!==1) throw new Error(`${file}: expected exactly one old cache key, found ${count}`);
            text=text.replace(oldKey,newKey);
            fs.writeFileSync(file,text);
          }
          const testFile='tests/audio-cache-identity-owner-collision.test.mjs';
          let test=fs.readFileSync(testFile,'utf8');
          test=test.replace(
            "const AUDIO_CACHE = 'audio-start-core.js?v=20260902-owner-collision-v2';\nconst PREVIOUS_AUDIO_CACHE = 'audio-start-core.js?v=20260901-owner-collision-v1';",
            "const AUDIO_CACHE = 'audio-start-core.js?v=20260903-main-boot-body-mount-v3';\nconst PREVIOUS_AUDIO_CACHE = 'audio-start-core.js?v=20260902-owner-collision-v2';"
          );
          if(!test.includes("20260903-main-boot-body-mount-v3")) throw new Error('cache test update failed');
          fs.writeFileSync(testFile,test);
          NODE
      - run: npm run verify
      - name: Commit verified cache bump
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html VELUNA/index.html veluna/index.html public/index.html public/VELUNA/index.html public/veluna/index.html tests/audio-cache-identity-owner-collision.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Force repaired main boot runtime cache identity"
          git push origin HEAD:repair/main-boot-half-render-delay-20260903
