name: One-shot main layout controls repair

on:
  push:
    branches:
      - repair/ui-owner-consolidation-20260820

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/ui-owner-consolidation-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair existing controls, ticker and FX ownership
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const jsPaths=['js/player-stage-v2.js','public/js/player-stage-v2.js'];
          const cssPaths=['css/player-stage-v2.css','public/css/player-stage-v2.css'];
          const insert=`
  function ensureMainLayoutControls(){
    var topRight=q('body[data-veluna-page="main"] .top-hud .systempanel-right');
    var switchLink=q('#playerDesignSwitch');
    if(topRight&&switchLink&&switchLink.parentNode!==topRight){switchLink.classList.add('s666-top-veluna-link');topRight.appendChild(switchLink);}
    var timeline=q('body[data-veluna-page="main"] .player-shell .bottom-console .timeline-wrap');
    if(timeline){timeline.hidden=true;timeline.setAttribute('aria-hidden','true');}
  }

  function readFxState(side){
    try{var saved=localStorage.getItem('s666-pc-'+side+'-fx');if(saved==='off')return false;if(saved==='on')return true;}catch(error){}
    return true;
  }

  function applyFxState(side,on,save){
    var button=q(side==='left'?'#pcLeftFxToggle':'#pcRightFxToggle');
    var addon=q(side==='left'?'#pcLeftFxAddon':'#pcRightFxAddon');
    if(button){button.classList.toggle('is-on',on);button.setAttribute('aria-pressed',on?'true':'false');}
    document.documentElement.setAttribute('data-s666-'+side+'-fx',on?'on':'off');
    if(addon){addon.hidden=!on;addon.setAttribute('aria-hidden',on?'false':'true');}
    if(save){try{localStorage.setItem('s666-pc-'+side+'-fx',on?'on':'off');}catch(error){}}
  }

  function installFxToggles(){
    ['left','right'].forEach(function(side){
      var button=q(side==='left'?'#pcLeftFxToggle':'#pcRightFxToggle');if(!button)return;
      if(!button.__s666FxBound){button.__s666FxBound=true;button.addEventListener('click',function(){var on=button.getAttribute('aria-pressed')!=='true';applyFxState(side,on,true);});}
      applyFxState(side,readFxState(side),false);
    });
  }

`;
          for(const path of jsPaths){
            let src=fs.readFileSync(path,'utf8');
            const marker='  function normalizeHeaderImage(image){';
            if((src.split(marker).length-1)!==1)throw new Error(path+': normalizeHeaderImage marker mismatch');
            if(src.includes('function ensureMainLayoutControls()'))throw new Error(path+': layout controls already installed');
            src=src.replace(marker,insert+marker);
            const oldNormalize="  function normalizeUi(){ensureActionButtons();ensureMainHeader();renderDesktopNowPlaying();renderMobileNowPlaying();}";
            const newNormalize="  function normalizeUi(){ensureActionButtons();ensureMainHeader();ensureMainLayoutControls();installFxToggles();renderDesktopNowPlaying();renderMobileNowPlaying();}";
            if((src.split(oldNormalize).length-1)!==1)throw new Error(path+': normalizeUi marker mismatch');
            src=src.replace(oldNormalize,newNormalize);
            fs.writeFileSync(path,src);
          }
          if(fs.readFileSync(jsPaths[0],'utf8')!==fs.readFileSync(jsPaths[1],'utf8'))throw new Error('player-stage root/public JS mirror drift');

          for(const path of cssPaths){
            let src=fs.readFileSync(path,'utf8');
            const oldGrid='grid-template-columns:auto auto minmax(90px,1fr) minmax(142px,174px)!important';
            if((src.split(oldGrid).length-1)!==1)throw new Error(path+': bottom grid marker mismatch');
            src=src.replace(oldGrid,'grid-template-columns:minmax(0,1fr) minmax(142px,174px)!important');
            const tickerPad='padding-left:100%!important';
            const tickerCount=src.split(tickerPad).length-1;
            if(tickerCount!==2)throw new Error(path+': expected two canonical ticker paddings, found '+tickerCount);
            src=src.split(tickerPad).join('padding-left:0!important');
            const desktopClose='}\n@media(min-width:761px) and (max-width:1220px)';
            if((src.split(desktopClose).length-1)!==1)throw new Error(path+': desktop close marker mismatch');
            const rules=`
  body[data-veluna-page="main"] .top-hud .s666-top-veluna-link{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 auto!important;width:auto!important;min-width:92px!important;max-width:112px!important;height:28px!important;padding:0 8px!important;margin:0!important;font:900 9px/1 ui-monospace,monospace!important;white-space:nowrap!important;text-decoration:none!important}
  body[data-veluna-page="main"] .bottom-console .timeline-wrap[hidden]{display:none!important}
  html[data-s666-left-fx="off"] body[data-veluna-page="main"] #pcLeftFxAddon,html[data-s666-right-fx="off"] body[data-veluna-page="main"] #pcRightFxAddon{display:none!important}
}
@media(min-width:1221px){
  :root{--s666-side-release:calc(var(--s666-side-panel-width) + var(--s666-side-panel-gap))}
  html[data-s666-left-fx="off"][data-s666-right-fx="on"] body[data-veluna-page="main"] .frame-stage .player-shell{width:min(calc(var(--s666-main-player-width) + var(--s666-side-release)),calc(100vw - 24px))!important;max-width:min(calc(var(--s666-main-player-width) + var(--s666-side-release)),calc(100vw - 24px))!important;transform:translateX(calc(var(--s666-side-release) * -.5))!important}
  html[data-s666-left-fx="on"][data-s666-right-fx="off"] body[data-veluna-page="main"] .frame-stage .player-shell{width:min(calc(var(--s666-main-player-width) + var(--s666-side-release)),calc(100vw - 24px))!important;max-width:min(calc(var(--s666-main-player-width) + var(--s666-side-release)),calc(100vw - 24px))!important;transform:translateX(calc(var(--s666-side-release) * .5))!important}
  html[data-s666-left-fx="off"][data-s666-right-fx="off"] body[data-veluna-page="main"] .frame-stage .player-shell{width:min(calc(var(--s666-main-player-width) + var(--s666-side-release) * 2),calc(100vw - 24px))!important;max-width:min(calc(var(--s666-main-player-width) + var(--s666-side-release) * 2),calc(100vw - 24px))!important;transform:none!important}
}
@media(min-width:761px) and (max-width:1220px)`;
            src=src.replace(desktopClose,rules);
            fs.writeFileSync(path,src);
          }
          if(fs.readFileSync(cssPaths[0],'utf8')!==fs.readFileSync(cssPaths[1],'utf8'))throw new Error('player-stage root/public CSS mirror drift');
          NODE
      - name: Syntax and focused contracts
        run: |
          node --check js/player-stage-v2.js
          node --test tests/main-player-reactive-visual-contract.test.mjs
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/player-stage-v2.js public/js/player-stage-v2.js css/player-stage-v2.css public/css/player-stage-v2.css
          git commit -m 'fix: restore FX toggles and main control geometry'
          git push origin HEAD:repair/ui-owner-consolidation-20260820
