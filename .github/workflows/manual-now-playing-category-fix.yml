name: Apply Manual Now Playing Category Fix

"on":
  push:
    branches:
      - repair/manual-now-playing-category-20260806
    paths:
      - .github/workflows/manual-now-playing-category-fix.yml

permissions:
  contents: write

concurrency:
  group: manual-now-playing-category-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-verify-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 55a00ad9e333692987b34182d3679436833dc704
      PATCH_SHA: cdcf6124bd39cd00ccc661921a759b6e82ad259cfbb389010abb6cd8ad300067
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply minimal repair
        shell: bash
        run: |
          set -euo pipefail
          echo "${PATCH_SHA}  .github/manual-now-playing-category-fix.patch" | sha256sum --check --strict
          git apply --check .github/manual-now-playing-category-fix.patch
          git apply .github/manual-now-playing-category-fix.patch

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete verification
        run: npm run verify

      - name: Verify fixed routing and mirrors
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum js/addons/discord-player-addon-v3.js | cut -d' ' -f1)" = "ac6dfa221879ae69d94a0280a8c565cb325535b91fcca9b585b3db666ac669f9"
          test "$(sha256sum public/js/addons/discord-player-addon-v3.js | cut -d' ' -f1)" = "ac6dfa221879ae69d94a0280a8c565cb325535b91fcca9b585b3db666ac669f9"
          test "$(sha256sum tests/direct-discord-runtime-owner-repair.test.mjs | cut -d' ' -f1)" = "4bed8cdacc2ac4c6234d6674feadb755926a5cd4b0015be4ff07d681de3f2f71"
          cmp -s js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js
          grep -F "postTrackIfChanged(true, 'manual-now-playing', selectedTarget && selectedTarget.value)" js/addons/discord-player-addon-v3.js
          grep -F "postTrackIfChanged(true, 'startup-first-now-playing')" js/addons/discord-player-addon-v3.js
          grep -F "postTrackIfChanged(false, 'watcher-track-change')" js/addons/discord-player-addon-v3.js

      - name: Remove transport files and verify exact final scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/manual-now-playing-category-fix.patch
          rm -f .github/workflows/manual-now-playing-category-fix.yml
          git add -A
          cat > /tmp/expected-files.txt <<'EOF'
          js/addons/discord-player-addon-v3.js
          public/js/addons/discord-player-addon-v3.js
          tests/direct-discord-runtime-owner-repair.test.mjs
          EOF
          git diff --cached --name-only "${BASE_SHA}" | LC_ALL=C sort > /tmp/actual-files.txt
          LC_ALL=C sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          test "$(wc -l < /tmp/actual-files.txt)" -eq 3
          test -z "$(git diff --cached --name-only "${BASE_SHA}" | grep -E '^\.github/' || true)"

      - name: Commit clean verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Route manual Now Playing to selected Discord category"
          git push origin HEAD:${GITHUB_REF_NAME}
