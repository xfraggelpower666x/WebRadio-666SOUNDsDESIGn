name: Apply Verified Player Action Parity v1

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - ".github/workflows/one-time-player-action-parity-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-verified:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-player-action-parity-v1-20260719
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply verified transformation
        shell: bash
        run: |
          sed -i "s/re.subn(pattern, replacement, text/re.subn(pattern, lambda _match: replacement, text/" .github/one-time/apply_player_action_parity_v1.py
          python .github/one-time/apply_player_action_parity_v1.py
      - name: Verify complete release
        run: |
          npm ci
          npm run verify
      - name: Commit verified productive files
        shell: bash
        run: |
          git config user.name "666SOUNDsDESIGn Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            js/skip-control.js public/js/skip-control.js \
            js/player-stage-v2.js public/js/player-stage-v2.js \
            js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js \
            veluna/index.html VELUNA/index.html public/veluna/index.html public/VELUNA/index.html \
            index.html public/index.html tests/frontend-contracts.test.mjs
          git commit -m "repair: centralize Skip auth and remove Discord password gates"
          git push origin HEAD:repair-player-action-parity-v1-20260719
