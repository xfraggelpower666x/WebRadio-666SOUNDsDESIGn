name: One-time Veluna Messenger v50 Repair

on:
  push:
    branches:
      - repair-veluna-messenger-status-v50
    paths:
      - ".github/workflows/one-time-veluna-messenger-v50.yml"
      - ".github/one-time/apply_veluna_messenger_v50.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veluna-messenger-v50-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-veluna-messenger-status-v50
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Messenger repair
        run: python .github/one-time/apply_veluna_messenger_v50.py
      - name: Verify Messenger contract
        shell: bash
        run: |
          node --check js/addons/discord-player-addon-v3.js
          cmp -s js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js
          grep -F 'V4.10-20260719-MESSENGER-STATUS-EMOJI-CLOSE' js/addons/discord-player-addon-v3.js
          grep -F 'data-veluna-msg-emoji' js/addons/discord-player-addon-v3.js
          grep -F '✓ Erfolgreich an die Hörer gesendet' js/addons/discord-player-addon-v3.js
          grep -F '✗ Versand fehlgeschlagen:' js/addons/discord-player-addon-v3.js
          grep -F '2026-07-19-overlay-status-v50' veluna/index.html
      - name: Verify complete release
        run: |
          npm ci
          npm run verify
      - name: Commit verified repair to branch
        shell: bash
        run: |
          git config user.name "666SOUNDsDESIGn Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js index.html public/index.html veluna/index.html VELUNA/index.html public/veluna/index.html public/VELUNA/index.html
          git diff --cached --quiet && { echo "No Messenger repair changes produced"; exit 1; }
          git commit -m "repair: complete Veluna Messenger overlay status and emoji support"
          git push origin HEAD:repair-veluna-messenger-status-v50
