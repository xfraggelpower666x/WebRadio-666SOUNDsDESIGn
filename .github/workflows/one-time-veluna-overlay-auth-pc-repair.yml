name: One-time Veluna Overlay Auth PC Repair

on:
  push:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - ".github/workflows/one-time-veluna-overlay-auth-pc-repair.yml"
      - ".github/one-time/apply_veluna_overlay_auth_pc_repair.py"
      - ".github/one-time/apply_veluna_auth_contract_bridge.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply repair
        run: python .github/one-time/apply_veluna_overlay_auth_pc_repair.py
      - name: Apply protected auth contract bridge
        run: python .github/one-time/apply_veluna_auth_contract_bridge.py
      - name: Verify
        run: |
          npm ci
          npm run verify
      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "666SOUNDsDESIGn Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- css/veluna-theme.css public/css/veluna-theme.css js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js js/admin-auth-client.js public/js/admin-auth-client.js veluna/index.html VELUNA/index.html public/veluna/index.html public/VELUNA/index.html index.html public/index.html worker.js workers/webradio-666soundsdesign-worker/worker.js
          git diff --cached --quiet && { echo "No repair changes produced"; exit 1; }
          git commit -m "repair: restore Veluna overlays auth feedback and PC fit"
          git push origin HEAD:WebRadio-666SOUNDsDESIGn
