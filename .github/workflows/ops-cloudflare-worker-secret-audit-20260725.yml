name: One-shot Cloudflare Worker secret audit

on:
  push:
    branches:
      - ops/cloudflare-worker-secret-audit-20260725
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - .github/workflows/ops-cloudflare-worker-secret-audit-20260725.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-worker-secret-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify protected Wrangler access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "CLOUDFLARE_WRANGLER_ACCESS=AVAILABLE"

      - name: Report candidate GitHub secret sources without values
        shell: bash
        env:
          HAS_MYIDJ_WORKER_ADMIN_TOKEN: ${{ secrets.MYIDJ_WORKER_ADMIN_TOKEN != '' }}
          HAS_RADIO_ADMIN_WORKER_TOKEN: ${{ secrets.RADIO_ADMIN_WORKER_TOKEN != '' }}
          HAS_MYIDJ_ADMIN_TOKEN: ${{ secrets.MYIDJ_ADMIN_TOKEN != '' }}
          HAS_ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN != '' }}
          HAS_SKIP_ADMIN_TOKEN: ${{ secrets.SKIP_ADMIN_TOKEN != '' }}
        run: |
          set -euo pipefail
          echo "GITHUB_SECRET_MYIDJ_WORKER_ADMIN_TOKEN=$HAS_MYIDJ_WORKER_ADMIN_TOKEN"
          echo "GITHUB_SECRET_RADIO_ADMIN_WORKER_TOKEN=$HAS_RADIO_ADMIN_WORKER_TOKEN"
          echo "GITHUB_SECRET_MYIDJ_ADMIN_TOKEN=$HAS_MYIDJ_ADMIN_TOKEN"
          echo "GITHUB_SECRET_ADMIN_TOKEN=$HAS_ADMIN_TOKEN"
          echo "GITHUB_SECRET_SKIP_ADMIN_TOKEN=$HAS_SKIP_ADMIN_TOKEN"

      - name: List main Worker secret metadata
        shell: bash
        run: npx --yes wrangler@4.111.0 secret list --name webradio-666soundsdesign-worker --format json

      - name: List MyIDJ Worker secret metadata
        shell: bash
        run: npx --yes wrangler@4.111.0 secret list --name 666myidjstreamadmin --format json
