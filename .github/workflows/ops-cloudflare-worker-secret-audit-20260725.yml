name: One-shot MyIDJ Worker hardlock

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - .github/workflows/ops-cloudflare-worker-secret-audit-20260725.yml

permissions:
  contents: read

jobs:
  hardlock-myidj-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate and install an unexposed MyIDJ admin token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          token_file="$RUNNER_TEMP/myidj-admin-token"
          umask 077
          openssl rand -hex 32 > "$token_file"
          npx --yes wrangler@4.111.0 secret put ADMIN_TOKEN --name 666myidjstreamadmin < "$token_file"

          secret_json="$(npx --yes wrangler@4.111.0 secret list --name 666myidjstreamadmin --format json)"
          jq -e 'any(.[]; .name == "ADMIN_TOKEN" and .type == "secret_text")' <<< "$secret_json" >/dev/null

          unauth_code="$(curl -sS -o "$RUNNER_TEMP/myidj-unauth.json" -w '%{http_code}' 'https://666myidjstreamadmin.666soundsdesign-broadcaster.com/api/radio/skip')"
          test "$unauth_code" = "401"

          auth_code="$(curl -sS -o "$RUNNER_TEMP/myidj-auth-get.json" -w '%{http_code}' -H "authorization: Bearer $(cat "$token_file")" -H "x-admin-token: $(cat "$token_file")" 'https://666myidjstreamadmin.666soundsdesign-broadcaster.com/api/radio/skip')"
          test "$auth_code" = "405"

          rm -f "$token_file" "$RUNNER_TEMP/myidj-unauth.json" "$RUNNER_TEMP/myidj-auth-get.json"
          echo "MYIDJ_ADMIN_TOKEN=CONFIGURED"
          echo "MYIDJ_UNAUTHENTICATED_GET=REJECTED_401"
          echo "MYIDJ_AUTHENTICATED_GET=METHOD_GUARD_405"
