name: One-shot MyIDJ Worker hardlock readback

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - .github/workflows/ops-cloudflare-worker-secret-audit-20260725.yml

permissions:
  contents: read

jobs:
  readback-myidj-worker-hardlock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify ADMIN_TOKEN metadata without reading its value
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          secret_json="$(npx --yes wrangler@4.111.0 secret list --name 666myidjstreamadmin --format json)"
          jq -e 'any(.[]; .name == "ADMIN_TOKEN" and .type == "secret_text")' <<< "$secret_json" >/dev/null
          echo "MYIDJ_ADMIN_TOKEN_METADATA=VERIFIED"
