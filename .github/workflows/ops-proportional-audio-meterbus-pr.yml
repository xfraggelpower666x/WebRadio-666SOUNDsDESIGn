name: PR proportional audio MeterBus repair

on:
  pull_request:
    branches: [WebRadio-666SOUNDsDESIGn]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  repair-existing-layer:
    if: github.head_ref == 'repair/proportional-audio-meterbus-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/proportional-audio-meterbus-20260726
          fetch-depth: 0

      - name: Apply repair in existing owners
        run: python3 scripts/ops_apply_proportional_audio_meterbus_20260726.py

      - name: Verify repaired syntax
        run: node --check js/equalizer.js

      - name: Verify targeted proportional contracts
        run: node --test tests/audio-meter-proportional-contract.test.mjs tests/main-player-reactive-visual-contract.test.mjs

      - name: Remove temporary automation before release audit
        run: |
          rm -f .github/workflows/ops-apply-proportional-audio-meterbus-20260726.yml
          rm -f .github/workflows/ops-proportional-audio-meterbus-pr.yml
          rm -f scripts/ops_apply_proportional_audio_meterbus_20260726.py
          rm -f tests/audio-meter-proportional-contract.test.mjs

      - name: Run full existing release test suite
        id: full_suite
        shell: bash
        run: |
          set +e
          npm test > /tmp/npm-test.log 2>&1
          code=$?
          tail -n 220 /tmp/npm-test.log > /tmp/npm-test-tail.log
          if [ "$code" -ne 0 ]; then
            echo "FULL_SUITE_FAILURE"
            exit "$code"
          fi
          echo "FULL_SUITE_PASS"

      - name: Upload full-suite failure tail
        if: failure() && steps.full_suite.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: proportional-meterbus-full-suite-failure
          path: /tmp/npm-test-tail.log
          if-no-files-found: error
          retention-days: 2

      - name: Commit repaired existing layers
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair proportional audio MeterBus without new runtime layers"
          git push origin HEAD:repair/proportional-audio-meterbus-20260726
