name: Read-only post-PR59 live contract check

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - .github/workflows/ops-read-only-post-pr59-live-contract-20260725.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-post-pr59-live-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production without writes
        shell: bash
        run: |
          set -euo pipefail

          base_url='https://webradio.666soundsdesign-broadcaster.com'
          veluna_body_file="$RUNNER_TEMP/veluna.html"
          login_body_file="$RUNNER_TEMP/login-negative.json"
          skip_body_file="$RUNNER_TEMP/skip-status.json"
          discord_body_file="$RUNNER_TEMP/discord-status.json"
          discord_debug_body_file="$RUNNER_TEMP/discord-debug.json"
          player_alert_body_file="$RUNNER_TEMP/player-alert-status.json"
          myidj_body_file="$RUNNER_TEMP/myidj-negative.json"
          trap 'rm -f "$veluna_body_file" "$login_body_file" "$skip_body_file" "$discord_body_file" "$discord_debug_body_file" "$player_alert_body_file" "$myidj_body_file"' EXIT

          curl -fsS --max-time 20 "$base_url/health" | jq -e '.ok == true' >/dev/null
          curl -fsS --max-time 20 "$base_url/veluna/" > "$veluna_body_file"
          grep -Fq 'Automatische Now-Playing-Posts dürfen den manuellen DISC-Status nicht als „gesendet“ überschreiben' "$veluna_body_file"

          curl -fsS --max-time 20 'https://666-system-pw.666soundsdesign-broadcaster.com/health' | jq -e '.ok == true and .worker == "666-system-pw-worker"' >/dev/null
          curl -fsS --max-time 20 'https://666-system-auth.666soundsdesign-broadcaster.com/health' | jq -e '.ok == true and .worker == "666-system-auth-worker"' >/dev/null

          curl -fsS --max-time 20 -H 'accept: application/json' "$base_url/api/skip/status" > "$skip_body_file"
          jq -e '.configured == true and .myIdjAdminTokenConfigured == true and .compatibilityProtection == "player-admin-gate"' "$skip_body_file" >/dev/null

          curl -fsS --max-time 20 -H 'accept: application/json' "$base_url/api/discord/status" > "$discord_body_file"
          jq -e '.ready == true and .authMode == "public-secret-server-side"' "$discord_body_file" >/dev/null
          echo "DISCORD_STATUS_SAFE=$(jq -c '{ok,ready,webhookCount,webhook2Configured,privateTrackWebhookConfigured,authMode,addon}' "$discord_body_file")"

          discord_debug_code="$(curl -sS --max-time 20 -o "$discord_debug_body_file" -w '%{http_code}' -H 'accept: application/json' "$base_url/api/discord/debug")"
          if [ "$discord_debug_code" = "200" ]; then
            echo "DISCORD_DEBUG_SAFE=$(jq -c '{ok,mode,webhookConfigured,webhookCount,webhook2Configured,privateTrackWebhookConfigured,serviceTokenConfigured,requireAdmin,sharedAdminAuth,lastKind,lastOkAt,lastErrorAt,lastError,lastTrackKey,addon}' "$discord_debug_body_file")"
          else
            echo "DISCORD_DEBUG_STATUS=$discord_debug_code"
            jq -c '{ok,error,addon}' "$discord_debug_body_file" || true
          fi

          curl -fsS --max-time 20 -H 'accept: application/json' "$base_url/api/player-alert/status" > "$player_alert_body_file"
          jq -e '.ok == true and .backendConfigured == true' "$player_alert_body_file" >/dev/null

          invalid_password="contract-invalid-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          login_code="$(curl -sS --max-time 25 -o "$login_body_file" -w '%{http_code}' -X POST -H "origin: $base_url" -H 'content-type: application/json' --data "{\"password\":\"$invalid_password\"}" "$base_url/api/admin/login")"
          case "$login_code" in
            401) jq -e '.ok == false and .error == "password_rejected"' "$login_body_file" >/dev/null ;;
            429) jq -e '.ok == false and .error == "login_rate_limited"' "$login_body_file" >/dev/null ;;
            *) echo "UNEXPECTED_LOGIN_STATUS=$login_code"; jq -c '{ok,error,stage,credentialType,upstream,diagnostic}' "$login_body_file"; exit 1 ;;
          esac

          myidj_code="$(curl -sS --max-time 20 -o "$myidj_body_file" -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' 'https://666myidjstreamadmin.666soundsdesign-broadcaster.com/api/radio/skip')"
          test "$myidj_code" = "401"
          jq -e '.ok == false and .error == "UNAUTHORIZED"' "$myidj_body_file" >/dev/null

          echo "POST_PR59_LIVE_CONTRACT=PASS"
          echo "PLAYER_ADMIN_NEGATIVE_LOGIN_CONTRACT=$login_code"
          echo "PLAYER_ADMIN_HUMAN_PASSWORD=UNCHANGED_NOT_READ"
          echo "DISCORD_SEND_PERFORMED=false"
          echo "VALID_SKIP_PERFORMED=false"
          echo "NO_SECRETS_PRINTED=true"

  wrangler-discord-secret-metadata-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Discord Worker secret names without values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          secret_json="$(npx --yes wrangler@4.111.0 secret list --name webradio-666soundsdesign-worker --format json)"

          jq -e 'all(.[]; .type == "secret_text")' <<< "$secret_json" >/dev/null

          jq -n --argjson secrets "$secret_json" '
            def has($name): any($secrets[]; .name == $name and .type == "secret_text");
            {
              worker: "webradio-666soundsdesign-worker",
              checkedBy: "wrangler secret list",
              valuesExposed: false,
              discordWebhookUrl: has("DISCORD_WEBHOOK_URL"),
              discordWebhook: has("DISCORD_WEBHOOK"),
              discordWebhookUri: has("DISCORD_WEBHOOK_URI"),
              discordWebhookEndpoint: has("DISCORD_WEBHOOK_ENDPOINT"),
              webhookUrl: has("WEBHOOK_URL"),
              discordWebhookUrl2: has("DISCORD_WEBHOOK_URL2"),
              discordWebhook2: has("DISCORD_WEBHOOK_2"),
              discordSecondaryWebhookUrl: has("DISCORD_SECONDARY_WEBHOOK_URL"),
              discordBroadcastWebhookUrl2: has("DISCORD_BROADCAST_WEBHOOK_URL2"),
              privateTrackShooter: has("PRIVATE_TRACK_SHOOTER"),
              discordAdminToken: has("DISCORD_ADMIN_TOKEN"),
              anyAcceptedDiscordWebhookSecret: (
                has("DISCORD_WEBHOOK_URL") or
                has("DISCORD_WEBHOOK") or
                has("DISCORD_WEBHOOK_URI") or
                has("DISCORD_WEBHOOK_ENDPOINT") or
                has("WEBHOOK_URL")
              ),
              anySecondaryDiscordWebhookSecret: (
                has("DISCORD_WEBHOOK_URL2") or
                has("DISCORD_WEBHOOK_2") or
                has("DISCORD_SECONDARY_WEBHOOK_URL") or
                has("DISCORD_BROADCAST_WEBHOOK_URL2")
              )
            }
          ' | tee "$RUNNER_TEMP/discord-secret-metadata.safe.json"

          jq -e '.anyAcceptedDiscordWebhookSecret == true' "$RUNNER_TEMP/discord-secret-metadata.safe.json" >/dev/null
          echo "WRANGLER_DISCORD_SECRET_METADATA=VERIFIED_NO_VALUES_EXPOSED"

      - name: Upload safe Discord secret metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: discord-secret-metadata-safe
          path: ${{ runner.temp }}/discord-secret-metadata.safe.json
          if-no-files-found: error
