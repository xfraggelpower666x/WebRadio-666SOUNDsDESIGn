name: PR remove competing mobile visual writer

on:
  pull_request:
    branches: [WebRadio-666SOUNDsDESIGn]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  repair-single-mobile-writer:
    if: github.head_ref == 'repair/remove-competing-mobile-writer-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/remove-competing-mobile-writer-20260726
          fetch-depth: 0
      - name: Repair existing owners
        run: python3 scripts/ops_remove_competing_mobile_writer_20260726.py
      - name: Verify targeted ownership contract
        run: node --test tests/single-mobile-visual-writer-contract.test.mjs
      - name: Verify JavaScript syntax
        run: node --check js/equalizer.js
      - name: Remove temporary automation before release audit
        run: |
          rm -f .github/workflows/ops-remove-competing-mobile-writer-pr.yml
          rm -f scripts/ops_remove_competing_mobile_writer_20260726.py
      - name: Run full existing test suite
        run: npm test
      - name: Commit repaired existing owners
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove competing mobile visual writer and repeated installer"
          git push origin HEAD:repair/remove-competing-mobile-writer-20260726
