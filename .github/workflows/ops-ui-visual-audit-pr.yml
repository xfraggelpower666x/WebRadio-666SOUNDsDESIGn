name: PR UI visual continuity audit

on:
  pull_request:
    branches: [WebRadio-666SOUNDsDESIGn]

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/ui-owner-continuity-20260818

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install temporary browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local branch server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/s666-http.log 2>&1 &
          echo $! >/tmp/s666-http.pid
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null

      - name: Capture and assert layout continuity
        shell: bash
        run: |
          mkdir -p visual-audit
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({headless:true});
          const results = [];
          const viewports = [
            {name:'desktop-1920x1080', width:1920, height:1080},
            {name:'desktop-1365x768', width:1365, height:768},
            {name:'desktop-1024x768', width:1024, height:768},
            {name:'iphone-390x844', width:390, height:844},
          ];

          for (const vp of viewports) {
            const page = await browser.newPage({ viewport: { width: vp.width, height: vp.height } });
            const consoleErrors = [];
            page.on('pageerror', error => consoleErrors.push(String(error)));
            await page.goto('http://127.0.0.1:4173/', {waitUntil:'domcontentloaded'});
            await page.waitForTimeout(2800);

            const audit = await page.evaluate(() => {
              const rect = el => el ? (() => { const r=el.getBoundingClientRect(); return {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}; })() : null;
              const visible = el => !!el && getComputedStyle(el).display !== 'none' && getComputedStyle(el).visibility !== 'hidden';
              const player = document.querySelector('.player-shell');
              const leftMeter = document.querySelector('.side-meter.left');
              const rightMeter = document.querySelector('.side-meter.right');
              const design = document.querySelector('#playerDesignSwitch');
              const topHud = document.querySelector('.top-hud');
              const bottom = document.querySelector('.mff-bottom');
              return {
                phase10Owner: document.documentElement.getAttribute('data-phase10-ui-owner'),
                headerSrc: document.querySelector('#pcHeaderNewLogo')?.getAttribute('src') || '',
                versionText: document.querySelector('#pcVersionBadge .status-code')?.textContent || '',
                canonicalSideTracks: document.querySelectorAll('.side-meter .side-meter-track').length,
                legacySideI: document.querySelectorAll('.side-meter > i,.side-meter-stack > i').length,
                legacyBottomSafe: !!document.querySelector('#s666MobileBottomSafe'),
                timelinePresent: !!document.querySelector('.timeline-wrap,#currentTimeText,#timelineProgress,#durationText'),
                designText: design?.textContent?.trim() || '',
                designInTopHud: !!(design && topHud && topHud.contains(design)),
                player: rect(player),
                leftMeter: rect(leftMeter),
                rightMeter: rect(rightMeter),
                bottom: rect(bottom),
                bottomVisible: visible(bottom),
                scrollWidth: document.documentElement.scrollWidth,
                scrollHeight: document.documentElement.scrollHeight,
                innerWidth: innerWidth,
                innerHeight: innerHeight,
              };
            });

            if (audit.phase10Owner !== 'canonical-player-stage') throw new Error(`${vp.name}: Phase10 owner hardlock missing`);
            if (/phase10-new-header-logo|forced-ui/i.test(audit.headerSrc+' '+audit.versionText)) throw new Error(`${vp.name}: stale Phase10 header/version mutation active`);
            if (audit.legacySideI !== 0) throw new Error(`${vp.name}: legacy side-meter DOM writer visible`);
            if (audit.legacyBottomSafe) throw new Error(`${vp.name}: legacy mobile bottom-safe layer mounted`);
            if (audit.timelinePresent) throw new Error(`${vp.name}: removed LIVE timeline still present`);
            if (!audit.designInTopHud || audit.designText !== 'VELUNA PLAYER') throw new Error(`${vp.name}: VELUNA PLAYER relocation contract failed`);
            if (audit.scrollWidth > audit.innerWidth + 3) throw new Error(`${vp.name}: horizontal overflow ${audit.scrollWidth}>${audit.innerWidth}`);
            if (vp.width >= 1221) {
              if (audit.canonicalSideTracks < 6) throw new Error(`${vp.name}: canonical side-meter tracks lost`);
              for (const [side,r] of [['left',audit.leftMeter],['right',audit.rightMeter]]) {
                if (r && (r.x < -2 || r.right > audit.innerWidth + 2)) throw new Error(`${vp.name}: ${side} meter clipped`);
              }
            }
            if (vp.width <= 760 && audit.bottomVisible && audit.bottom && audit.bottom.bottom > audit.innerHeight + 2) throw new Error(`${vp.name}: bottom meter outside safe viewport`);

            if (vp.width >= 1221) {
              const fx = await page.evaluate(() => {
                const shell = document.querySelector('.player-shell');
                const width = () => shell?.getBoundingClientRect().width || 0;
                const left = document.querySelector('#pcLeftFxToggle');
                const right = document.querySelector('#pcRightFxToggle');
                const before = width();
                left?.click();
                const oneOff = width();
                right?.click();
                const bothOff = width();
                const states = {
                  leftOff: document.body.classList.contains('pc-left-addon-off'),
                  rightOff: document.body.classList.contains('pc-right-addon-off'),
                  bothOffClass: document.body.classList.contains('pc-both-addons-off'),
                  leftPressed: left?.getAttribute('aria-pressed'),
                  rightPressed: right?.getAttribute('aria-pressed'),
                };
                right?.click(); left?.click();
                return {before,oneOff,bothOff,...states};
              });
              if (!(fx.oneOff > fx.before + 20)) throw new Error(`${vp.name}: one-side FX-off did not expand player (${fx.before}->${fx.oneOff})`);
              if (!(fx.bothOff > fx.oneOff + 20)) throw new Error(`${vp.name}: both FX-off did not further expand player (${fx.oneOff}->${fx.bothOff})`);
              if (!fx.leftOff || !fx.rightOff || !fx.bothOffClass || fx.leftPressed !== 'false' || fx.rightPressed !== 'false') throw new Error(`${vp.name}: FX state contract failed`);
            }

            await page.screenshot({path:`visual-audit/${vp.name}.png`,fullPage:true});
            results.push({viewport:vp,audit,consoleErrors});
            await page.close();
          }

          const startup = await browser.newPage({viewport:{width:1920,height:1080}});
          await startup.goto('http://127.0.0.1:4173/', {waitUntil:'domcontentloaded'});
          await startup.waitForTimeout(120);
          await startup.screenshot({path:'visual-audit/startup-120ms.png',fullPage:true});
          const early = await startup.evaluate(() => ({src:document.querySelector('#pcHeaderNewLogo')?.getAttribute('src')||'',version:document.querySelector('#pcVersionBadge .status-code')?.textContent||''}));
          await startup.waitForTimeout(2600);
          await startup.screenshot({path:'visual-audit/startup-2720ms.png',fullPage:true});
          const late = await startup.evaluate(() => ({src:document.querySelector('#pcHeaderNewLogo')?.getAttribute('src')||'',version:document.querySelector('#pcVersionBadge .status-code')?.textContent||''}));
          if (/phase10-new-header-logo|forced-ui/i.test(JSON.stringify({early,late}))) throw new Error('startup continuity: stale forced UI appeared');
          results.push({startup:{early,late}});
          fs.writeFileSync('visual-audit/audit.json', JSON.stringify(results,null,2));
          await browser.close();
          NODE

      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-audit-${{ github.run_id }}
          path: visual-audit
          if-no-files-found: warn
          retention-days: 3
