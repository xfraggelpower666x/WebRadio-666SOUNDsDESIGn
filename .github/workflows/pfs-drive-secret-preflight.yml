name: 666PFS Drive Secret Preflight

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - ".github/workflows/666pfs-child-freeze.yml"
      - ".github/workflows/pfs-drive-secret-preflight.yml"
      - "scripts/pfs-drive-upload.py"
      - "tests/pfs-drive-handoff-contract.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pfs-drive-secret-preflight:
    runs-on: ubuntu-latest
    env:
      PFS_GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.PFS_GDRIVE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Verify PFS Google Drive credential is configured
        shell: python
        run: |
          import json
          import os

          raw = os.environ.get("PFS_GDRIVE_SERVICE_ACCOUNT_JSON", "").strip()
          if not raw:
              raise SystemExit("PFS_GDRIVE_SERVICE_ACCOUNT_JSON is not configured")

          try:
              data = json.loads(raw)
          except Exception as exc:
              raise SystemExit(f"PFS_GDRIVE_SERVICE_ACCOUNT_JSON is not valid JSON: {exc}")

          required = ("type", "project_id", "private_key_id", "private_key", "client_email", "client_id", "token_uri")
          missing = [key for key in required if not data.get(key)]
          if missing:
              raise SystemExit("PFS service-account JSON is missing required fields: " + ", ".join(missing))

          if data.get("type") != "service_account":
              raise SystemExit("PFS credential type must be service_account")

          print("PFS_DRIVE_SECRET_PREFLIGHT=PASS")
          print("PFS_DRIVE_TARGET=666PFS/Child_Systems/666STREAM_DEPLOYMENT")
