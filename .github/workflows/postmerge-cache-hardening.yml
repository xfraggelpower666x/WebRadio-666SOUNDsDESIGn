name: Postmerge Audio Cache Hardening One Shot

on:
  push:
    branches:
      - repair/postmerge-audio-cache-hardening-20260902
    paths:
      - .github/workflows/postmerge-cache-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/postmerge-audio-cache-hardening-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replace only audio-start cache identity
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('index.html'),
              Path('VELUNA/index.html'),
              Path('veluna/index.html'),
              Path('public/index.html'),
              Path('public/VELUNA/index.html'),
              Path('public/veluna/index.html'),
          ]
          old = 'audio-start-core.js?v=20260901-owner-collision-v1'
          new = 'audio-start-core.js?v=20260902-owner-collision-v2'

          for path in files:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one old cache identity, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          test_path = Path('tests/audio-cache-identity-owner-collision.test.mjs')
          lines = test_path.read_text(encoding='utf-8').splitlines()
          out = []
          inserted_previous = False
          inserted_assertion = False
          for line in lines:
              if line == "const AUDIO_CACHE = 'audio-start-core.js?v=20260901-owner-collision-v1';":
                  out.append("const AUDIO_CACHE = 'audio-start-core.js?v=20260902-owner-collision-v2';")
                  out.append("const PREVIOUS_AUDIO_CACHE = 'audio-start-core.js?v=20260901-owner-collision-v1';")
                  inserted_previous = True
                  continue
              if 'assert.doesNotMatch(text, new RegExp(OLD_AUDIO_CACHE.replace' in line and not inserted_assertion:
                  out.append(line.replace('OLD_AUDIO_CACHE', 'PREVIOUS_AUDIO_CACHE'))
                  inserted_assertion = True
              out.append(line)
          if not inserted_previous or not inserted_assertion:
              raise SystemExit('cache regression contract insertion point not found')
          test_path.write_text('\n'.join(out) + '\n', encoding='utf-8')
      - name: Targeted cache regression
        run: node --test tests/audio-cache-identity-owner-collision.test.mjs
      - name: Full repository verify
        run: npm run verify
      - name: Commit cache-only hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html VELUNA/index.html veluna/index.html public/index.html public/VELUNA/index.html public/veluna/index.html tests/audio-cache-identity-owner-collision.test.mjs
          git diff --cached --quiet && { echo "No cache hardening delta produced"; exit 1; }
          git commit -m "Harden post-merge audio cache identity"
          git push origin HEAD:repair/postmerge-audio-cache-hardening-20260902
