name: PR201 cache owner fix

on:
  push:
    branches:
      - repair/audio-interruption-owner-collision-20260901

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/audio-interruption-owner-collision-20260901
          fetch-depth: 0
      - name: Patch cache identities and add regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old_audio = 'audio-start-core.js?v=2026-07-12-v1217'
          new_audio = 'audio-start-core.js?v=20260901-owner-collision-v1'
          htmls = [
              Path('index.html'), Path('VELUNA/index.html'), Path('veluna/index.html'),
              Path('public/index.html'), Path('public/VELUNA/index.html'), Path('public/veluna/index.html'),
          ]
          for p in htmls:
              text = p.read_text(encoding='utf-8')
              if old_audio not in text:
                  raise SystemExit(f'missing old audio cache identity in {p}')
              p.write_text(text.replace(old_audio, new_audio), encoding='utf-8')

          for p in [Path('config/veluna-assets.js'), Path('public/config/veluna-assets.js')]:
              text = p.read_text(encoding='utf-8')
              anchor = "  const bootVersion = '2026-08-12-unified-lockscreen-boot-v3';"
              if "const muteVersion = '2026-09-01-owner-collision-v1';" not in text:
                  if anchor not in text:
                      raise SystemExit(f'missing config anchor in {p}')
                  text = text.replace(anchor, "  const muteVersion = '2026-09-01-owner-collision-v1';\n" + anchor, 1)
              old_loader = "`/js/all-player-mute.js?v=${version}`"
              new_loader = "`/js/all-player-mute.js?v=${muteVersion}`"
              if old_loader not in text and new_loader not in text:
                  raise SystemExit(f'missing mute loader in {p}')
              text = text.replace(old_loader, new_loader)
              p.write_text(text, encoding='utf-8')

          test = Path('tests/audio-cache-identity-owner-collision.test.mjs')
          test.write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const htmls = [
            'index.html','VELUNA/index.html','veluna/index.html',
            'public/index.html','public/VELUNA/index.html','public/veluna/index.html'
          ];
          const AUDIO_CACHE = 'audio-start-core.js?v=20260901-owner-collision-v1';
          const OLD_AUDIO_CACHE = 'audio-start-core.js?v=2026-07-12-v1217';

          test('all Main and VELUNA entrypoints force the repaired early audio-start authority runtime', () => {
            for (const file of htmls) {
              const text = fs.readFileSync(file, 'utf8');
              assert.match(text, new RegExp(AUDIO_CACHE.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\$&')));
              assert.doesNotMatch(text, new RegExp(OLD_AUDIO_CACHE.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\$&')));
            }
          });

          test('outer all-player-mute bootstrap has a dedicated owner-collision cache identity in both mirrors', () => {
            const root = fs.readFileSync('config/veluna-assets.js', 'utf8');
            const pub = fs.readFileSync('public/config/veluna-assets.js', 'utf8');
            assert.equal(pub, root);
            assert.match(root, /const muteVersion = '2026-09-01-owner-collision-v1';/);
            assert.match(root, /\/js\/all-player-mute\.js\?v=\$\{muteVersion\}/);
          });
          """, encoding='utf-8')
          PY
          rm -f .github/workflows/pr201-cache-owner-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix outer cache identities for recovery owner repair'
          git push origin HEAD:repair/audio-interruption-owner-collision-20260901
