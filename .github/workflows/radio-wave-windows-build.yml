name: RADIO WAVE v6.66 Windows Build

on:
  push:
    branches:
      - soundwave-v1-18-2-source-import-20261002
    paths:
      - 'windows-app/SoundwaveStudio-666-PC/source-v1.18.2/**'
      - '.github/workflows/radio-wave-windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-radio-wave:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: windows-app/SoundwaveStudio-666-PC/source-v1.18.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: windows-app/SoundwaveStudio-666-PC/source-v1.18.2/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare RADIO WAVE branding
        run: npm run prepare:branding

      - name: Targeted RADIO WAVE release gates
        run: npm run check:radio-wave-release

      - name: Build unsigned NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --publish never

      - name: Verify installer artifact
        run: |
          $installer = Get-ChildItem -Path dist -Filter 'RADIO-WAVE-v6.66-Setup*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'RADIO_WAVE_NSIS_INSTALLER_MISSING' }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii dist\RADIO-WAVE-v6.66-SHA256SUMS.txt
          Write-Host "PASS installer: $($installer.FullName)"
          Write-Host "SHA256: $hash"

      - name: Upload RADIO WAVE installer
        uses: actions/upload-artifact@v4
        with:
          name: RADIO-WAVE-v6.66-Windows-Installer
          path: |
            windows-app/SoundwaveStudio-666-PC/source-v1.18.2/dist/RADIO-WAVE-v6.66-Setup*.exe
            windows-app/SoundwaveStudio-666-PC/source-v1.18.2/dist/RADIO-WAVE-v6.66-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Prepare unpacked diagnostic package
        run: |
          Copy-Item "START_RADIO_WAVE_DIAGNOSTIC.cmd" "dist\win-unpacked\START_RADIO_WAVE_DIAGNOSTIC.cmd" -Force
          $app = Get-ChildItem -Path "dist\win-unpacked" -Filter "*.exe" | Where-Object { $_.Name -eq "RADIO WAVE v6.66.exe" } | Select-Object -First 1
          if (-not $app) { throw "RADIO_WAVE_UNPACKED_EXE_MISSING" }
          $hash = (Get-FileHash -Algorithm SHA256 $app.FullName).Hash.ToLower()
          "$hash  $($app.Name)" | Set-Content -Encoding ascii "dist\win-unpacked\RADIO-WAVE-v6.66-UNPACKED-SHA256.txt"
          Write-Host "PASS unpacked app: $($app.FullName)"
          Write-Host "UNPACKED SHA256: $hash"

      - name: Upload RADIO WAVE unpacked diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: RADIO-WAVE-v6.66-Windows-Unpacked-Diagnostic
          path: windows-app/SoundwaveStudio-666-PC/source-v1.18.2/dist/win-unpacked/**
          if-no-files-found: error
          retention-days: 14
