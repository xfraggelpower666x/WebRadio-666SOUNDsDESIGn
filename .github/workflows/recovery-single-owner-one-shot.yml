name: Recovery Single Owner One Shot

on:
  push:
    branches:
      - repair/recovery-single-owner-mobile-panel-20260904

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply repair
        run: node scripts/repair-recovery-single-owner-mobile-panel.mjs
      - name: Install dependencies
        run: npm ci
      - name: Focus regression
        run: node --test tests/audio-recovery-runtime-single-owner.test.mjs
      - name: Full verify
        run: npm run verify
      - name: Commit verified repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html public/index.html js/player-core.js public/js/player-core.js tests
          git commit -m "Repair recovery single ownership and mobile Main Stream identity"
          git push
