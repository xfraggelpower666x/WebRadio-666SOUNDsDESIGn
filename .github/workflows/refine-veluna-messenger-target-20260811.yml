name: Refine VELUNA Messenger Target 20260811

on:
  push:
    branches:
      - repair/player-alert-backend-global-messenger-20260811

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/player-alert-backend-global-messenger-20260811
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply VELUNA Messenger layout-safe refinement
        run: node scripts/refine-veluna-messenger-target-20260811.mjs
      - name: Commit refined runtime files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No refinement delta pending."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/messenger-overlay.js public/js/messenger-overlay.js tests/player-alert-global-backend-repair.test.mjs
          git commit -m "Keep VELUNA Messenger inside existing action bar"
          git push origin HEAD:repair/player-alert-backend-global-messenger-20260811
