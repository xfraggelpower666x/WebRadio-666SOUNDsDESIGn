name: Release Integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Central policy JavaScript syntax
        run: |
          node --check js/boost-core.js
          node --check js/audio-policy-core.js
          node --check js/artwork-core.js
          node --check config/veluna-assets.js
      - name: Central policy contract
        run: node --test tests/central-audio-artwork-policy.test.mjs
      - name: Release structure check
        run: npm run check
      - name: Frontend contracts
        run: node --test tests/frontend-contracts.test.mjs
      - name: Admin hardlock contracts
        run: node --test tests/admin-hardlock.test.mjs
      - name: Hardlock source contracts
        run: node --test tests/hardlock-source.test.mjs
      - name: Player alert contracts
        run: node --test tests/player-alert-contract.test.mjs
      - name: Radio-only cleanup contracts
        run: node --test tests/radio-only-cleanup.test.mjs
      - name: Viewport contracts
        run: node --test tests/viewport-fullscreen.test.mjs
      - name: Worker smoke contracts
        run: node --test tests/worker-smoke.test.mjs
      - name: Overlay bootstrap contracts
        run: |
          if [ -f tests/overlay-bootstrap-all-players.test.mjs ]; then node --test tests/overlay-bootstrap-all-players.test.mjs; fi
      - name: Wrangler deployment contracts
        run: |
          if [ -f tests/deploy-wrangler-contract.test.mjs ]; then node --test tests/deploy-wrangler-contract.test.mjs; fi
      - name: Any additional Node contracts
        run: |
          for file in tests/*.test.mjs; do
            case "$file" in
              tests/central-audio-artwork-policy.test.mjs|tests/frontend-contracts.test.mjs|tests/admin-hardlock.test.mjs|tests/hardlock-source.test.mjs|tests/player-alert-contract.test.mjs|tests/radio-only-cleanup.test.mjs|tests/viewport-fullscreen.test.mjs|tests/worker-smoke.test.mjs|tests/overlay-bootstrap-all-players.test.mjs|tests/deploy-wrangler-contract.test.mjs) continue ;;
            esac
            echo "RUNNING $file"
            node --test "$file"
          done
      - name: Python syntax audit without bytecode
        shell: python
        run: |
          from pathlib import Path
          import ast
          failures = []
          for path in Path('.').rglob('*.py'):
              try:
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("Python files valid")
