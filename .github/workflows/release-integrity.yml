name: Release Integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Release checker
        run: npm run check
      - name: Audio start lifecycle regression
        run: node --test tests/audio-start-lifecycle-main-boot.test.mjs
      - name: Audio interruption owner regression
        run: node --test tests/audio-interruption-owner-collision.test.mjs
      - name: Phase10 canonical recovery regression
        run: node --test tests/phase10-canonical-recovery-delegation.test.mjs
      - name: Backup primary failover regression
        run: node --test tests/backup-stream-primary-failover.test.mjs
      - name: Audio cache identity regression
        run: node --test tests/audio-cache-identity-owner-collision.test.mjs
      - name: Full Node regression suite
        run: npm test
      - name: Python syntax audit without bytecode
        shell: python
        run: |
          from pathlib import Path
          import ast
          failures = []
          for path in Path('.').rglob('*.py'):
              try:
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("Python files valid")
