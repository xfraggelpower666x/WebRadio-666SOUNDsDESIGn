name: Release Integrity

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run verify
      - name: Python syntax audit without bytecode
        shell: python
        run: |
          from pathlib import Path
          import ast
          failures = []
          for path in Path('.').rglob('*.py'):
              try:
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("Python files valid")

  finalize-pr52:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 52 && github.event.pull_request.head.ref == 'repair-autoskip-auth-error-chain-20260724'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-autoskip-auth-error-chain-20260724
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Execute stored AutoSkip auth-chain repair
        shell: python
        run: |
          from pathlib import Path
          source = Path('.github/workflows/finalize-autoskip-auth-chain.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Apply AutoSkip authority and auth-error repair\n        shell: python\n        run: |\n'
          end_marker = '      - name: Syntax and targeted contracts\n'
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, 'autoskip-auth-chain.py', 'exec'), {'__name__':'__main__'})
      - name: Normalize final cache markers and legacy worker contract
        shell: python
        run: |
          from pathlib import Path
          import re
          cache_files = [
            'index.html','public/index.html','VELUNA/index.html','public/VELUNA/index.html',
            'veluna/index.html','public/veluna/index.html','worker.js',
            'workers/webradio-666soundsdesign-worker/worker.js'
          ]
          for name in cache_files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'admin-auth-client\.js\?v=[^"\'<>\s]+', 'admin-auth-client.js?v=2026-07-24-autoskip-auth-v1222', text)
              text = re.sub(r'skip-control\.js\?v=[^"\'<>\s]+', 'skip-control.js?v=2026-07-24-autoskip-authority-v2', text)
              text = text.replace('Admin-Passwort für Internal Auto-DJ Skip eingeben:', 'Player-Admin-Passwort für Internal Auto-DJ Skip eingeben (nicht Shoutcast-Login):')
              text = text.replace('Admin-Passwort für Auto-DJ Skip eingeben:', 'Player-Admin-Passwort für Auto-DJ Skip eingeben (nicht Shoutcast-Login):')
              path.write_text(text, encoding='utf-8')
          test = Path('tests/worker-smoke.test.mjs')
          text = test.read_text(encoding='utf-8')
          text = text.replace('skip-control\\.js\\?v=2026-07-19-action-parity-v1', 'skip-control\\.js\\?v=2026-07-24-autoskip-authority-v2')
          test.write_text(text, encoding='utf-8')
      - name: Syntax and targeted contracts
        run: |
          node --check js/admin-auth-client.js
          node --check js/skip-control.js
          node --check worker-addons/skip-api-addon.js
          node --check worker-addons/radio-admin-config-addon.js
          node --test tests/admin-hardlock.test.mjs tests/autoskip-auth-chain.test.mjs tests/hardlock-source.test.mjs tests/frontend-contracts.test.mjs tests/worker-smoke.test.mjs
      - name: Full repository verification
        run: npm run verify
      - name: Publish verified repair
        run: |
          rm -f .github/workflows/finalize-autoskip-auth-chain.yml
          rm -f docs/AUTOSKIP_AUTH_CHAIN_TRIGGER.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Repair AutoSkip authentication and MyIDJ worker authority"
          git push origin HEAD:repair-autoskip-auth-error-chain-20260724
