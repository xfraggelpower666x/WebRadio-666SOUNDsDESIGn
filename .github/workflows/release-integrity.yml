name: Release Integrity

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply full panel LED owner repair
        if: github.ref == 'refs/heads/repair/full-panel-led-owner-audit-20260904' && github.actor != 'github-actions[bot]'
        run: |
          node scripts/fix-repair-full-panel-led-owner.mjs
          node scripts/repair-full-panel-led-owner.mjs
      - run: npm ci
      - name: Release checker
        run: npm run check
      - name: Node regression tests
        run: npm test
      - name: Python syntax audit without bytecode
        shell: python
        run: |
          from pathlib import Path
          import ast
          failures = []
          for path in Path('.').rglob('*.py'):
              try:
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("Python files valid")
      - name: Commit verified repair
        if: github.ref == 'refs/heads/repair/full-panel-led-owner-audit-20260904' && github.actor != 'github-actions[bot]' && success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/player-core.js public/js/player-core.js index.html public/index.html tests
          git commit -m "Repair full function panel LED ownership and meter writer" || exit 0
          git push
