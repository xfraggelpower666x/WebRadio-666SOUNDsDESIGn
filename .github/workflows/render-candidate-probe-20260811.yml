name: Temporary Render Candidate Probe 20260811

on:
  push:
    branches:
      - audit/player-alert-live-smoke-20260811

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare configured and render.yaml service-name candidates
        shell: bash
        env:
          CONFIGURED_URL: https://666soundsdesign-alert-service.onrender.com
          SERVICE_NAME_URL: https://auto-setup-render-for-backend-mp3.onrender.com
        run: |
          set -Eeuo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          probe() {
            local name="$1"
            local base="$2"
            local path="$3"
            local out="$workdir/${name}-$(echo "$path" | tr '/.' '__').txt"
            local code
            code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 35 \
              --header 'Cache-Control: no-cache' \
              --output "$out" --write-out '%{http_code}' \
              "${base}${path}?probe=${GITHUB_SHA}-$(date +%s)" || true)"
            echo "${name} ${path} HTTP=${code:-curl_error} BYTES=$(wc -c < "$out" 2>/dev/null || echo 0)"
            if [[ -s "$out" ]]; then
              head -c 2400 "$out" || true
              echo
            fi
          }

          for path in /health /openapi.json /api/player-alert/status; do
            probe configured "$CONFIGURED_URL" "$path"
          done
          for path in /health /openapi.json /api/player-alert/status; do
            probe service-name "$SERVICE_NAME_URL" "$path"
          done
