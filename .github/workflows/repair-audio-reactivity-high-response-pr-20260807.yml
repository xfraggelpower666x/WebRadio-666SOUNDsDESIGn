name: Repair Audio Reactivity High Response PR 20260807

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'repair/audio-reactivity-high-response-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/audio-reactivity-high-response-20260807
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch and verify canonical visualizer
        shell: python
        run: |
          from pathlib import Path
          p=Path('js/equalizer.js')
          s=p.read_text(encoding='utf-8')
          pairs=[
            ('new Array(mobileBars.length).fill(24)','new Array(mobileBars.length).fill(18)'),
            ('new Array(bandCount).fill(24)','new Array(bandCount).fill(18)'),
            ('const localGate = clamp((local - 6) / 26, 0, 1);','const localGate = clamp((local - 2) / 14, 0, 1);'),
            ('const currentReference = bandReference[index] || 24;','const currentReference = bandReference[index] || 18;'),
            ('const desiredReference = Math.max(14, local);','const desiredReference = Math.max(8, local);'),
            ('? currentReference + (desiredReference - currentReference) * 0.025','? currentReference + (desiredReference - currentReference) * 0.08'),
            (': Math.max(14, currentReference * 0.9994);',': Math.max(8, currentReference * 0.9985);'),
            ('const relative = clamp(local / Math.max(14, bandReference[index]), 0, 1);','const relative = clamp(local / Math.max(8, bandReference[index]), 0, 1);'),
            ('const visualTilt = 1 + Math.pow(position, 1.24) * 0.34;','const visualTilt = 1 + Math.pow(position, 1.18) * 1.10;'),
            ('const spectral = Math.pow(absolute, 0.74) * visualTilt;','const spectral = Math.pow(absolute, 0.52) * visualTilt;'),
            ('const spectralResponse = spectral * (0.20 + localGate * 0.80);','const spectralResponse = spectral * (0.35 + localGate * 0.65);'),
            ('const adaptiveResponse = Math.pow(relative, 0.82) * 0.065 * localGate;','const adaptiveResponse = Math.pow(relative, 0.70) * 0.22 * localGate;'),
            ('        const transient = clamp((localPeak - average) / 255, 0, 1);\n        const transientResponse = Math.pow(transient, 0.72) * 0.14 * localGate;\n        const energy = spectralResponse * 0.68 + adaptiveResponse + transientResponse;\n        const peakHeadroom = 0.78 + clamp(localPeak / 255, 0, 1) * 0.22;\n',''),
            ('? clamp(energy, 0.012, peakHeadroom)','? clamp(spectralResponse * 0.92 + adaptiveResponse, 0.012, 1)'),
            ('const attack = 0.62 + position * 0.08;','const attack = 0.76 + position * 0.12;'),
            ('const release = 0.13 + position * 0.02;','const release = 0.15 + position * 0.03;')]
          for a,b in pairs:
            if a not in s: raise SystemExit('missing:'+a)
            s=s.replace(a,b)
          if 'localPeak - average' in s: raise SystemExit('scope regression remains')
          p.write_text(s,encoding='utf-8')
          Path('public/js/equalizer.js').write_text(s,encoding='utf-8')
          Path('tests/audio-reactivity-high-response-runtime.test.mjs').write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\nconst read=p=>readFile(new URL(`../${p}`,import.meta.url),'utf8');\ntest('canonical audio reactivity is live and high-response',async()=>{const eq=await read('js/equalizer.js');assert.match(eq,/\(local - 2\) \/ 14/);assert.match(eq,/attack = 0\.76/);assert.match(eq,/release = 0\.15/);assert.match(eq,/spectralResponse \* 0\.92 \+ adaptiveResponse/);assert.doesNotMatch(eq,/localPeak - average/);assert.match(eq,/visualSignalScale/);assert.equal(await read('public/js/equalizer.js'),eq);});\n""",encoding='utf-8')
      - name: Verify targeted repair
        run: |
          node --check js/equalizer.js
          node --test tests/audio-reactivity-high-response-runtime.test.mjs
          cmp -s js/equalizer.js public/js/equalizer.js
      - name: Commit clean repair
        run: |
          rm -f .github/workflows/repair-audio-reactivity-high-response-20260807.yml
          rm -f .github/workflows/repair-audio-reactivity-high-response-pr-20260807.yml
          rm -f .github/audio-reactivity-trigger-20260807
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair live audio reactivity without changing player layout"
          git push origin HEAD:repair/audio-reactivity-high-response-20260807
