name: Repair broadcast send single authority

on:
  push:
    branches:
      - repair/broadcast-send-single-authority-20260804
    paths:
      - scripts/repair-broadcast-send-single-authority.mjs
      - .github/workflows/repair-broadcast-send-single-authority.yml
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/broadcast-send-single-authority-20260804
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/repair-broadcast-send-single-authority.mjs
      - run: node --test tests/broadcast-send-single-authority.test.mjs
      - run: node --check js/addons/player-broadcast-alert-v148.js
      - run: |
          rm scripts/repair-broadcast-send-single-authority.mjs
          rm .github/workflows/repair-broadcast-send-single-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/addons/player-broadcast-alert-v148.js public/js/addons/player-broadcast-alert-v148.js tests/broadcast-send-single-authority.test.mjs scripts/repair-broadcast-send-single-authority.mjs .github/workflows/repair-broadcast-send-single-authority.yml
          git commit -m "Enforce single broadcast send authority"
          git push
