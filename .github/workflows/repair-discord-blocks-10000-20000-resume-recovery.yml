name: Repair Discord Blocks 10000-20000 Resume Recovery

on:
  push:
    branches:
      - repair/discord-blocks-10000-20000-resume-recovery-20260805
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/discord-blocks-10000-20000-resume-recovery-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply resume and recovery repair
        run: node scripts/repair-discord-blocks-10000-20000-resume-recovery.mjs
      - name: Run focused tests
        run: node --test tests/discord-blocks-10000-20000-resume-recovery.test.mjs tests/discord-blocks-5000-10000-lifecycle.test.mjs tests/discord-blocks-3000-5000-load-timeout.test.mjs tests/discord-blocks-2000-3000-runtime.test.mjs tests/discord-blocks-1000-2000-init-state.test.mjs
      - name: Self-clean and commit
        run: |
          rm -f scripts/repair-discord-blocks-10000-20000-resume-recovery.mjs
          rm -f .github/workflows/repair-discord-blocks-10000-20000-resume-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js tests/discord-blocks-10000-20000-resume-recovery.test.mjs scripts/repair-discord-blocks-10000-20000-resume-recovery.mjs .github/workflows/repair-discord-blocks-10000-20000-resume-recovery.yml
          git commit -m "Repair Discord resume and recovery races"
          git push origin HEAD:repair/discord-blocks-10000-20000-resume-recovery-20260805
