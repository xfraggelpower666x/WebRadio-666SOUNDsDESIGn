name: Repair Discord Blocks 100000-120000

on:
  push:
    branches:
      - repair/discord-blocks-100000-120000-observer-cancel-20260806

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout quarantine branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact quarantine base and transport scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=365566d68487abc707cac6275148745f6c6be717
          git merge-base --is-ancestor "$BASE" HEAD
          mapfile -t files < <(git diff --name-only "$BASE" HEAD | sort)
          printf '%s\n' "${files[@]}"
          expected=(
            .github/workflows/repair-discord-blocks-100000-120000.yml
            .repair/block120.patch.b64
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#files[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${files[@]}")

      - name: Verify and apply hash-locked patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .repair/block120.patch.b64)" -eq 3380
          echo '89ed04e898878184f98ead171696e906d882a33957d41785f03329343c3a7a5e  .repair/block120.patch.b64' | sha256sum -c -
          base64 -d .repair/block120.patch.b64 > /tmp/block120.patch.gz
          echo 'e00af84bd7731b95d4cca61bd058e39cd12c2ef538ae72af674db3a846f131cc  /tmp/block120.patch.gz' | sha256sum -c -
          gzip -dc /tmp/block120.patch.gz > /tmp/block120.patch
          echo '4f38dc9da3f402306a73ff5b19cf8bc048f3be9b554dbdcf78e0cb2c18c81685  /tmp/block120.patch' | sha256sum -c -
          git apply --check /tmp/block120.patch
          git apply /tmp/block120.patch

      - name: Verify exact repaired target hashes and mirrors
        shell: bash
        run: |
          set -euo pipefail
          echo '9c3a8caf12fc0a3f67cc1073202026cf332b9b09d624ca3025780fc79bff4286  js/addons/discord-player-addon-v3.js' | sha256sum -c -
          echo '9c3a8caf12fc0a3f67cc1073202026cf332b9b09d624ca3025780fc79bff4286  public/js/addons/discord-player-addon-v3.js' | sha256sum -c -
          echo '046897f18ceb0b7c333c3ac743393391722b02773153b88adcfa0837cce4bdcf  tests/discord-blocks-3000-5000-load-timeout.test.mjs' | sha256sum -c -
          echo '6b99b6ba48fe79b255612512574617085581027aead3dfecd3730f8e91215eeb  tests/discord-blocks-100000-120000-observer-request-authority.test.mjs' | sha256sum -c -
          cmp -s js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js

      - name: Full repository verification
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify
          npm audit --audit-level=high
          python - <<'PY'
          from pathlib import Path
          import ast
          failures=[]
          for path in Path('.').rglob('*.py'):
              try:
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              except Exception as exc:
                  failures.append(f'{path}: {exc}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('Python files valid')
          PY

      - name: Self-clean and commit exact repair scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=365566d68487abc707cac6275148745f6c6be717
          rm -f .repair/block120.patch.b64
          rmdir .repair 2>/dev/null || true
          rm -f .github/workflows/repair-discord-blocks-100000-120000.yml
          git add -A
          mapfile -t files < <(git diff --cached --name-only "$BASE" | sort)
          expected=(
            js/addons/discord-player-addon-v3.js
            public/js/addons/discord-player-addon-v3.js
            tests/discord-blocks-100000-120000-observer-request-authority.test.mjs
            tests/discord-blocks-3000-5000-load-timeout.test.mjs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#files[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${files[@]}")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair Discord observer and request authority blocks 100000-120000'
          git push origin HEAD:repair/discord-blocks-100000-120000-observer-cancel-20260806
