name: Repair Discord Blocks 200-500 Frontend Truth
# trigger registration
on:
  pull_request:
    branches: [WebRadio-666SOUNDsDESIGn]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  repair:
    if: github.head_ref == 'repair/discord-blocks-200-500-frontend-truth-20260805'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/discord-blocks-200-500-frontend-truth-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply consolidated frontend repair
        run: node scripts/repair-discord-blocks-200-500-frontend-truth.mjs
      - name: Run focused regression tests
        run: node --test tests/discord-blocks-200-500-frontend-truth.test.mjs tests/discord-startup-autopost-retry.test.mjs tests/discord-worker-delivery-dedupe.test.mjs
      - name: Self-clean and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/repair-discord-blocks-200-500-frontend-truth.mjs .github/workflows/repair-discord-blocks-200-500-frontend-truth.yml
          git add js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js tests/discord-blocks-200-500-frontend-truth.test.mjs
          git commit -m "Repair Discord frontend truth blocks 200-500"
          git push
