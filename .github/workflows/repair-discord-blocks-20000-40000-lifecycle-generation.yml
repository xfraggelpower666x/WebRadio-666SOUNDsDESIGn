name: Repair Discord Blocks 20000-40000 Lifecycle Generation

on:
  push:
    branches:
      - repair/discord-blocks-20000-40000-lifecycle-generation-20260805

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/discord-blocks-20000-40000-lifecycle-generation-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rehydrate and apply lifecycle generation repair
        shell: bash
        run: |
          cat > /tmp/repair-discord-20000-40000.b64 <<'B64'
          
          B64
          base64 -d /tmp/repair-discord-20000-40000.b64 | gzip -dc > /tmp/repair-discord-20000-40000.mjs
          node --check /tmp/repair-discord-20000-40000.mjs
          node /tmp/repair-discord-20000-40000.mjs
      - name: Verify addon syntax and mirror integrity
        run: |
          node --check js/addons/discord-player-addon-v3.js
          node --check public/js/addons/discord-player-addon-v3.js
          cmp -s js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js
      - name: Run focused regression chain
        run: node --test tests/discord-blocks-20000-40000-lifecycle-generation.test.mjs tests/discord-blocks-10000-20000-resume-recovery.test.mjs tests/discord-blocks-5000-10000-lifecycle.test.mjs tests/discord-blocks-3000-5000-load-timeout.test.mjs tests/discord-blocks-2000-3000-runtime.test.mjs tests/discord-blocks-1000-2000-init-state.test.mjs
      - name: Self-clean and commit repair
        run: |
          rm -f .github/workflows/repair-discord-blocks-20000-40000-lifecycle-generation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js tests/discord-blocks-20000-40000-lifecycle-generation.test.mjs .github/workflows/repair-discord-blocks-20000-40000-lifecycle-generation.yml
          git commit -m "Repair Discord lifecycle generations blocks 20000-40000"
          git push origin HEAD:repair/discord-blocks-20000-40000-lifecycle-generation-20260805
