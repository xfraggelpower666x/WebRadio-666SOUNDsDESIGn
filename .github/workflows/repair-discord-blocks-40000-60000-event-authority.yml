name: Repair Discord Blocks 40000-60000 Event Authority

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'repair/discord-blocks-40000-60000-event-authority-20260805'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/discord-blocks-40000-60000-event-authority-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hash-gated event authority repair
        run: |
          cat .github/repair/discord-blocks-40000-60000.payload.part* | tr -d '\n' | base64 -d | gzip -dc > /tmp/repair-discord-40000-60000.py
          python /tmp/repair-discord-40000-60000.py
      - name: Verify syntax mirrors and focused regressions
        run: |
          node --check js/addons/discord-player-addon-v3.js
          node --check public/js/addons/discord-player-addon-v3.js
          cmp -s js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js
          node --test tests/discord-blocks-40000-60000-network-event-authority.test.mjs tests/discord-blocks-20000-40000-lifecycle-generation.test.mjs tests/discord-blocks-10000-20000-resume-recovery.test.mjs tests/discord-blocks-5000-10000-lifecycle.test.mjs
      - name: Run full repository verification
        run: |
          npm ci
          npm run verify
      - name: Self-clean and commit repair
        run: |
          rm -f .github/workflows/repair-discord-blocks-40000-60000-event-authority.yml
          rm -f .github/repair/discord-blocks-40000-60000.payload.part*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js tests/discord-blocks-40000-60000-network-event-authority.test.mjs .github/workflows/repair-discord-blocks-40000-60000-event-authority.yml .github/repair/discord-blocks-40000-60000.payload.part01 .github/repair/discord-blocks-40000-60000.payload.part02 .github/repair/discord-blocks-40000-60000.payload.part03 .github/repair/discord-blocks-40000-60000.payload.part04
          git commit -m "Repair Discord event authority blocks 40000-60000"
          git push origin HEAD:repair/discord-blocks-40000-60000-event-authority-20260805
