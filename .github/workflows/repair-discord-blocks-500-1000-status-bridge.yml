name: Repair Discord Blocks 500-1000 Status Bridge
on:
  pull_request:
    branches: [WebRadio-666SOUNDsDESIGn]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  repair:
    if: github.head_ref == 'repair/discord-blocks-500-1000-status-bridge-20260805'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/discord-blocks-500-1000-status-bridge-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply status bridge repair
        run: node scripts/repair-discord-blocks-500-1000-status-bridge.mjs
      - name: Run focused tests
        run: node --test tests/discord-blocks-500-1000-status-bridge.test.mjs tests/discord-blocks-200-500-frontend-truth.test.mjs
      - name: Self-clean and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/repair-discord-blocks-500-1000-status-bridge.mjs .github/workflows/repair-discord-blocks-500-1000-status-bridge.yml
          git add veluna/index.html VELUNA/index.html public/veluna/index.html public/VELUNA/index.html js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js tests/discord-blocks-500-1000-status-bridge.test.mjs
          git commit -m "Repair Discord status bridge blocks 500-1000"
          git push
