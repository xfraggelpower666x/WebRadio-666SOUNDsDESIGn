name: Repair Discord Blocks 5000-10000 Lifecycle
on:
  pull_request:
    branches: [WebRadio-666SOUNDsDESIGn]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  repair:
    if: github.head_ref == 'repair/discord-blocks-5000-10000-lifecycle-20260805'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/discord-blocks-5000-10000-lifecycle-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply lifecycle repair
        run: node scripts/repair-discord-blocks-5000-10000-lifecycle.mjs
      - name: Run focused tests
        run: node --test tests/discord-blocks-5000-10000-lifecycle.test.mjs tests/discord-blocks-3000-5000-load-timeout.test.mjs tests/discord-blocks-2000-3000-runtime.test.mjs tests/discord-blocks-1000-2000-init-state.test.mjs tests/discord-blocks-500-1000-status-bridge.test.mjs tests/discord-blocks-200-500-frontend-truth.test.mjs
      - name: Self-clean and commit
        run: |
          rm scripts/repair-discord-blocks-5000-10000-lifecycle.mjs
          rm .github/workflows/repair-discord-blocks-5000-10000-lifecycle.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js tests/discord-blocks-5000-10000-lifecycle.test.mjs scripts/repair-discord-blocks-5000-10000-lifecycle.mjs .github/workflows/repair-discord-blocks-5000-10000-lifecycle.yml
          git commit -m "Repair Discord lifecycle blocks 5000-10000"
          git push origin HEAD:repair/discord-blocks-5000-10000-lifecycle-20260805
