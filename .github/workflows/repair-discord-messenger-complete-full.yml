# segmented transport staging
name: Complete Discord Messenger Player Alert Full Repair

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    types:
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: complete-discord-messenger-player-alert-full-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout quarantine branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: repair/discord-messenger-complete-full-20260806

      - name: Verify exact production base and source hashes
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='6619973e54f35f56d9691b45678f83f5f192d6c5'
          PROD_BRANCH='WebRadio-666SOUNDsDESIGn'
          git fetch origin "$PROD_BRANCH" --depth=1
          ACTUAL_PROD="$(git rev-parse "origin/$PROD_BRANCH")"
          test "$ACTUAL_PROD" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD

          printf '%s  %s\n' \
            '9c3a8caf12fc0a3f67cc1073202026cf332b9b09d624ca3025780fc79bff4286' 'js/addons/discord-player-addon-v3.js' \
            '9c3a8caf12fc0a3f67cc1073202026cf332b9b09d624ca3025780fc79bff4286' 'public/js/addons/discord-player-addon-v3.js' \
            '2f535496b2f3a4d69a7a8959728d4b465240c6b33a1bfeaa91f386ad9c0aeb8a' 'js/messenger-overlay.js' \
            '2f535496b2f3a4d69a7a8959728d4b465240c6b33a1bfeaa91f386ad9c0aeb8a' 'public/js/messenger-overlay.js' \
            '7283b2d81e90b90a35dbdf4ee3d449142c74bf3677f009f5dd520bccc1548435' 'js/player-alert-client.js' \
            '7283b2d81e90b90a35dbdf4ee3d449142c74bf3677f009f5dd520bccc1548435' 'public/js/player-alert-client.js' \
            '6b99b6ba48fe79b255612512574617085581027aead3dfecd3730f8e91215eeb' 'tests/discord-blocks-100000-120000-observer-request-authority.test.mjs' \
            '1eef5b6e797d12fb319e40d7337a3381cd638c58220e9bf6de8a1092d48b19f2' 'tests/discord-blocks-2000-3000-runtime.test.mjs' \
            '8b72f1327fe9798d7cd6538eda0c3a6daf190647f4bb6aba75400668e7ba8f9c' 'tests/discord-blocks-80000-100000-abort-loader-status.test.mjs' \
            | sha256sum -c -

          test ! -e tests/discord-messenger-complete-full-repair.test.mjs
          printf '%s  %s\n' \
            '0be552f1216a7906d61fe3ada315e55835baa6e2ab67467838d23a734f59f319' '.repair/complete-full-repair.patch.b64.part01' \
            '92f90c2e90b4e5c3a1c4009f86c42c1625fb566f85faac9c3cf9482e9a2dcf79' '.repair/complete-full-repair.patch.b64.part02' \
            '9544b5bdde7cebc6e203100af1c01553d0c9bea4e7bb65c99fa646a46fed6a58' '.repair/complete-full-repair.patch.b64.part03' \
            'b46b9a0b51bc195160f29d318a8d697bb5baa64a711055fc435b83ef203dd434' '.repair/complete-full-repair.patch.b64.part041' \
            '3e389b5370b6fe2da4abdffb3909e45d91a594a3150048853d970813a93d2b62' '.repair/complete-full-repair.patch.b64.part042' \
            '9a80449ebbe3a2766928ac017d4ed6d8d47f5a49c809d771baa9cb1c06f1b5c6' '.repair/complete-full-repair.patch.b64.part043' \
            '05a4af45ab0802ebf73b06b843ac9cfe33efc5ad33de4990c2da4758d3cece21' '.repair/complete-full-repair.patch.b64.part044' \
            '0b30277570d6bc71d39e841ccc1b10cb99521e8b941a74f2c73fa65fb788d94c' '.repair/complete-full-repair.patch.b64.part05' \
            '8331d996ad3b2ba1a4819228b63ec76cbb8d861fae47280d915f3d31e7bc7c78' '.repair/complete-full-repair.patch.b64.part06' \
            '61cc4dad3f5979bc0fc6f096a14f6074edb1a1de642601bac2a13ca17be38ab4' '.repair/complete-full-repair.patch.b64.part07' \
            'dd58165505bceea4db8f3520647590cf34f94052973bd78dad7c487904ba4bb1' '.repair/complete-full-repair.patch.b64.part08' \
            | sha256sum -c -

      - name: Decode, verify and apply full repair
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/complete-full-repair.patch.b64.part01 .repair/complete-full-repair.patch.b64.part02 .repair/complete-full-repair.patch.b64.part03 .repair/complete-full-repair.patch.b64.part041 .repair/complete-full-repair.patch.b64.part042 .repair/complete-full-repair.patch.b64.part043 .repair/complete-full-repair.patch.b64.part044 .repair/complete-full-repair.patch.b64.part05 .repair/complete-full-repair.patch.b64.part06 .repair/complete-full-repair.patch.b64.part07 .repair/complete-full-repair.patch.b64.part08 > /tmp/complete-full-repair.patch.b64
          test "$(sha256sum /tmp/complete-full-repair.patch.b64 | cut -d' ' -f1)" = 'e5d70593520b9d12a7372dc2c685dd76f99a8d7dfe448e26f615910e05c11c58'
          base64 --decode /tmp/complete-full-repair.patch.b64 > /tmp/complete-full-repair.patch.gz
          test "$(sha256sum /tmp/complete-full-repair.patch.gz | cut -d' ' -f1)" = '86ed859d5ccee0a01c3655bd4351f3c5c59d6542729e6349b375c8bc35103f6c'
          gzip --decompress --stdout /tmp/complete-full-repair.patch.gz > /tmp/complete-full-repair.patch
          test "$(sha256sum /tmp/complete-full-repair.patch | cut -d' ' -f1)" = 'c9ef9589f34627f2669803f1914c1b49639a136677108455122d1f12bbc0e484'
          git apply --check /tmp/complete-full-repair.patch
          git apply /tmp/complete-full-repair.patch

      - name: Verify target hashes and runtime mirrors
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '9dfcc33a7e7ba4e35c0e962a65137ab35b462cee86c81cdb42d317512862d85a' 'js/addons/discord-player-addon-v3.js' \
            '9dfcc33a7e7ba4e35c0e962a65137ab35b462cee86c81cdb42d317512862d85a' 'public/js/addons/discord-player-addon-v3.js' \
            'ef39772c611a7ca989b894ff8a1d6849f3ada9d6ee0a6fb77969b2683d9f6cfa' 'js/messenger-overlay.js' \
            'ef39772c611a7ca989b894ff8a1d6849f3ada9d6ee0a6fb77969b2683d9f6cfa' 'public/js/messenger-overlay.js' \
            'd15ffd1b1040ddbe6aa1381301a350e89743303dee8346b403c2e27cac9a32ee' 'js/player-alert-client.js' \
            'd15ffd1b1040ddbe6aa1381301a350e89743303dee8346b403c2e27cac9a32ee' 'public/js/player-alert-client.js' \
            '70f09dbbb268d031e87b62fcb58886741ab5b244cd284ffe1cbe6906c1f17230' 'tests/discord-blocks-100000-120000-observer-request-authority.test.mjs' \
            '09f69a741cfb147d496b34c001cf7b01ba92f34d156576407278b89f6394444b' 'tests/discord-blocks-2000-3000-runtime.test.mjs' \
            '178241c5b93a75b3215cf1c4533a2a776e0f5371ccbd73140ecb23e560ce1f4e' 'tests/discord-blocks-80000-100000-abort-loader-status.test.mjs' \
            '1d0f2e1b0f26b845c391b873e5d9ff0455cf04008915f0057cedd58659027865' 'tests/discord-messenger-complete-full-repair.test.mjs' \
            | sha256sum -c -

          cmp -s js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js
          cmp -s js/messenger-overlay.js public/js/messenger-overlay.js
          cmp -s js/player-alert-client.js public/js/player-alert-client.js

      - name: Install and run complete repository verification
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify | tee /tmp/full-verify.log
          grep -Eq '^# tests 292$' /tmp/full-verify.log
          grep -Eq '^# pass 292$' /tmp/full-verify.log
          grep -Eq '^# fail 0$' /tmp/full-verify.log

      - name: Self-clean transport and verify exact final scope
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW='.github/workflows/repair-discord-messenger-complete-full.yml'
          PAYLOAD_PARTS=(.repair/complete-full-repair.patch.b64.part01 .repair/complete-full-repair.patch.b64.part02 .repair/complete-full-repair.patch.b64.part03 .repair/complete-full-repair.patch.b64.part041 .repair/complete-full-repair.patch.b64.part042 .repair/complete-full-repair.patch.b64.part043 .repair/complete-full-repair.patch.b64.part044 .repair/complete-full-repair.patch.b64.part05 .repair/complete-full-repair.patch.b64.part06 .repair/complete-full-repair.patch.b64.part07 .repair/complete-full-repair.patch.b64.part08)
          TARGETS=(
            'js/addons/discord-player-addon-v3.js'
            'public/js/addons/discord-player-addon-v3.js'
            'js/messenger-overlay.js'
            'public/js/messenger-overlay.js'
            'js/player-alert-client.js'
            'public/js/player-alert-client.js'
            'tests/discord-blocks-100000-120000-observer-request-authority.test.mjs'
            'tests/discord-blocks-2000-3000-runtime.test.mjs'
            'tests/discord-blocks-80000-100000-abort-loader-status.test.mjs'
            'tests/discord-messenger-complete-full-repair.test.mjs'
          )

          git add -- "${TARGETS[@]}"
          git rm -- "$WORKFLOW" "${PAYLOAD_PARTS[@]}"

          printf '%s\n' "${TARGETS[@]}" | sort > /tmp/expected-scope.txt
          git diff --cached --name-only '6619973e54f35f56d9691b45678f83f5f192d6c5' | sort > /tmp/actual-scope.txt
          diff -u /tmp/expected-scope.txt /tmp/actual-scope.txt
          test "$(wc -l < /tmp/actual-scope.txt)" -eq 10

      - name: Commit complete full repair
        shell: bash
        env:
          BRANCH: repair/discord-messenger-complete-full-20260806
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete Discord Messenger Player Alert full repair'
          git push origin "HEAD:$BRANCH"
