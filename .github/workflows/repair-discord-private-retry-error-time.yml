name: Repair Discord Private Retry Error Time
on:
  pull_request:
    branches: [WebRadio-666SOUNDsDESIGn]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  repair:
    if: github.head_ref == 'repair/discord-private-retry-error-time-20260805'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/discord-private-retry-error-time-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply isolated repair
        run: node scripts/repair-discord-private-retry-error-time.mjs
      - name: Run regression tests
        run: node --test tests/discord-private-retry-error-time.test.mjs tests/discord-private-retry-diagnostics.test.mjs tests/discord-private-retry.test.mjs tests/discord-private-pending-track-boundary.test.mjs
      - name: Self-clean and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/repair-discord-private-retry-error-time.mjs .github/workflows/repair-discord-private-retry-error-time.yml
          git add worker-addons/discord-notify-addon-v3.js workers/webradio-666soundsdesign-worker/worker-addons/discord-notify-addon-v3.js tests/discord-private-retry-error-time.test.mjs
          git commit -m "Clear stale private retry error timestamp"
          git push
