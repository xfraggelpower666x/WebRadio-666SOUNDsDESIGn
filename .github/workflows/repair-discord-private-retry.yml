name: Repair Discord private retry
on:
  push:
    branches: [repair/discord-private-retry-20260805]
    paths:
      - scripts/repair-discord-private-retry.mjs
      - .github/workflows/repair-discord-private-retry.yml
  pull_request:
    branches: [WebRadio-666SOUNDsDESIGn]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/discord-private-retry-20260805
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/repair-discord-private-retry.mjs
      - run: node --test tests/discord-private-retry.test.mjs
      - run: node --check worker-addons/discord-notify-addon-v3.js
      - run: |
          rm scripts/repair-discord-private-retry.mjs
          rm .github/workflows/repair-discord-private-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker-addons/discord-notify-addon-v3.js workers/webradio-666soundsdesign-worker/worker-addons/discord-notify-addon-v3.js tests/discord-private-retry.test.mjs scripts/repair-discord-private-retry.mjs .github/workflows/repair-discord-private-retry.yml
          git commit -m "Retry failed private Discord delivery without reposting main"
          git push
