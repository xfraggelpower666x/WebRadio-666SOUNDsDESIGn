name: Repair Discord startup autopost retry

on:
  push:
    branches:
      - repair/discord-startup-autopost-retry-20260804
    paths:
      - scripts/repair-discord-startup-autopost-retry.mjs
      - .github/workflows/repair-discord-startup-autopost-retry.yml
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/discord-startup-autopost-retry-20260804
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/repair-discord-startup-autopost-retry.mjs
      - run: node --test tests/discord-startup-autopost-retry.test.mjs
      - run: node --check js/addons/discord-player-addon-v3.js
      - run: |
          rm scripts/repair-discord-startup-autopost-retry.mjs
          rm .github/workflows/repair-discord-startup-autopost-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/addons/discord-player-addon-v3.js public/js/addons/discord-player-addon-v3.js tests/discord-startup-autopost-retry.test.mjs scripts/repair-discord-startup-autopost-retry.mjs .github/workflows/repair-discord-startup-autopost-retry.yml
          git commit -m "Retry Discord startup autopost safely"
          git push
