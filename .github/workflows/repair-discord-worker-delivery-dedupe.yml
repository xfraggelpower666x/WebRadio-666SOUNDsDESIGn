name: Repair Discord worker delivery dedupe

on:
  push:
    branches:
      - repair/discord-worker-delivery-dedupe-20260804
    paths:
      - scripts/repair-discord-worker-delivery-dedupe.mjs
      - .github/workflows/repair-discord-worker-delivery-dedupe.yml
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/discord-worker-delivery-dedupe-20260804
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/repair-discord-worker-delivery-dedupe.mjs
      - run: node --test tests/discord-worker-delivery-dedupe.test.mjs
      - run: node --check worker-addons/discord-notify-addon-v3.js
      - run: |
          rm scripts/repair-discord-worker-delivery-dedupe.mjs
          rm .github/workflows/repair-discord-worker-delivery-dedupe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker-addons/discord-notify-addon-v3.js workers/webradio-666soundsdesign-worker/worker-addons/discord-notify-addon-v3.js tests/discord-worker-delivery-dedupe.test.mjs scripts/repair-discord-worker-delivery-dedupe.mjs .github/workflows/repair-discord-worker-delivery-dedupe.yml
          git commit -m "Commit Discord dedupe after successful delivery"
          git push
# corrected-test-boundary-trigger
