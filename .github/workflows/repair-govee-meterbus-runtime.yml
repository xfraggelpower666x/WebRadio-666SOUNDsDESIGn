name: Repair Govee MeterBus runtime

on:
  push:
    branches:
      - repair/govee-meterbus-runtime-20260804
    paths:
      - scripts/repair-govee-meterbus-runtime.mjs
      - .github/workflows/repair-govee-meterbus-runtime.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/govee-meterbus-runtime-20260804
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/repair-govee-meterbus-runtime.mjs
      - run: node --test tests/govee-meterbus-runtime.test.mjs
      - run: |
          for f in js/system-extra/govee/govee-sync-config.js js/system-extra/govee/govee-bridge-client.js js/system-extra/govee/govee-scene-sync.js js/system-extra/govee/govee-fx-control-hooks.js; do cp "$f" "/tmp/$(basename "$f" .js).mjs"; node --check "/tmp/$(basename "$f" .js).mjs"; done
      - run: |
          rm scripts/repair-govee-meterbus-runtime.mjs
          rm .github/workflows/repair-govee-meterbus-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/system-extra/govee public/js/system-extra/govee tests/govee-meterbus-runtime.test.mjs scripts/repair-govee-meterbus-runtime.mjs .github/workflows/repair-govee-meterbus-runtime.yml
          git commit -m "Wire Govee sync to canonical MeterBus runtime"
          git push
