name: Repair Govee status LED binding

on:
  push:
    branches:
      - repair/govee-status-led-binding-20260804
    paths:
      - scripts/repair-govee-status-led-binding.mjs
      - .github/workflows/repair-govee-status-led-binding.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/govee-status-led-binding-20260804
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/repair-govee-status-led-binding.mjs
      - run: node --test tests/govee-status-led-binding.test.mjs
      - run: |
          cp js/system-extra/govee/govee-scene-sync.js /tmp/govee-scene-sync.mjs
          node --check /tmp/govee-scene-sync.mjs
      - run: |
          rm scripts/repair-govee-status-led-binding.mjs
          rm .github/workflows/repair-govee-status-led-binding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/system-extra/govee/govee-scene-sync.js public/js/system-extra/govee/govee-scene-sync.js tests/govee-status-led-binding.test.mjs scripts/repair-govee-status-led-binding.mjs .github/workflows/repair-govee-status-led-binding.yml
          git commit -m "Bind Govee runtime state to existing status LED"
          git push
