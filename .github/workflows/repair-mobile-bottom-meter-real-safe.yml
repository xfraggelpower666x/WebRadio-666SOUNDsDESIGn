name: Repair mobile bottom meter real safe

on:
  push:
    branches:
      - repair/mobile-bottom-meter-real-safe-20260804
    paths:
      - scripts/repair-mobile-bottom-meter-real-safe.mjs
      - .github/workflows/repair-mobile-bottom-meter-real-safe.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/mobile-bottom-meter-real-safe-20260804
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/repair-mobile-bottom-meter-real-safe.mjs
      - run: node --test tests/mobile-bottom-meter-real-safe.test.mjs
      - run: node --check js/phase10-stability-iphone-panel-hud.js
      - run: |
          rm scripts/repair-mobile-bottom-meter-real-safe.mjs
          rm .github/workflows/repair-mobile-bottom-meter-real-safe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/phase10-stability-iphone-panel-hud.js public/js/phase10-stability-iphone-panel-hud.js css/phase10-stability-iphone-panel-hud.css public/css/phase10-stability-iphone-panel-hud.css tests/mobile-bottom-meter-real-safe.test.mjs scripts/repair-mobile-bottom-meter-real-safe.mjs .github/workflows/repair-mobile-bottom-meter-real-safe.yml
          git commit -m "Drive mobile bottom meter from real signal"
          git push
# trigger-after-registration
