name: Repair mobile history single binding

on:
  push:
    branches:
      - repair/mobile-history-single-bind-20260804
    paths:
      - scripts/repair-mobile-history-single-bind.mjs
      - .github/workflows/repair-mobile-history-single-bind.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/mobile-history-single-bind-20260804
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/repair-mobile-history-single-bind.mjs
      - run: node --test tests/mobile-history-single-bind.test.mjs
      - run: |
          rm scripts/repair-mobile-history-single-bind.mjs
          rm .github/workflows/repair-mobile-history-single-bind.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html public/index.html tests/mobile-history-single-bind.test.mjs scripts/repair-mobile-history-single-bind.mjs .github/workflows/repair-mobile-history-single-bind.yml
          git commit -m "Repair mobile history single binding"
          git push
