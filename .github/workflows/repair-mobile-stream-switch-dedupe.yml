name: Repair mobile stream-switch dedupe

on:
  push:
    branches:
      - repair/mobile-stream-switch-dedupe-20260804
    paths:
      - scripts/repair-mobile-stream-switch-dedupe.mjs
      - .github/workflows/repair-mobile-stream-switch-dedupe.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/mobile-stream-switch-dedupe-20260804
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/repair-mobile-stream-switch-dedupe.mjs
      - run: node --test tests/mobile-stream-switch-dedupe.test.mjs
      - run: |
          rm scripts/repair-mobile-stream-switch-dedupe.mjs
          rm .github/workflows/repair-mobile-stream-switch-dedupe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html public/index.html tests/mobile-stream-switch-dedupe.test.mjs scripts/repair-mobile-stream-switch-dedupe.mjs .github/workflows/repair-mobile-stream-switch-dedupe.yml
          git commit -m "Repair mobile stream-switch double-trigger"
          git push
