name: Repair Native Mute Ticker
on:
  push:
    branches: [repair/native-mute-ticker-all-players-20260817]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/native-mute-ticker-all-players-20260817
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair Internal existing bootstrap owners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old='/config/veluna-assets.js?v=2026-07-09-veluna-v1212'
          new='/config/veluna-assets.js?v=2026-08-17-native-mute-ticker-v185'
          owners=['worker.js','workers/webradio-666soundsdesign-worker/worker.js']
          for rel in owners:
              p=Path(rel)
              s=p.read_text()
              if old in s:
                  s=s.replace(old,new)
                  p.write_text(s)
              assert new in p.read_text(), rel
              assert old not in p.read_text(), rel
          print('INTERNAL OWNER CACHE REPAIR PASS')
          PY
      - name: Verify full repository
        run: npm ci && npm run verify
      - name: Commit direct Internal repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker.js workers/webradio-666soundsdesign-worker/worker.js
          if git diff --cached --quiet; then echo 'No Internal owner change needed'; exit 0; fi
          git commit -m 'Align Internal bootstrap with native mute ticker repair'
          git push origin HEAD:repair/native-mute-ticker-all-players-20260817
