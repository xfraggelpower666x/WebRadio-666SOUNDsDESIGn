name: Repair Native Mute Ticker
on:
  push:
    branches: [repair/native-mute-ticker-all-players-20260817]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/native-mute-ticker-all-players-20260817
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair existing ticker and cache identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old_v='2026-08-16-all-player-mute-v184'
          new_v='2026-08-17-native-mute-ticker-v185'
          for rel in ['css/player-stage-v2.css','public/css/player-stage-v2.css']:
              p=Path(rel); s=p.read_text()
              old='animation:tickerMove 14s linear infinite!important;'
              assert old in s, rel
              s=s.replace(old,'animation:s666TitleMarquee 14s linear infinite!important;')
              s=s.replace('grid-template-columns:repeat(7,minmax(0,1fr))!important','grid-template-columns:repeat(8,minmax(0,1fr))!important')
              p.write_text(s)
          for rel in ['config/veluna-assets.js','public/config/veluna-assets.js']:
              p=Path(rel); s=p.read_text(); assert old_v in s, rel; p.write_text(s.replace(old_v,new_v))
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              s=p.read_text(errors='ignore')
              t=s.replace(old_v,new_v)
              if t!=s: p.write_text(t)
          for rel in ['tests/frontend-contracts.test.mjs','tests/pc-layout-ticker-meter-regression.test.mjs']:
              p=Path(rel); s=p.read_text()
              s=s.replace('animation:tickerMove 14s linear infinite!important','animation:s666TitleMarquee 14s linear infinite!important')
              s=s.replace('animation:tickerMove 14s linear infinite','animation:s666TitleMarquee 14s linear infinite')
              p.write_text(s)
          PY
          cat > tests/native-mute-ticker-hosts.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const read = p => fs.readFileSync(p,'utf8');
          test('mute stays inside real player controls and preserves audio volume',()=>{
            const a=read('js/all-player-mute.js'), b=read('public/js/all-player-mute.js');
            assert.equal(a,b);
            assert.match(a,/#mffApp \.mff-controls/);
            assert.match(a,/\.player-shell \.bottom-console \.control-toolbar/);
            assert.match(a,/getElementById\('muteBtn'\)/);
            assert.match(a,/button\.parentElement !== host/);
            assert.match(a,/audio\.muted = !audio\.muted/);
            assert.doesNotMatch(a,/audio\.volume\s*=/);
          });
          test('main now-playing ticker uses existing real keyframes',()=>{
            const a=read('css/player-stage-v2.css'), b=read('public/css/player-stage-v2.css');
            assert.equal(a,b);
            assert.match(a,/@keyframes s666TitleMarquee/);
            assert.match(a,/animation:s666TitleMarquee 14s linear infinite!important/);
            assert.doesNotMatch(a,/animation:tickerMove 14s linear infinite!important/);
            assert.match(a,/#mffApp \.mff-controls\{[^}]*grid-template-columns:repeat\(8,minmax\(0,1fr\)\)!important/);
          });
          test('VELUNA retains its native in-player mute and marquee',()=>{
            const v=read('VELUNA/index.html');
            assert.match(v,/id="muteBtn" class="small-btn"/);
            assert.match(v,/muteBtn\.addEventListener\('click'/);
            assert.match(v,/@keyframes velunaTicker/);
            assert.match(v,/marquee-track\.is-running\{animation:velunaTicker/);
          });
          EOF
      - name: Verify full repository
        run: npm ci && npm run verify
      - name: Commit direct repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git reset .github/workflows/repair-native-mute-ticker.yml
          git commit -m 'Repair native mute placement and now playing ticker'
          git push origin HEAD:repair/native-mute-ticker-all-players-20260817
