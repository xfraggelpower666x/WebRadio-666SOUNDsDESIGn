name: Repair PC side meter no fake motion

on:
  push:
    branches:
      - repair/pc-side-meter-no-fake-motion-20260804
    paths:
      - scripts/repair-pc-side-meter-no-fake-motion.mjs
      - .github/workflows/repair-pc-side-meter-no-fake-motion.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/pc-side-meter-no-fake-motion-20260804
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/repair-pc-side-meter-no-fake-motion.mjs
      - run: node --test tests/pc-side-meter-no-fake-motion.test.mjs
      - run: node --check js/phase10-stability-iphone-panel-hud.js
      - run: |
          rm scripts/repair-pc-side-meter-no-fake-motion.mjs
          rm .github/workflows/repair-pc-side-meter-no-fake-motion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/phase10-stability-iphone-panel-hud.js public/js/phase10-stability-iphone-panel-hud.js tests/pc-side-meter-no-fake-motion.test.mjs scripts/repair-pc-side-meter-no-fake-motion.mjs .github/workflows/repair-pc-side-meter-no-fake-motion.yml
          git commit -m "Remove synthetic PC side-meter motion"
          git push
