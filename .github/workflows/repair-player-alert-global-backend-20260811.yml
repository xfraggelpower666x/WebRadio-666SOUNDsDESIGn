name: Repair Player Alert Global Backend 20260811

on:
  push:
    branches:
      - repair/player-alert-backend-global-messenger-20260811

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/player-alert-backend-global-messenger-20260811
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted repair
        run: node scripts/repair-player-alert-global-backend-20260811.mjs
      - name: Commit repaired files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No repair delta pending."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js workers/webradio-666soundsdesign-worker/worker.js \
            js/messenger-overlay.js public/js/messenger-overlay.js \
            VELUNA/index.html veluna/index.html public/VELUNA/index.html public/veluna/index.html
          git commit -m "Repair global Player Alert backend and VELUNA messaging"
          git push origin HEAD:repair/player-alert-backend-global-messenger-20260811
