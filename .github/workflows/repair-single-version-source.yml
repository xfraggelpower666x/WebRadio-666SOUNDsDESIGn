name: Repair single version source

on:
  push:
    branches:
      - repair/single-version-source-20260804
    paths:
      - scripts/repair-single-version-source.mjs
      - .github/workflows/repair-single-version-source.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/single-version-source-20260804
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/repair-single-version-source.mjs
      - run: node --test tests/single-version-source.test.mjs
      - run: |
          rm scripts/repair-single-version-source.mjs
          rm .github/workflows/repair-single-version-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html public/index.html tests/single-version-source.test.mjs scripts/repair-single-version-source.mjs .github/workflows/repair-single-version-source.yml
          git commit -m "Repair single visible player version source"
          git push
