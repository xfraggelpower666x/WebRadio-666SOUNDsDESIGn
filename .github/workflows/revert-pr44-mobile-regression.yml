name: Revert PR44 Mobile Regression

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn

permissions:
  contents: write

jobs:
  revert-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rollback-pr44-mobile-regression-20260722
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Revert merged PR 44 exactly
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git revert -m 1 --no-edit 82b8d95d4097de46a3c48d112d75d7c473faba47
      - name: Verify restored repository
        run: npm run verify
      - name: Python syntax audit without bytecode
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('.').rglob('*.py'):
              if any(part in {'.git','node_modules','.venv','venv'} for part in path.parts):
                  continue
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print('Python syntax PASS')
          PY
      - name: Remove temporary files and publish revert
        run: |
          rm -f .github/workflows/revert-pr44-mobile-regression.yml
          rm -f docs/ROLLBACK_PR44_MOBILE_REGRESSION.md
          rm -f ROLLBACK_TRIGGER_PR44.txt
          rm -f docs/ROLLBACK_TRIGGER_PR44_REMOVE_ME.txt
          rm -f docs/ROLLBACK_READY_PR44.txt
          git add -A
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:rollback-pr44-mobile-regression-20260722
