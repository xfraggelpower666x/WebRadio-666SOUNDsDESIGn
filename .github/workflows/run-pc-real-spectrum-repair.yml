name: Run PC Real Spectrum Repair

on:
  push:
    branches:
      - repair-pc-eq-real-spectrum-layout-20260723

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-pc-eq-real-spectrum-layout-20260723
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Execute stored repair block
        shell: python
        run: |
          from pathlib import Path
          source = Path('.github/workflows/finalize-pc-real-spectrum-layout.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Repair real spectrum, meters and PC proportions\n        shell: python\n        run: |\n'
          end_marker = '      - name: JavaScript syntax\n'
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, 'stored-pc-real-spectrum-repair.py', 'exec'), {'__name__':'__main__'})
      - name: JavaScript syntax
        run: |
          node --check js/equalizer.js
          node --check js/player-core.js
      - name: Targeted real-spectrum contract
        run: node --test tests/pc-real-spectrum-layout.test.mjs tests/frontend-contracts.test.mjs
      - name: Full repository verification
        run: npm run verify
      - name: Python syntax audit without bytecode
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('.').rglob('*.py'):
              if any(part in {'.git','node_modules','.venv','venv'} for part in path.parts):
                  continue
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print('Python syntax PASS')
          PY
      - name: Publish clean repaired state
        run: |
          rm -f .github/workflows/finalize-pc-real-spectrum-layout.yml
          rm -f docs/PC_REAL_SPECTRUM_TRIGGER.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Repair PC real spectrum and player proportions"
          git push origin HEAD:repair-pc-eq-real-spectrum-layout-20260723
