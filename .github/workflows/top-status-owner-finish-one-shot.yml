name: Top Status Owner Finish One Shot
on:
  push:
    branches: [repair/top-status-phase10-visibility-20260903]
    paths: [.github/workflows/top-status-owner-finish-one-shot.yml]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/top-status-phase10-visibility-20260903
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch Phase10 owner and cache identity
        shell: python
        run: |
          from pathlib import Path
          block = '          var mainBtn = qs("#mainBtn");\n          var fbBtn = qs("#fallbackBtn") || qs("#backupBtn");\n          if(mainBtn) mainBtn.classList.add("is-active");\n          if(fbBtn) fbBtn.classList.remove("is-active");\n'
          for name in ['js/phase10-stability-iphone-panel-hud.js','public/js/phase10-stability-iphone-panel-hud.js']:
              p=Path(name); t=p.read_text(encoding='utf-8')
              if t.count(block)!=1: raise SystemExit(name+' direct writer count='+str(t.count(block)))
              p.write_text(t.replace(block,''),encoding='utf-8')
          for name in ['index.html','public/index.html']:
              p=Path(name); t=p.read_text(encoding='utf-8')
              oldcss='/css/phase10-stability-iphone-panel-hud.css?v=2026-06-15-fix1'
              oldjs='/js/phase10-stability-iphone-panel-hud.js?v=2026-07-12-veluna16'
              if t.count(oldcss)!=1 or t.count(oldjs)!=1: raise SystemExit(name+' cache identity mismatch')
              t=t.replace(oldcss,'/css/phase10-stability-iphone-panel-hud.css?v=2026-09-03-top-panel-owner-v1')
              t=t.replace(oldjs,'/js/phase10-stability-iphone-panel-hud.js?v=2026-09-03-top-panel-owner-v1')
              p.write_text(t,encoding='utf-8')
          Path('tests/top-system-panel-visibility-runtime.test.mjs').write_text("""import test from 'node:test';
import assert from 'node:assert/strict';
import fs from 'node:fs';
const css=fs.readFileSync('css/phase10-stability-iphone-panel-hud.css','utf8');
const cssPublic=fs.readFileSync('public/css/phase10-stability-iphone-panel-hud.css','utf8');
const phase10=fs.readFileSync('js/phase10-stability-iphone-panel-hud.js','utf8');
const phase10Public=fs.readFileSync('public/js/phase10-stability-iphone-panel-hud.js','utf8');
const html=fs.readFileSync('index.html','utf8');
const htmlPublic=fs.readFileSync('public/index.html','utf8');
test('top panel ownership survives Phase10 boot',()=>{
  assert.equal(cssPublic,css); assert.equal(phase10Public,phase10); assert.equal(htmlPublic,html);
  assert.ok(!css.includes('.systempanel-left #statusStream,.systempanel-left #statusMeter,.systempanel-left #statusSource{display:none!important}'));
  for(const id of ['statusStream','statusSource','statusMeter']) assert.ok(html.includes('id=\"'+id+'\"'));
  assert.ok(!phase10.includes('mainBtn.classList.add(\"is-active\")'));
  assert.ok(!phase10.includes('fbBtn.classList.remove(\"is-active\")'));
  assert.ok(html.includes('phase10-stability-iphone-panel-hud.css?v=2026-09-03-top-panel-owner-v1'));
  assert.ok(html.includes('phase10-stability-iphone-panel-hud.js?v=2026-09-03-top-panel-owner-v1'));
});
""",encoding='utf-8')
      - run: node --test tests/top-system-panel-visibility-runtime.test.mjs
      - run: npm run verify
      - name: Commit verified final top-panel repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/phase10-stability-iphone-panel-hud.js public/js/phase10-stability-iphone-panel-hud.js index.html public/index.html tests/top-system-panel-visibility-runtime.test.mjs
          git commit -m "Stabilize final top panel owner"
          git push origin HEAD:repair/top-status-phase10-visibility-20260903
