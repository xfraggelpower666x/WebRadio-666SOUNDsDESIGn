name: Top Status Phase10 Visibility One Shot

on:
  push:
    branches:
      - repair/top-status-phase10-visibility-20260903
    paths:
      - .github/workflows/top-status-phase10-visibility-one-shot.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/top-status-phase10-visibility-20260903
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repair final top-panel ownership
        shell: python
        run: |
          from pathlib import Path

          hide = ".systempanel-left #statusStream,.systempanel-left #statusMeter,.systempanel-left #statusSource{display:none!important}"
          for name in ["css/phase10-stability-iphone-panel-hud.css", "public/css/phase10-stability-iphone-panel-hud.css"]:
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              text = text.replace(hide, "")
              if hide in text:
                  raise SystemExit(f"{name}: stale hide hardlock remains")
              p.write_text(text, encoding="utf-8")

          direct_writer = '''          var mainBtn = qs("#mainBtn");
          var fbBtn = qs("#fallbackBtn") || qs("#backupBtn");
          if(mainBtn) mainBtn.classList.add("is-active");
          if(fbBtn) fbBtn.classList.remove("is-active");
'''
          for name in ["js/phase10-stability-iphone-panel-hud.js", "public/js/phase10-stability-iphone-panel-hud.js"]:
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              if text.count(direct_writer) != 1:
                  raise SystemExit(f"{name}: expected exactly one legacy H/B direct writer, found {text.count(direct_writer)}")
              text = text.replace(direct_writer, "")
              if 'mainBtn.classList.add("is-active")' in text or 'fbBtn.classList.remove("is-active")' in text:
                  raise SystemExit(f"{name}: legacy H/B direct writer remains")
              p.write_text(text, encoding="utf-8")

          for name in ["index.html", "public/index.html"]:
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              old_css = "/css/phase10-stability-iphone-panel-hud.css?v=2026-06-15-fix1"
              new_css = "/css/phase10-stability-iphone-panel-hud.css?v=2026-09-03-top-panel-owner-v1"
              old_js = "/js/phase10-stability-iphone-panel-hud.js?v=2026-07-12-veluna16"
              new_js = "/js/phase10-stability-iphone-panel-hud.js?v=2026-09-03-top-panel-owner-v1"
              if text.count(old_css) != 1 or text.count(old_js) != 1:
                  raise SystemExit(f"{name}: expected old Phase10 cache identities not found exactly once")
              text = text.replace(old_css, new_css).replace(old_js, new_js)
              p.write_text(text, encoding="utf-8")

          test_path = Path("tests/top-system-panel-visibility-runtime.test.mjs")
          test_path.write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const css = fs.readFileSync('css/phase10-stability-iphone-panel-hud.css','utf8');
          const cssPublic = fs.readFileSync('public/css/phase10-stability-iphone-panel-hud.css','utf8');
          const phase10 = fs.readFileSync('js/phase10-stability-iphone-panel-hud.js','utf8');
          const phase10Public = fs.readFileSync('public/js/phase10-stability-iphone-panel-hud.js','utf8');
          const html = fs.readFileSync('index.html','utf8');
          const htmlPublic = fs.readFileSync('public/index.html','utf8');

          test('top system panel keeps STR SRC and MTR visible after Phase10 boot',()=>{
            assert.equal(cssPublic, css);
            assert.equal(phase10Public, phase10);
            assert.equal(htmlPublic, html);
            assert.doesNotMatch(css,/\.systempanel-left #statusStream,.systempanel-left #statusMeter,.systempanel-left #statusSource\{display:none!important\}/);
            for (const id of ['statusStream','statusSource','statusMeter']) assert.match(html,new RegExp(`id=["']${id}["']`));
          });

          test('Phase10 no longer owns H/B visual active state',()=>{
            assert.doesNotMatch(phase10,/mainBtn\.classList\.add\("is-active"\)/);
            assert.doesNotMatch(phase10,/fbBtn\.classList\.remove\("is-active"\)/);
            assert.match(html,/id="mainBtn"[\s\S]*?<span class="status-code">H<\/span>/);
            assert.match(html,/id="fallbackBtn"[\s\S]*?<span class="status-code">B<\/span>/);
          });

          test('Phase10 top-panel repair has a fresh cache identity',()=>{
            assert.match(html,/phase10-stability-iphone-panel-hud\.css\?v=2026-09-03-top-panel-owner-v1/);
            assert.match(html,/phase10-stability-iphone-panel-hud\.js\?v=2026-09-03-top-panel-owner-v1/);
            assert.doesNotMatch(html,/phase10-stability-iphone-panel-hud\.css\?v=2026-06-15-fix1/);
            assert.doesNotMatch(html,/phase10-stability-iphone-panel-hud\.js\?v=2026-07-12-veluna16/);
          });
          ''', encoding="utf-8")
      - name: Verify focused top-panel contract
        run: node --test tests/top-system-panel-visibility-runtime.test.mjs
      - name: Full repository verify
        run: npm run verify
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/phase10-stability-iphone-panel-hud.css public/css/phase10-stability-iphone-panel-hud.css js/phase10-stability-iphone-panel-hud.js public/js/phase10-stability-iphone-panel-hud.js index.html public/index.html tests/top-system-panel-visibility-runtime.test.mjs
          git diff --cached --quiet && { echo "No expected delta produced"; exit 1; }
          git commit -m "Own top system panel after Phase10 boot"
          git push origin HEAD:repair/top-status-phase10-visibility-20260903
