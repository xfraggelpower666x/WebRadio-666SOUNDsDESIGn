name: Apply Verified Global Touch Feedback v1

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - ".github/workflows/verify-global-touch-feedback-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-verified:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-global-touch-feedback-v1-20260719
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply verified transformation
        run: python .github/one-time/apply_global_touch_feedback_v1.py
      - name: Verify complete release
        run: |
          npm ci
          npm run verify
      - name: Commit verified productive files
        shell: bash
        run: |
          git config user.name "666SOUNDsDESIGn Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            js/veluna-ui.js public/js/veluna-ui.js \
            css/veluna-theme.css public/css/veluna-theme.css \
            js/player-stage-v2.js public/js/player-stage-v2.js \
            css/player-stage-v2.css public/css/player-stage-v2.css \
            veluna/index.html VELUNA/index.html public/veluna/index.html public/VELUNA/index.html \
            index.html public/index.html \
            worker.js workers/webradio-666soundsdesign-worker/worker.js \
            tests/frontend-contracts.test.mjs tests/worker-smoke.test.mjs
          git commit -m "repair: strengthen touch feedback across all players"
          git push origin HEAD:repair-global-touch-feedback-v1-20260719
