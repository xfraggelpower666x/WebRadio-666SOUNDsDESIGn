name: Apply Verified Internal Action Parity v1

on:
  pull_request:
    branches:
      - WebRadio-666SOUNDsDESIGn
    paths:
      - ".github/workflows/verify-internal-action-parity-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-verified:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-internal-action-parity-v1-20260719
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply verified Internal transformation
        run: python .github/one-time/apply_internal_action_parity_v1.py
      - name: Verify complete release
        run: |
          npm ci
          npm run verify
      - name: Commit verified productive files
        shell: bash
        run: |
          git config user.name "666SOUNDsDESIGn Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            worker.js \
            workers/webradio-666soundsdesign-worker/worker.js \
            tests/worker-smoke.test.mjs
          git commit -m "repair: add shared actions to Internal player"
          git push origin HEAD:repair-internal-action-parity-v1-20260719
