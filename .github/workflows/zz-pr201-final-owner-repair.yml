name: PR201 Final Owner Repair

on:
  push:
    branches:
      - repair/audio-interruption-owner-collision-20260901

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/audio-interruption-owner-collision-20260901
          fetch-depth: 0
      - name: Close remaining Phase10 recovery-owner windows
        shell: python
        run: |
          from pathlib import Path

          audio_path = Path('js/audio-start-core.js')
          audio = audio_path.read_text(encoding='utf-8')
          anchor = "      global.__phase10PcMainBackupGuardInstalled = true;\n      document.documentElement?.setAttribute('data-audio-early-recovery-authority', CANONICAL_OWNER);"
          replacement = "      global.__phase10PcMainBackupGuardInstalled = true;\n      global.__phase10PcDirectfixAutoResetDemoted = true;\n      const healingOrchestra = global.S666_AUDIO_HEALING_ORCHESTRA = global.S666_AUDIO_HEALING_ORCHESTRA || {};\n      healingOrchestra.owner = CANONICAL_OWNER;\n      healingOrchestra.active = true;\n      healingOrchestra.lastRecoveryAt = Infinity;\n      document.documentElement?.setAttribute('data-audio-early-recovery-authority', CANONICAL_OWNER);"
          if anchor not in audio:
              raise SystemExit('audio-start-core authority anchor missing')
          audio = audio.replace(anchor, replacement, 1)
          audio_path.write_text(audio, encoding='utf-8')
          Path('public/js/audio-start-core.js').write_text(audio, encoding='utf-8')

          phase_path = Path('js/phase10-stability-iphone-panel-hud.js')
          phase = phase_path.read_text(encoding='utf-8')
          anchor = "  function directfixPcNoAutoFallback(){\n    if(!phase10IsDesktopPlayer || !phase10IsDesktopPlayer()) return;"
          replacement = "  function directfixPcNoAutoFallback(){\n    if(window.__phase10PcDirectfixAutoResetDemoted === true){\n      document.documentElement.setAttribute(\"data-phase10-pc-auto-fallback\",\"canonical-owner-only\");\n      return;\n    }\n    if(!phase10IsDesktopPlayer || !phase10IsDesktopPlayer()) return;"
          if anchor not in phase:
              raise SystemExit('phase10 directfix anchor missing')
          phase = phase.replace(anchor, replacement, 1)
          phase_path.write_text(phase, encoding='utf-8')
          Path('public/js/phase10-stability-iphone-panel-hud.js').write_text(phase, encoding='utf-8')

          test_path = Path('tests/audio-interruption-owner-collision.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          addition = """

test('early authority permanently cooldown-blocks the lexical Phase10 healing orchestra before canonical recovery loads', () => {
  assert.match(audioStart, /global\.S666_AUDIO_HEALING_ORCHESTRA = global\.S666_AUDIO_HEALING_ORCHESTRA \|\| \{\}/);
  assert.match(audioStart, /healingOrchestra\.owner = CANONICAL_OWNER/);
  assert.match(audioStart, /healingOrchestra\.lastRecoveryAt = Infinity/);
});

test('Phase10 boot-time directfix cannot hard-reset backup while canonical recovery authority is seeded', () => {
  assert.match(audioStart, /global\.__phase10PcDirectfixAutoResetDemoted = true/);
  const directfix = phase10.match(/function directfixPcNoAutoFallback\(\)\{([\s\S]*?)\n  \}/)?.[1] || '';
  assert.match(directfix, /__phase10PcDirectfixAutoResetDemoted === true/);
  assert.match(directfix, /canonical-owner-only/);
  const demotionIndex = directfix.indexOf('__phase10PcDirectfixAutoResetDemoted === true');
  const pauseIndex = directfix.indexOf('audio.pause()');
  assert.ok(demotionIndex >= 0 && pauseIndex > demotionIndex, 'canonical demotion must guard the legacy hard reset');
});

test('Phase10 root/public mirror remains byte-identical after owner collision repair', () => {
  assert.equal(fs.readFileSync('public/js/phase10-stability-iphone-panel-hud.js', 'utf8'), phase10);
});
"""
          if "early authority permanently cooldown-blocks" not in test:
              test_path.write_text(test + addition, encoding='utf-8')
      - name: Remove transient workflow and commit repair
        shell: bash
        run: |
          git rm .github/workflows/zz-pr201-final-owner-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/audio-start-core.js public/js/audio-start-core.js js/phase10-stability-iphone-panel-hud.js public/js/phase10-stability-iphone-panel-hud.js tests/audio-interruption-owner-collision.test.mjs
          git commit -m "repair: close remaining Phase10 recovery owner windows"
          git push origin HEAD:repair/audio-interruption-owner-collision-20260901
