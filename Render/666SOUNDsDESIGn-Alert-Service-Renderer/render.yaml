services:
  - type: web
    name: auto-setup-render-for-backend-mp3
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PLAYER_ALERT_SERVICE_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PLAYER_ALERT_DB_PATH
        value: ./data/player-alerts.sqlite3
      - key: PLAYER_ALERT_TTL_SECONDS
        value: "900"
      - key: PLAYER_ALERT_MAX_HISTORY
        value: "30"
      - key: PLAYER_ALERT_RATE_SECONDS
        value: "180"
      - key: MAX_UPLOAD_MB
        value: "64"
      - key: FFMPEG_TIMEOUT_SECONDS
        value: "180"
