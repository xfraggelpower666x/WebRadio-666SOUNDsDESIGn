<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>666 Upload</title>

  <style>
    body {
      background: #0a0a0a;
      color: #00ffcc;
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      border: 2px solid #00ffcc;
      padding: 30px;
      border-radius: 10px;
      width: 400px;
      text-align: center;
    }

    input, button {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      background: black;
      color: #00ffcc;
      border: 1px solid #00ffcc;
    }

    button:hover {
      background: #00ffcc;
      color: black;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      font-size: 12px;
      color: white;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>🎧 MP3 Upload</h2>

  <input type="file" id="file" />
  <input type="password" id="password" placeholder="Admin Passwort" />

  <button onclick="upload()">UPLOAD</button>

  <div id="result"></div>
</div>

<script>
async function upload() {
  const file = document.getElementById("file").files[0];
  const password = document.getElementById("password").value;

  if (!file) {
    alert("Datei fehlt");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  const res = await fetch("/transcribe", {
    method: "POST",
    headers: {
      "x-admin-password": password
    },
    body: formData
  });

  const data = await res.json();

  document.getElementById("result").innerText =
    JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
