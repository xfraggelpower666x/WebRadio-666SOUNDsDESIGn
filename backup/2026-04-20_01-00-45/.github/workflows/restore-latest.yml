# ==========================================
# 666SOUNDsDESIGn — RESTORE LATEST BACKUP
# ==========================================
#
# TYPE:        GitHub Actions Workflow
# PURPOSE:     Stellt den Hauptbranch aus backup/latest
#              des Backup-Branches 666BackupMirror wieder her
# SCOPE:       Gleiches Repository
#
# VERSION:     v1.0
# CREATED:     2026-04-16
# UPDATED:     2026-04-16
#
# NOTES:
# - Start per GitHub UI oder workflow_dispatch API
# - Restore-Ziel: WebRadio-666SOUNDsDESIGn
# - Quelle: 666BackupMirror -> backup/latest
#
# ==========================================

name: Restore Latest Backup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      # Hauptrepo vollständig holen
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Git-Identität für Restore-Commit
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      # Backup-Branch holen
      - name: Fetch backup branch
        run: |
          git fetch origin 666BackupMirror:666BackupMirror

      # backup/latest aus dem Backup-Branch exportieren
      - name: Export latest backup
        run: |
          rm -rf /tmp/restore-latest
          mkdir -p /tmp/restore-latest
          git archive --format=tar 666BackupMirror:backup/latest | tar -xf - -C /tmp/restore-latest

      # Hauptbranch auschecken
      - name: Checkout target branch
        run: |
          git checkout WebRadio-666SOUNDsDESIGn
          git pull origin WebRadio-666SOUNDsDESIGn

      # Arbeitsbaum leeren, aber .git behalten
      - name: Clean working tree
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

      # Restore-Inhalt zurückkopieren
      - name: Restore latest backup
        run: |
          cp -R /tmp/restore-latest/. .

      # Commit + Push nur wenn Änderungen existieren
      - name: Commit and push restore
        run: |
          git add .

          if git diff --cached --quiet; then
            echo "No restore changes detected."
            exit 0
          fi

          git commit -m "Restore latest backup"
          git push origin WebRadio-666SOUNDsDESIGn
