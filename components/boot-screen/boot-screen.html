<main class="s666boot-scene" id="s666CentralBoot" aria-labelledby="s666boot-title" data-state="booting">
  <div class="s666boot-scanlines" aria-hidden="true"></div>
  <section class="s666boot-panel" aria-live="polite">
    <p class="s666boot-eyebrow">666SOUNDsDESIGn RADIO SYSTEM</p>
    <h1 id="s666boot-title">CYBER BOOTING</h1>
    <p class="s666boot-status" id="s666boot-status">INITIALIZING PLAYER</p>
    <div class="s666boot-core" aria-hidden="true"></div>
    <div class="s666boot-progress-wrap" aria-label="Player boot progress">
      <div class="s666boot-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="s666boot-track">
        <div class="s666boot-bar" id="s666boot-bar"></div>
      </div>
      <div class="s666boot-percent" id="s666boot-percent">0%</div>
    </div>
    <p class="s666boot-phase-label" id="s666boot-phase">CONNECTING RADIO CORE</p>
    <div class="s666boot-steps" aria-hidden="true">
      <div class="s666boot-step active" data-step="0">Connect</div>
      <div class="s666boot-step" data-step="1">Audio</div>
      <div class="s666boot-step" data-step="2">Systems</div>
      <div class="s666boot-step" data-step="3">Player</div>
    </div>
    <button class="s666boot-start" id="s666boot-start" type="button" hidden>START PLAYER</button>
  </section>
</main>
