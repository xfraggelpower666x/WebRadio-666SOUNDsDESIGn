<!DOCTYPE html>
<!--
==================================================
DATEI: index.html
ERSTELLT: 2026-04-20
GEÄNDERT: 2026-04-20
STATUS: MINIMAL ROOT PLAYER
ZWECK: Externer Hauptplayer im Repo-Root für iPhone und PC.
ÄNDERUNG: Minimalaufbau ohne Zusatzmechaniken. Nutzt nur /stream,
          /fallback-stream und /api/nowplaying über dieselbe Domain.
==================================================
-->
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>666SOUNDsDESIGn Radio — Extern</title>
  <meta name="theme-color" content="#11151d" />
  <link rel="preload" as="image" href="/assets/images/header-logo.png" />
  <link rel="stylesheet" href="/css/extern.css" />
</head>
<body>
  <main class="shell">
    <section class="player-card">
      <header class="player-head">
        <img class="logo" src="/assets/images/header-logo.png" alt="666SOUNDsDESIGn" />
        <div class="title-wrap">
          <div class="kicker">EXTERNAL MAIN PLAYER</div>
          <h1>666SOUNDsDESIGn Radio</h1>
          <p class="subtitle">Minimaler Root-Player · gleiche Domain · kein CORS</p>
        </div>
      </header>

      <section class="status-row" aria-label="Statusanzeigen">
        <div class="status-box"><span class="status-label">PLAYER</span><span id="playerMode">EXTERNAL</span></div>
        <div class="status-box"><span class="status-label">STREAM</span><span id="streamMode">MAIN</span></div>
        <div class="status-box"><span class="status-label">META</span><span id="metaMode">API</span></div>
      </section>

      <section class="meta-panel">
        <div class="meta-head">
          <span class="panel-label">Now Playing</span>
          <span id="connectionState" class="connection-pill">READY</span>
        </div>
        <div id="trackTitle" class="track-title">Warte auf Metadaten …</div>
        <div class="meta-grid">
          <div class="meta-box"><span class="mini-label">Listeners</span><strong id="listenersText">0 / 250</strong></div>
          <div class="meta-box"><span class="mini-label">Bitrate</span><strong id="bitrateText">--</strong></div>
          <div class="meta-box"><span class="mini-label">DJ / Status</span><strong id="djText">666SOUNDsDESIGn DJ</strong></div>
        </div>
      </section>

      <section class="visual-row" aria-label="Visualizer und Lautstärke">
        <div id="eqBars" class="eq-bars" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span>
        </div>
        <label class="volume-wrap">
          <span>Volume</span>
          <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="0.85" />
        </label>
      </section>

      <section class="control-row" aria-label="Player-Steuerung">
        <button id="playBtn" class="btn btn-main" type="button">Play</button>
        <button id="pauseBtn" class="btn" type="button">Pause</button>
        <button id="stopBtn" class="btn" type="button">Stop</button>
        <button id="reconnectBtn" class="btn" type="button">Reconnect</button>
      </section>

      <section class="source-row" aria-label="Quellwahl">
        <button id="mainBtn" class="btn btn-small is-active" type="button">MAIN</button>
        <button id="backBtn" class="btn btn-small" type="button">BACKUP</button>
        <button id="muteBtn" class="btn btn-small" type="button">Mute</button>
      </section>

      <p class="foot-note">Audio: <code>/stream</code> → <code>/fallback-stream</code> · Metadaten: <code>/api/nowplaying</code></p>
      <audio id="radio" preload="none" playsinline></audio>
    </section>
  </main>

  <script type="module" src="/js/extern.js"></script>
</body>
</html>
