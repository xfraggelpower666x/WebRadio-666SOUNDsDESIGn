<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>666SOUNDsDESIGn</title>
<style>
body{background:#111;color:#0ff;font-family:sans-serif;text-align:center;padding:20px}
.btn{padding:20px;background:#222;border:2px solid #0ff;color:#fff;border-radius:10px;font-size:20px}
.lamp{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.green{background:#0f0} .red{background:#f00}
</style>
</head>
<body>

<h1>666SOUNDsDESIGn</h1>

<div><span id="healthLamp" class="lamp red"></span>Health</div>
<div><span id="audioLamp" class="lamp red"></span>Audio</div>

<br>

<button class="btn" onclick="start()">PLAY</button>

<audio id="player" controls style="width:100%;margin-top:20px"></audio>

<script>
function start(){
  let audio = document.getElementById('player');
  audio.src = '/stream';
  audio.play();
  document.getElementById('audioLamp').className='lamp green';
}

fetch('/health').then(()=> {
  document.getElementById('healthLamp').className='lamp green';
}).catch(()=>{});
</script>

</body>
</html>
