<!-- MOBILE_FINAL_FORCE_ROOT_OVERRIDE_v1 -->
<script id="mobileFinalForceRootOverrideScript">
(function(){
  var VERSION = 'MOBILE_FINAL_FORCE_ROOT_OVERRIDE_v1';
  var STREAM_URL = '/stream';
  var boostStage = 0;
  var rafStarted = false;

  function isMobile(){
    return (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) || window.innerWidth <= 760;
  }

  function q(sel, root){ return (root || document).querySelector(sel); }
  function qa(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function getAudio(){
    var audio = q('#mffAudio') || q('audio');
    if(!audio){
      audio = document.createElement('audio');
      audio.id = 'mffAudio';
      audio.preload = 'none';
      audio.crossOrigin = 'anonymous';
      audio.playsInline = true;
      audio.style.display = 'none';
      document.body.appendChild(audio);
    }
    if(!audio.getAttribute('src')) audio.setAttribute('src', STREAM_URL);
    return audio;
  }

  function setPlaying(v){
    document.documentElement.setAttribute('data-mff-playing', v ? '1' : '0');
    var led = q('#mffLiveState');
    if(led) led.textContent = v ? 'LIVE' : 'READY';
  }

  function play(){
    var a = getAudio();
    try{
      if(!a.getAttribute('src')) a.setAttribute('src', STREAM_URL);
      var r = a.play();
      if(r && typeof r.catch === 'function') r.catch(function(err){ console.warn('[MFF play]', err); });
      setPlaying(true);
    }catch(e){ console.warn('[MFF play]', e); }
  }
  function pause(){
    try{ getAudio().pause(); }catch(e){}
    setPlaying(false);
  }
  function stop(){
    var a = getAudio();
    try{ a.pause(); try{ a.currentTime = 0; }catch(e){} }catch(e){}
    setPlaying(false);
  }
  function boost(d){
    boostStage = Math.max(0, Math.min(3, boostStage + d));
    try{ getAudio().volume = [0.86,0.94,1,1][boostStage]; }catch(e){}
    var b = q('#mffBoost');
    if(b) b.textContent = 'BST ' + boostStage;
    document.documentElement.setAttribute('data-mff-boost', String(boostStage));
  }

  function card(title, value, icon){
    return '<section class="mff-card"><div><span class="mff-ico">'+icon+'</span><small>'+title+'</small></div><strong>'+value+'</strong><p><i></i><i></i><i></i></p></section>';
  }

  function makeBars(id, count){
    var el = q(id);
    if(!el || el.children.length) return;
    for(var i=0;i<count;i++){
      var b = document.createElement('i');
      var h = 30 + ((i*37)%48);
      if(id === '#mffEqBars') b.style.setProperty('--h', h+'%');
      if(id === '#mffBottomBars'){
        b.className = i < (count/2) ? 'mff-bottom-left' : 'mff-bottom-right';
        var dist = Math.abs(i - ((count - 1) / 2));
        b.style.setProperty('--center-dist', dist.toFixed(2));
      }
      b.style.setProperty('--d', (i*13)+'ms');
      el.appendChild(b);
    }
  }

  function build(){
    var app = q('#mffApp');
    if(app) return app;

    app = document.createElement('div');
    app.id = 'mffApp';
    app.setAttribute('data-version', VERSION);
    app.innerHTML =
      '<div class="mff-side mff-left"><i></i></div>' +
      '<div class="mff-side mff-right"><i></i></div>' +
      '<main class="mff-shell">' +
        '<section class="mff-now">' +
          '<div class="mff-symbol"><span></span></div>' +
          '<div class="mff-title"><small>NOW PLAYING</small><h1>Metadaten werden geladen ...</h1><h2>Loading stream metadata ...</h2></div>' +
          '<button class="mff-history" type="button">↺ History</button>' +
        '</section>' +
        '<section class="mff-cards">' +
          card('LISTENERS','0 / 250','♚') +
          card('BITRATE','Unknown','≋') +
          card('DJ / STATUS','666SOUNDsDESIGn<br>DJ','◖') +
        '</section>' +
        '<section class="mff-eq"><header><span>EQ</span><b id="mffLiveState">READY</b></header><div id="mffEqBars" class="mff-eq-bars"></div><footer>20 BANDS</footer></section>' +
        '<section class="mff-controls">' +
          '<button type="button" data-mff="play" class="mff-play">▶</button>' +
          '<button type="button" data-mff="pause">Ⅱ</button>' +
          '<button type="button" data-mff="stop" class="mff-stop">■</button>' +
          '<button type="button" data-mff="reset">↺</button>' +
          '<button type="button" data-mff="down">−</button>' +
          '<button type="button" data-mff="boost" id="mffBoost">BST 0</button>' +
          '<button type="button" data-mff="up">+</button>' +
        '</section>' +
        '<section class="mff-bottom"><header><i></i><span>LEVEL METER</span><i></i></header><div id="mffBottomBars" class="mff-bottom-bars"></div><div class="mff-db mff-db-hidden" aria-hidden="true"></div><small class="mff-swipe-hidden" aria-hidden="true"></small></section>' +
      '</main>';

    // Direkt als erstes Element im Body, damit nichts darüber liegt.
    document.body.insertBefore(app, document.body.firstChild);

    makeBars('#mffEqBars', 20);
    makeBars('#mffBottomBars', 60);

    var controls = q('.mff-controls', app);
    var handler = function(ev){
      var btn = ev.target.closest && ev.target.closest('[data-mff]');
      if(!btn) return;
      ev.preventDefault();
      ev.stopPropagation();
      var c = btn.getAttribute('data-mff');
      if(c === 'play') play();
      if(c === 'pause') pause();
      if(c === 'stop') stop();
      if(c === 'reset') { stop(); setTimeout(play, 120); }
      if(c === 'down') boost(-1);
      if(c === 'up') boost(1);
      if(c === 'boost') boost(1);
    };
    controls.addEventListener('click', handler, {capture:true});
    controls.addEventListener('touchend', handler, {passive:false, capture:true});

    return app;
  }

  function hideEverythingExceptApp(){
    if(!document.body) return;
    qa('body > *').forEach(function(node){
      if(node.id === 'mffApp') return;
      if(node.tagName === 'SCRIPT' || node.tagName === 'STYLE' || node.tagName === 'LINK') return;
      if(node.id === 'mffAudio') return;
      node.setAttribute('data-mff-force-hidden','1');
    });

    // Speziell alle alten Player/Layer direkt erwischen.
    qa('header,main,.hero,.hero-image,.site-header,.main-header,.mobile-shell,.player-shell,.hud-panel,.panel,#mfmApp,#mobileControlsLayerReset,#mobileInlineTopControlsForce,#mobileTopControlsInBoostPanel,#mobileTransportRepair,.mobile-transport-repair,.mobile-dom-side-meter,.mobile-dom-bottom-guard').forEach(function(node){
      if(node.closest && node.closest('#mffApp')) return;
      node.setAttribute('data-mff-force-hidden','1');
    });
  }

  function animate(){
    var t = Date.now()/1000;
    var playing = document.documentElement.getAttribute('data-mff-playing') === '1';
    var base = playing ? 0.38 : 0.18;
    var level = base + (playing ? Math.abs(Math.sin(t*2.3))*0.42 : Math.abs(Math.sin(t*.8))*0.08);
    document.documentElement.style.setProperty('--mff-level', level.toFixed(3));
    requestAnimationFrame(animate);
  }

  function install(){
    if(!document.body) return;
    document.documentElement.setAttribute('data-mff-version', VERSION);
    document.body.setAttribute('data-mff-active', isMobile() ? '1' : '0');

    if(isMobile()){
      build();
      hideEverythingExceptApp();
      if(!rafStarted){ rafStarted = true; requestAnimationFrame(animate); }
    }
  }

  document.addEventListener('DOMContentLoaded', function(){
    install();
    setTimeout(install, 150);
    setTimeout(install, 600);
    setTimeout(install, 1500);
    setTimeout(install, 3000);
  });
  window.addEventListener('load', install, {passive:true});
  window.addEventListener('resize', install, {passive:true});
  window.addEventListener('orientationchange', install, {passive:true});
})();
</script>


<!-- MOBILE_FINAL_MATCH_POSITION_METER_FIX_v1 -->
<script id="mobileFinalMatchPositionMeterFixScript">
(function(){
  function apply(){
    if(!document.body) return;
    var mobile = (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) || window.innerWidth <= 760;
    document.body.setAttribute('data-mff-position-meter-fix', mobile ? 'v1' : 'desktop');

    var app = document.getElementById('mffApp');
    if(app) app.setAttribute('data-mff-position-meter-fix','v1');

    var shell = document.querySelector('#mffApp .mff-shell');
    if(shell) shell.setAttribute('data-mff-shell-position-fix','v1');

    var controls = document.querySelector('#mffApp .mff-controls');
    if(controls) controls.setAttribute('data-mff-controls-position-fix','v1');

    var bottom = document.querySelector('#mffApp .mff-bottom');
    if(bottom) bottom.setAttribute('data-mff-bottom-meter-fix','v1');

    var bottomBars = document.querySelector('#mffBottomBars');
    if(bottomBars){
      var bars = Array.prototype.slice.call(bottomBars.children);
      if(bars.length){
        bars.forEach(function(bar, idx){
          bar.classList.toggle('mff-bottom-left', idx < bars.length / 2);
          bar.classList.toggle('mff-bottom-right', idx >= bars.length / 2);
          bar.style.setProperty('--center-dist', Math.abs(idx - ((bars.length - 1) / 2)).toFixed(2));
        });
      }
    }
  }
  document.addEventListener('DOMContentLoaded', function(){
    apply(); setTimeout(apply,160); setTimeout(apply,700); setTimeout(apply,1600); setTimeout(apply,3200);
  });
  window.addEventListener('resize', apply, {passive:true});
  window.addEventListener('orientationchange', apply, {passive:true});
})();
</script>


<!-- MOBILE_FINAL_CLEAN_METERS_PANELS_v2 -->
<script id="mobileFinalCleanMetersPanelsScript">
(function(){
  function isMobile(){
    return (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) || window.innerWidth <= 760;
  }

  function apply(){
    if(!document.body) return;
    document.body.setAttribute('data-mff-clean-meters-panels', isMobile() ? 'v2' : 'desktop');
    if(!isMobile()) return;

    var app = document.getElementById('mffApp');
    if(app) app.setAttribute('data-mff-clean-meters-panels','v2');

    /* Alte/zweite Meter-Layer außerhalb des finalen Players hart markieren. */
    document.querySelectorAll(
      '.mobile-dom-bottom-guard,.mobile-dom-bottom-track,.mobile-dom-side-meter,' +
      '#mobileHudDomMeterRepair,.mobile-hud-dom-meter-repair,.mobile-dom-bottom-left,.mobile-dom-bottom-right,' +
      '[id*="Levelmeter"],[class*="gesture-guard"],[class*="bottom-guard"]'
    ).forEach(function(node){
      if(node.closest && node.closest('#mffApp')) return;
      node.setAttribute('data-mff-old-meter-remove','v2');
    });

    /* Alle alten Meter-ähnlichen Balken am unteren Rand markieren, außer dem finalen mff-bottom. */
    document.querySelectorAll('body > div, body > section, body > aside').forEach(function(node){
      if(node.id === 'mffApp') return;
      if(node.closest && node.closest('#mffApp')) return;
      var r = node.getBoundingClientRect ? node.getBoundingClientRect() : null;
      if(!r) return;
      var bottomish = r.top > window.innerHeight * 0.72;
      var wide = r.width > window.innerWidth * 0.55;
      if(bottomish && wide){
        var txt = (node.textContent || '').trim();
        var looksLikeOldMeter = !txt || /level|meter|swipe|bst|loading/i.test(txt);
        if(looksLikeOldMeter) node.setAttribute('data-mff-old-meter-remove','v2');
      }
    });

    /* Swipe-Text entfernen, falls aus alter Runtime noch vorhanden. */
    document.querySelectorAll('#mffApp .mff-bottom small, #mffApp .mff-swipe-hidden').forEach(function(node){
      node.textContent = '';
      node.setAttribute('aria-hidden','true');
    });

    var shell = document.querySelector('#mffApp .mff-shell');
    if(shell) shell.setAttribute('data-mff-panels-inside-meters','v2');

    var cards = document.querySelector('#mffApp .mff-cards');
    if(cards) cards.setAttribute('data-mff-cards-inside-meters','v2');

    var controls = document.querySelector('#mffApp .mff-controls');
    if(controls) controls.setAttribute('data-mff-controls-inside-meters','v2');

    var bottom = document.querySelector('#mffApp .mff-bottom');
    if(bottom) bottom.setAttribute('data-mff-single-bottom-meter','v2');
  }

  document.addEventListener('DOMContentLoaded', function(){
    apply(); setTimeout(apply,150); setTimeout(apply,700); setTimeout(apply,1600); setTimeout(apply,3200);
  });
  window.addEventListener('resize', apply, {passive:true});
  window.addEventListener('orientationchange', apply, {passive:true});
})();
</script>


<!-- MOBILE_FINAL_METER_BUTTON_STATE_FIX_v3 -->
<script id="mobileFinalMeterButtonStateFixScript">
(function(){
  var VERSION = 'MOBILE_FINAL_METER_BUTTON_STATE_FIX_v3';
  var transientTimer = null;

  function isMobile(){
    return (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) || window.innerWidth <= 760;
  }

  function q(sel, root){ return (root || document).querySelector(sel); }
  function qa(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function setTransportState(state){
    var app = q('#mffApp');
    if(!app) return;
    app.setAttribute('data-mff-transport-state', state);

    qa('#mffApp .mff-controls button').forEach(function(btn){
      btn.classList.remove('mff-active','mff-transient');
    });

    var selector = null;
    if(state === 'play') selector = '[data-mff="play"]';
    if(state === 'pause') selector = '[data-mff="pause"]';
    if(state === 'stop') selector = '[data-mff="stop"]';

    if(selector){
      var active = q('#mffApp .mff-controls ' + selector);
      if(active) active.classList.add('mff-active');
    }
  }

  function flashButton(cmd){
    var btn = q('#mffApp .mff-controls [data-mff="' + cmd + '"]');
    if(!btn) return;
    btn.classList.add('mff-transient');
    clearTimeout(transientTimer);
    transientTimer = setTimeout(function(){
      qa('#mffApp .mff-controls .mff-transient').forEach(function(n){
        n.classList.remove('mff-transient');
      });
    }, 1300);
  }

  function markOldBottomMeters(){
    /*
      Ziel: Der alte untere cyan/magenta Balken außerhalb #mffApp muss raus.
      Er kann je nach Vorversion unterschiedliche Klassen haben, daher:
      1. bekannte Klassen
      2. breite fixed/absolute Elemente im unteren Bereich außerhalb #mffApp
      3. Canvas/SVG/Div-Balken ohne Text unten
    */
    var known = [
      '.mobile-dom-bottom-guard',
      '.mobile-dom-bottom-track',
      '.mobile-dom-bottom-left',
      '.mobile-dom-bottom-right',
      '.bottom-levelmeter',
      '.bottom-meter',
      '.gesture-meter',
      '.gesture-guard',
      '.mobile-bottom-meter',
      '[class*="bottom"][class*="meter"]',
      '[class*="level"][class*="meter"]',
      '[class*="gesture"][class*="guard"]'
    ];

    known.forEach(function(sel){
      qa(sel).forEach(function(node){
        if(node.closest && node.closest('#mffApp')) return;
        node.setAttribute('data-mff-v3-remove-old-bottom-meter','1');
      });
    });

    qa('body *').forEach(function(node){
      if(node.closest && node.closest('#mffApp')) return;
      if(node.tagName === 'SCRIPT' || node.tagName === 'STYLE' || node.tagName === 'LINK') return;
      var r = node.getBoundingClientRect ? node.getBoundingClientRect() : null;
      if(!r) return;

      var cs = window.getComputedStyle ? window.getComputedStyle(node) : null;
      var pos = cs ? cs.position : '';
      var bottomArea = r.top > window.innerHeight * 0.78;
      var wide = r.width > window.innerWidth * 0.55;
      var lowHeight = r.height <= 80;
      var hasLittleText = ((node.textContent || '').trim().length < 20);
      var colorful = false;

      if(cs){
        var bg = (cs.background || '') + ' ' + (cs.backgroundImage || '') + ' ' + (cs.boxShadow || '');
        colorful = /rgb|linear-gradient|cyan|magenta|255,\s*0|0,\s*255|pink/i.test(bg);
      }

      if(bottomArea && wide && lowHeight && (hasLittleText || colorful || pos === 'fixed' || pos === 'absolute')){
        node.setAttribute('data-mff-v3-remove-old-bottom-meter','1');
      }
    });
  }

  function repairBottomMeter(){
    var app = q('#mffApp');
    var bottom = q('#mffApp .mff-bottom');
    var bars = qa('#mffBottomBars i');
    if(!app || !bottom || !bars.length) return;

    app.setAttribute('data-mff-meter-button-fix','v3');
    bottom.setAttribute('data-mff-bottom-segment-meter','v3');

    var mid = (bars.length - 1) / 2;
    bars.forEach(function(bar, idx){
      bar.classList.add('mff-segment-bar');
      bar.classList.toggle('mff-from-left', idx < bars.length / 2);
      bar.classList.toggle('mff-from-right', idx >= bars.length / 2);
      bar.style.setProperty('--mff-center-distance', Math.abs(idx - mid).toFixed(2));
      bar.style.setProperty('--mff-index', String(idx));
    });

    qa('#mffApp .mff-db, #mffApp .mff-bottom small, #mffApp .mff-swipe-hidden').forEach(function(node){
      node.setAttribute('aria-hidden','true');
      node.textContent = '';
      node.classList.add('mff-force-hidden-text');
    });
  }

  function bindControls(){
    var controls = q('#mffApp .mff-controls');
    if(!controls || controls.__mffV3Bound) return;
    controls.__mffV3Bound = true;

    var handler = function(ev){
      var btn = ev.target.closest && ev.target.closest('[data-mff]');
      if(!btn) return;
      var cmd = btn.getAttribute('data-mff');

      if(cmd === 'play') setTransportState('play');
      if(cmd === 'pause') setTransportState('pause');
      if(cmd === 'stop') setTransportState('stop');
      if(cmd === 'reset') {
        flashButton('reset');
        setTimeout(function(){ setTransportState('play'); }, 160);
      }
      if(cmd === 'up') flashButton('up');
      if(cmd === 'down') flashButton('down');
      if(cmd === 'boost') flashButton('boost');
    };

    controls.addEventListener('click', handler, {capture:true});
    controls.addEventListener('touchend', handler, {passive:true, capture:true});
  }

  function apply(){
    if(!document.body) return;
    document.body.setAttribute('data-mff-meter-button-state-fix', isMobile() ? 'v3' : 'desktop');
    if(!isMobile()) return;

    markOldBottomMeters();
    repairBottomMeter();
    bindControls();

    var app = q('#mffApp');
    if(app && !app.getAttribute('data-mff-transport-state')){
      app.setAttribute('data-mff-transport-state','stop');
      var stop = q('#mffApp .mff-controls [data-mff="stop"]');
      if(stop) stop.classList.add('mff-active');
    }
  }

  document.addEventListener('DOMContentLoaded', function(){
    apply();
    setTimeout(apply,150);
    setTimeout(apply,650);
    setTimeout(apply,1500);
    setTimeout(apply,3200);
  });
  window.addEventListener('load', apply, {passive:true});
  window.addEventListener('resize', apply, {passive:true});
  window.addEventListener('orientationchange', apply, {passive:true});
})();
</script>


<!-- MOBILE_FINAL_REMOVE_OLD_BOTTOM_AND_RESTORE_META_v4 -->
<script id="mobileFinalRemoveOldBottomAndRestoreMetaScript">
(function(){
  var VERSION = 'MOBILE_FINAL_REMOVE_OLD_BOTTOM_AND_RESTORE_META_v4';
  var metaTimer = null;

  function isMobile(){
    return (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) || window.innerWidth <= 760;
  }

  function q(sel, root){ return (root || document).querySelector(sel); }
  function qa(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function markOldBottomLayer(){
    if(!isMobile()) return;

    /*
      Der rot markierte Balken ist eine alte breite Bottom-Leiste außerhalb des finalen Players.
      Nicht verstecken:
      - #mffApp
      - .mff-bottom im finalen Player
      - iOS Browser UI ist kein DOM und wird nicht berührt
    */
    var knownSelectors = [
      '.mobile-dom-bottom-guard',
      '.mobile-dom-bottom-track',
      '.mobile-dom-bottom-left',
      '.mobile-dom-bottom-right',
      '.mobile-bottom-guard',
      '.bottom-guard',
      '.gesture-guard',
      '.bottom-levelmeter',
      '.mobile-bottom-meter',
      '.bottom-meter',
      '.center-out-meter',
      '.mobile-center-out-meter',
      '[class*="bottom"][class*="guard"]',
      '[class*="bottom"][class*="meter"]',
      '[class*="center"][class*="meter"]',
      '[class*="gesture"][class*="guard"]',
      '[id*="bottom"][id*="meter"]',
      '[id*="bottom"][id*="guard"]'
    ];

    knownSelectors.forEach(function(sel){
      qa(sel).forEach(function(node){
        if(node.closest && node.closest('#mffApp')) return;
        node.setAttribute('data-mff-v4-kill-old-bottom','1');
        try { node.remove(); } catch(e) {}
      });
    });

    qa('body > *').forEach(function(node){
      if(!node || node.id === 'mffApp') return;
      if(node.tagName === 'SCRIPT' || node.tagName === 'STYLE' || node.tagName === 'LINK') return;
      if(node.id === 'mffAudio' || node.id === 'mfmAudio') return;
      if(node.closest && node.closest('#mffApp')) return;

      var r = node.getBoundingClientRect ? node.getBoundingClientRect() : null;
      if(!r) return;

      var cs = window.getComputedStyle ? window.getComputedStyle(node) : null;
      var bg = cs ? ((cs.background || '') + ' ' + (cs.backgroundImage || '') + ' ' + (cs.boxShadow || '')) : '';
      var pos = cs ? cs.position : '';

      var nearBottom = r.top > window.innerHeight * 0.80;
      var wide = r.width > window.innerWidth * 0.60;
      var short = r.height > 6 && r.height < 90;
      var text = (node.textContent || '').trim();
      var lowText = text.length < 30;
      var colored = /linear-gradient|rgb|rgba|cyan|magenta|pink|255,\s*0|0,\s*255|22,\s*255/i.test(bg);

      if(nearBottom && wide && short && (lowText || colored || pos === 'fixed' || pos === 'absolute')){
        node.setAttribute('data-mff-v4-kill-old-bottom','1');
        try { node.remove(); } catch(e) {}
      }
    });

    /*
      Falls der Balken als Kind tiefer im alten DOM liegt: breite Elemente im unteren Bereich außerhalb #mffApp markieren.
      Hier wird absichtlich nur Bottom-Bereich getroffen.
    */
    qa('body *').forEach(function(node){
      if(!node || (node.closest && node.closest('#mffApp'))) return;
      if(node.tagName === 'SCRIPT' || node.tagName === 'STYLE' || node.tagName === 'LINK') return;

      var r = node.getBoundingClientRect ? node.getBoundingClientRect() : null;
      if(!r) return;

      var nearBottom = r.top > window.innerHeight * 0.82;
      var veryWide = r.width > window.innerWidth * 0.70;
      var meterHeight = r.height >= 8 && r.height <= 70;
      var txt = (node.textContent || '').trim();

      if(nearBottom && veryWide && meterHeight && txt.length < 40){
        node.setAttribute('data-mff-v4-kill-old-bottom','1');
        try { node.remove(); } catch(e) {}
      }
    });
  }

  function normalizeMeta(data){
    if(!data) return null;

    if(typeof data === 'string'){
      return { title: data };
    }

    var title =
      data.title || data.song || data.nowplaying || data.nowPlaying ||
      data.current_song || data.currentSong ||
      (data.icestats && data.icestats.source && (data.icestats.source.title || data.icestats.source.server_name)) ||
      (data.now_playing && data.now_playing.song && data.now_playing.song.text) ||
      (data.now_playing && data.now_playing.song && data.now_playing.song.title) ||
      '';

    var artist =
      data.artist ||
      (data.now_playing && data.now_playing.song && data.now_playing.song.artist) ||
      '';

    var listeners =
      data.listeners || data.listener_count || data.currentlisteners ||
      data.current_listeners ||
      (data.icestats && data.icestats.source && data.icestats.source.listeners) ||
      (data.listeners_current) ||
      '';

    var bitrate =
      data.bitrate || data.kbps || data.stream_bitrate ||
      (data.icestats && data.icestats.source && data.icestats.source.bitrate) ||
      '';

    var dj =
      data.dj || data.dj_status || data.server_name || data.station ||
      data.stream_name || data.name || '666SOUNDsDESIGn DJ';

    return {
      title: String(title || '').trim(),
      artist: String(artist || '').trim(),
      listeners: String(listeners || '').trim(),
      bitrate: String(bitrate || '').trim(),
      dj: String(dj || '').trim()
    };
  }

  async function fetchOne(url){
    var res = await fetch(url, {
      cache: 'no-store',
      headers: { 'Accept': 'application/json,text/plain,*/*' }
    });
    if(!res.ok) throw new Error(url + ' ' + res.status);

    var ct = (res.headers.get('content-type') || '').toLowerCase();
    if(ct.indexOf('application/json') >= 0 || ct.indexOf('+json') >= 0){
      return await res.json();
    }

    var text = await res.text();

    try { return JSON.parse(text); } catch(e) {}
    return text;
  }

  async function fetchMeta(){
    var endpoints = [
      '/streammeta?ts=' + Date.now(),
      '/nowplaying?ts=' + Date.now(),
      '/meta?ts=' + Date.now(),
      '/status?ts=' + Date.now(),
      '/streaminfo?ts=' + Date.now(),
      '/7.html?ts=' + Date.now()
    ];

    for(var i=0;i<endpoints.length;i++){
      try{
        var raw = await fetchOne(endpoints[i]);
        var meta = normalizeMeta(raw);
        if(meta && (meta.title || meta.listeners || meta.bitrate || meta.dj)){
          meta.source = endpoints[i].split('?')[0];
          return meta;
        }
      }catch(e){}
    }
    return null;
  }

  function setText(el, value){
    if(!el) return;
    el.textContent = value;
  }

  function applyMeta(meta){
    var app = q('#mffApp');
    if(!app) return;

    var title = meta && meta.title ? meta.title : 'Metadaten werden geladen ...';
    var subtitle = meta && meta.artist ? meta.artist : (meta && meta.source ? 'Quelle: ' + meta.source : 'Loading stream metadata ...');
    var listeners = meta && meta.listeners ? meta.listeners : '0';
    var bitrate = meta && meta.bitrate ? meta.bitrate : 'Unknown';
    var dj = meta && meta.dj ? meta.dj : '666SOUNDsDESIGn DJ';

    var h1 = q('#mffApp .mff-title h1');
    var h2 = q('#mffApp .mff-title h2');
    setText(h1, title);
    setText(h2, subtitle);

    var cards = qa('#mffApp .mff-card strong');
    if(cards[0]) cards[0].innerHTML = String(listeners).indexOf('/') >= 0 ? listeners : (listeners + ' / 250');
    if(cards[1]) cards[1].textContent = bitrate;
    if(cards[2]) cards[2].innerHTML = dj.replace(/\s+DJ$/i,'') + '<br>DJ';

    app.setAttribute('data-mff-meta-source', meta && meta.source ? meta.source : 'none');
    app.setAttribute('data-mff-meta-loaded', meta ? '1' : '0');
  }

  async function tickMeta(){
    if(!isMobile()) return;
    try{
      var meta = await fetchMeta();
      if(meta) applyMeta(meta);
    }catch(e){}
  }

  function startMetaLoop(){
    if(metaTimer) return;
    tickMeta();
    metaTimer = setInterval(tickMeta, 12000);
  }

  function apply(){
    if(!document.body) return;
    document.body.setAttribute('data-mff-remove-bottom-restore-meta', isMobile() ? 'v4' : 'desktop');

    if(!isMobile()) return;

    markOldBottomLayer();

    var app = q('#mffApp');
    if(app){
      app.setAttribute('data-mff-remove-bottom-restore-meta','v4');
      startMetaLoop();
    }
  }

  document.addEventListener('DOMContentLoaded', function(){
    apply();
    setTimeout(apply,150);
    setTimeout(apply,700);
    setTimeout(apply,1600);
    setTimeout(apply,3200);
    setTimeout(apply,5200);
  });
  window.addEventListener('load', apply, {passive:true});
  window.addEventListener('resize', apply, {passive:true});
  window.addEventListener('orientationchange', apply, {passive:true});
})();
</script>
