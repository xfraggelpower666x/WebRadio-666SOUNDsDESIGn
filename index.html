<script id="mobileFinalMockupMatchScript">
(function(){
  var VERSION = 'MOBILE_FINAL_MOCKUP_MATCH_v1';
  var STREAM_URL = '/stream';
  var boostStage = 0;
  var rafId = null;

  function isMobile(){
    return (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) || window.innerWidth <= 760;
  }

  function qs(sel, root){ return (root || document).querySelector(sel); }
  function qsa(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function getAudio(){
    var audio = qs('#mfmAudio') || qs('audio');
    if(!audio){
      audio = document.createElement('audio');
      audio.id = 'mfmAudio';
      audio.preload = 'none';
      audio.crossOrigin = 'anonymous';
      audio.playsInline = true;
      audio.style.display = 'none';
      document.body.appendChild(audio);
    }
    if(!audio.getAttribute('src')) audio.setAttribute('src', STREAM_URL);
    return audio;
  }

  function play(){
    var audio = getAudio();
    try {
      if(!audio.getAttribute('src')) audio.setAttribute('src', STREAM_URL);
      var r = audio.play();
      if(r && typeof r.catch === 'function'){
        r.catch(function(err){ console.warn('[MFM play]', err); });
      }
      document.documentElement.setAttribute('data-mfm-playing', '1');
    } catch(err){
      console.warn('[MFM play]', err);
    }
  }

  function pause(){
    var audio = getAudio();
    try { audio.pause(); } catch(err){}
    document.documentElement.setAttribute('data-mfm-playing', '0');
  }

  function stop(){
    var audio = getAudio();
    try {
      audio.pause();
      try { audio.currentTime = 0; } catch(e){}
    } catch(err){}
    document.documentElement.setAttribute('data-mfm-playing', '0');
  }

  function boost(delta){
    boostStage = Math.max(0, Math.min(3, boostStage + delta));
    var audio = getAudio();
    var vols = [0.86, 0.94, 1.0, 1.0];
    try { audio.volume = vols[boostStage]; } catch(e){}
    var label = qs('#mfmBoostLabel');
    if(label) label.innerHTML = 'BST ' + boostStage + '<small></small>';
    document.documentElement.setAttribute('data-mfm-boost', String(boostStage));
  }

  function card(title, value, icon){
    return '<section class="mfm-card">' +
      '<div class="mfm-card-top"><span class="mfm-icon">' + icon + '</span><span>' + title + '</span></div>' +
      '<strong>' + value + '</strong><div class="mfm-card-dots"><i></i><i></i><i></i></div>' +
      '</section>';
  }

  function buildUI(){
    if(qs('#mfmApp')) return;

    var app = document.createElement('div');
    app.id = 'mfmApp';
    app.setAttribute('data-version', VERSION);
    app.innerHTML =
      '<div class="mfm-side-meter mfm-side-left"><i></i></div>' +
      '<div class="mfm-side-meter mfm-side-right"><i></i></div>' +
      '<main class="mfm-shell">' +
        '<section class="mfm-now">' +
          '<div class="mfm-radio-icon"><span></span></div>' +
          '<div class="mfm-now-text">' +
            '<small>NOW PLAYING</small>' +
            '<h1>Metadaten werden geladen ...</h1>' +
            '<p>Loading stream metadata ...</p>' +
          '</div>' +
          '<button class="mfm-history" type="button">↺ History</button>' +
          '<div class="mfm-now-line"><i></i></div>' +
        '</section>' +
        '<section class="mfm-cards">' +
          card('LISTENERS', '0 / 250', '👥') +
          card('BITRATE', 'Unknown', '≋') +
          card('DJ / STATUS', '666SOUNDsDESIGn<br>DJ', '◖') +
        '</section>' +
        '<section class="mfm-eq">' +
          '<div class="mfm-panel-head"><span>EQ</span><b>20 BANDS</b></div>' +
          '<div class="mfm-eq-grid" id="mfmEqBars"></div>' +
        '</section>' +
        '<section class="mfm-controls" id="mfmControls">' +
          '<button type="button" data-mfm="play" class="mfm-play">▶</button>' +
          '<button type="button" data-mfm="pause">Ⅱ</button>' +
          '<button type="button" data-mfm="stop" class="mfm-stop">■</button>' +
          '<button type="button" data-mfm="back">↺</button>' +
          '<button type="button" data-mfm="down">−</button>' +
          '<button type="button" data-mfm="boost" id="mfmBoostLabel">BST 0<small></small></button>' +
          '<button type="button" data-mfm="up">+</button>' +
        '</section>' +
        '<section class="mfm-bottom-meter">' +
          '<div class="mfm-meter-title"><i></i><span>LEVEL METER</span><i></i></div>' +
          '<div class="mfm-meter-strip" id="mfmBottomBars"></div>' +
          '<div class="mfm-db"><span>-∞</span><span>-24</span><span>-12</span><span>-6</span><span>-3</span><span>0 dB</span></div>' +
          '<div class="mfm-swipe">SWIPE AREA</div>' +
        '</section>' +
      '</main>';

    document.body.appendChild(app);

    var eq = qs('#mfmEqBars');
    var heights = [62,74,48,44,68,52,36,50,32,28,54,68,56,48,52,46,58,42,50,60];
    heights.forEach(function(h, i){
      var b = document.createElement('i');
      b.style.setProperty('--h', h + '%');
      b.style.setProperty('--d', (i * 17) + 'ms');
      eq.appendChild(b);
    });

    var bottom = qs('#mfmBottomBars');
    for(var i=0;i<58;i++){
      var s = document.createElement('i');
      s.style.setProperty('--d', (i * 9) + 'ms');
      bottom.appendChild(s);
    }

    qs('#mfmControls').addEventListener('click', handleControl, {capture:true});
    qs('#mfmControls').addEventListener('touchend', handleControl, {passive:false,capture:true});
  }

  function handleControl(ev){
    var btn = ev.target.closest && ev.target.closest('[data-mfm]');
    if(!btn) return;
    ev.preventDefault();
    ev.stopPropagation();

    var cmd = btn.getAttribute('data-mfm');
    if(cmd === 'play') play();
    if(cmd === 'pause') pause();
    if(cmd === 'stop') stop();
    if(cmd === 'back') { stop(); setTimeout(play, 120); }
    if(cmd === 'down') boost(-1);
    if(cmd === 'up') boost(1);
    if(cmd === 'boost') boost(1);
  }

  function hideOldMobileLayers(){
    var selectors = [
      'header', '.hero', '.hero-image', '.site-header', '.main-header',
      '#mobileControlsLayerReset', '#mobileInlineTopControlsForce',
      '#mobileTopControlsInBoostPanel', '#mobileTransportRepair',
      '.mobile-transport-repair',
      '.mobile-dom-side-meter', '.mobile-dom-bottom-guard'
    ];

    selectors.forEach(function(sel){
      qsa(sel).forEach(function(n){
        if(n.closest && n.closest('#mfmApp')) return;
        n.setAttribute('data-mfm-hidden-old', '1');
      });
    });

    // Hauptinhalte der alten Mobile-Ansicht stilllegen, aber Desktop nicht zerstören.
    qsa('main,.mobile-shell,.player-shell,.hud-panel,.panel').forEach(function(n){
      if(n.closest && n.closest('#mfmApp')) return;
      n.setAttribute('data-mfm-hidden-old', '1');
    });

    // Große Bilder/Logos oben weg.
    qsa('img,[class*="logo"],[class*="hero"],[class*="header"]').forEach(function(n){
      if(n.closest && n.closest('#mfmApp')) return;
      n.setAttribute('data-mfm-hidden-old', '1');
    });
  }

  function loop(){
    var playing = document.documentElement.getAttribute('data-mfm-playing') === '1';
    var t = Date.now() / 1000;
    var level = playing ? (0.36 + 0.32 * Math.abs(Math.sin(t * 2.7))) : 0.18;
    document.documentElement.style.setProperty('--mfm-level', level.toFixed(3));
    rafId = requestAnimationFrame(loop);
  }

  function install(){
    if(!document.body) return;
    document.documentElement.setAttribute('data-mfm-version', VERSION);
    document.body.setAttribute('data-mfm-mobile', isMobile() ? '1' : '0');

    if(isMobile()){
      buildUI();
      hideOldMobileLayers();
      if(!rafId) loop();
    }
  }

  document.addEventListener('DOMContentLoaded', function(){
    install();
    setTimeout(install, 200);
    setTimeout(install, 800);
    setTimeout(install, 1800);
  });
  window.addEventListener('resize', install, {passive:true});
  window.addEventListener('orientationchange', install, {passive:true});
})();
</script>
