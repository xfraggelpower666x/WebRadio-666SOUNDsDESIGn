<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>666SOUNDsDESIGn Mini Radio</title>
  <meta http-equiv="Content-Security-Policy"
    content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src * data: blob:; img-src * data: blob:; media-src * data: blob:;">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <div class="card">
      <h1>666SOUNDsDESIGn</h1>
      <p class="sub">Mini GitHub Pages Build + Worker Source</p>

      <div class="controls">
        <button id="playBtn">PLAY</button>
        <button id="stopBtn">STOP</button>
      </div>

      <label class="volbox">
        <span>VOLUME</span>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.85" />
      </label>

      <div class="meta">
        <div><span>Song</span><strong id="song">Loading…</strong></div>
        <div><span>Listeners</span><strong id="listeners">0</strong></div>
        <div><span>Bitrate</span><strong id="bitrate">0</strong></div>
        <div><span>DJ</span><strong id="dj">---</strong></div>
        <div><span>Worker</span><strong id="worker">Checking…</strong></div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
