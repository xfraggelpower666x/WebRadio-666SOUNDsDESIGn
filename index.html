
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>666 Player FIX</title>
<script src="config/radio.config.js"></script>
</head>
<body style="background:#000;color:#0ff;font-family:sans-serif;text-align:center">

<h1>666 PLAYER FIX</h1>

<button onclick="start()">ENTER SYSTEM</button>
<br><br>

<button onclick="play()">PLAY</button>
<button onclick="pause()">PAUSE</button>

<p id="meta">Loading...</p>

<audio id="audio" controls></audio>

<script>
const cfg = window.RADIO_CONFIG;
const audio = document.getElementById("audio");

function start(){
  alert("System Ready");
}

async function play(){
  audio.src = cfg.apiBase + cfg.streamPath;
  await audio.play();
}

function pause(){
  audio.pause();
}

async function meta(){
  const res = await fetch(cfg.apiBase + cfg.metadataPath);
  const j = await res.json();
  document.getElementById("meta").innerText = j.title || "No Data";
}

setInterval(meta,3000);
meta();
</script>

</body>
</html>
