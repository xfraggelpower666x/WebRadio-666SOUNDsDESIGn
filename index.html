  function invalidMetaText(x){
    if(!x)return true;
    var s=String(x).trim();
    if(!s)return true;
    if(s.indexOf('<!DOCTYPE')>=0||s.indexOf('<!doctype')>=0||s.indexOf('<html')>=0||s.indexOf('<body')>=0||s.indexOf('<script')>=0)return true;
    if(s.length>260&&/<\/?[a-z][\s\S]*>/i.test(s))return true;
    return false;
  }

  function normalizeDj(raw){
    var dj=String(raw||'').trim();
    if(!dj)return 'DJ-666';
    if(/auto\s*dj|autodj|auto-dj|unknown|offline|none|null|undefined/i.test(dj))return 'DJ-666';
    return dj;
  }

  function normalizeMeta(data){
    if(!data)return null;
    if(typeof data==='string'){if(invalidMetaText(data))return null;return{title:data,dj:'DJ-666'};}
    var np=data.now_playing||data.nowPlaying||{};
    var song=np.song||data.song||{};
    var station=data.station||{};
    var title=data.title||data.current_title||data.nowplaying||data.nowPlaying||data.current_song||data.currentSong||song.text||song.title||'';
    var artist=data.artist||song.artist||'';
    var listeners=data.listeners||data.listener_count||data.currentlisteners||data.current_listeners||data.listeners_current||(data.stats&&data.stats.listeners)||'';
    var bitrate=data.bitrate||data.kbps||data.stream_bitrate||(data.stats&&data.stats.bitrate)||'';
    var dj=data.dj||data.dj_status||data.live_dj||data.streamer||data.server_name||station.name||data.station_name||data.stream_name||data.name||'';
    var artwork=data.icon||data.logo||data.artwork||data.image||data.cover||data.cover_url||data.art||station.icon||station.logo||station.image||song.art||'';
    title=String(title||'').trim();
    if(invalidMetaText(title))title='';
    return{title:title,artist:String(artist||'').trim(),listeners:String(listeners||'').trim(),bitrate:String(bitrate||'').trim(),dj:normalizeDj(dj),artwork:String(artwork||'').trim()};
  }

  async function fetchOne(url){
    var res=await fetch(url,{cache:'no-store',headers:{Accept:'application/json,*/*'}});
    if(!res.ok)throw new Error(url+' '+res.status);
    var ct=(res.headers.get('content-type')||'').toLowerCase();
    var text=await res.text();
    if(invalidMetaText(text)&&ct.indexOf('json')<0)throw new Error('HTML response '+url);
    try{return JSON.parse(text)}catch(e){}
    if(invalidMetaText(text))throw new Error('invalid meta text '+url);
    return text;
  }


  function normalizeHistoryItems(raw){
    var arr=[];
    if(!raw) return arr;
    if(Array.isArray(raw)) arr=raw;
    else if(Array.isArray(raw.history)) arr=raw.history;
    else if(Array.isArray(raw.recent)) arr=raw.recent;
    else if(Array.isArray(raw.songs)) arr=raw.songs;
    else if(Array.isArray(raw.tracks)) arr=raw.tracks;
    else if(raw.items && Array.isArray(raw.items)) arr=raw.items;
    return arr.map(function(item){
      if(typeof item==='string') return {title:item,artist:''};
      var song=item.song||item.track||item.now_playing&&item.now_playing.song||{};
      var title=item.title||item.name||item.text||item.current_song||song.text||song.title||'';
      var artist=item.artist||song.artist||item.dj||item.streamer||'';
      var time=item.time||item.played_at||item.timestamp||item.date||'';
      return {title:String(title||'').trim(),artist:String(artist||'').trim(),time:String(time||'').trim()};
    }).filter(function(x){return x.title;}).slice(0,18);
  }

  function pushLocalHistory(meta){
    if(!meta || !meta.title) return;
    var title=String(meta.title||'').trim();
    if(!title || title===lastHistoryTitle) return;
    lastHistoryTitle=title;
    localHistory.unshift({
      title:title,
      artist:String(meta.artist||'').trim(),
      time:new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
    });
    localHistory=localHistory.slice(0,18);
  }

  function renderHistory(items,source){
    var box=q('#mffHistoryList');
    if(!box) return;
    var list=(items&&items.length)?items:localHistory;
    if(!list || !list.length){
      box.innerHTML='<div class="mff-history-empty">Noch keine History-Daten vorhanden.</div>';
      return;
    }
    box.innerHTML=list.slice(0,18).map(function(item,idx){
      var sub=(item.artist||item.time||source||'');
      return '<div class="mff-history-item">'+
        '<div class="mff-history-num">'+String(idx+1).padStart(2,'0')+'</div>'+
        '<div><div class="mff-history-title">'+escapeHtml(item.title||'Unbekannter Titel')+'</div>'+
        '<div class="mff-history-sub">'+escapeHtml(sub||'played')+'</div></div></div>';
    }).join('');
  }

  function escapeHtml(str){
    return String(str||'').replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  async function fetchHistory(){
    for(var i=0;i<HISTORY_ENDPOINTS.length;i++){
      try{
        var raw=await fetchOne(HISTORY_ENDPOINTS[i]+'?ts='+Date.now());
        var items=normalizeHistoryItems(raw);
        if(items.length) return {items:items,source:HISTORY_ENDPOINTS[i]};
      }catch(e){}
    }
    return {items:localHistory,source:'local'};
  }

  async function toggleHistory(force){
    var app=q('#mffApp');
    if(!app) return;
    var open=app.getAttribute('data-history-open')==='1';
    var next=(typeof force==='boolean')?force:!open;
    app.setAttribute('data-history-open',next?'1':'0');
    var overlay=q('#mffHistoryOverlay');
    if(overlay) overlay.setAttribute('aria-hidden',next?'false':'true');
    if(next){
      renderHistory(localHistory,'local');
      try{
        var h=await fetchHistory();
        renderHistory(h.items,h.source);
      }catch(e){
        renderHistory(localHistory,'local');
      }
    }
  }

  function bindTransportHardFeedback(app){

      if(!btn) return '';
      var a=btn.getAttribute('data-action')||btn.getAttribute('data-mff-action')||'';
      if(/^(play|start|stream-play|transport-play)$/.test(a)) return 'play';
      if(/^(pause|stream-pause|transport-pause)$/.test(a)) return 'pause';
      if(/^(stop|stream-stop|transport-stop)$/.test(a)) return 'stop';
      var t=String(btn.textContent||btn.getAttribute('aria-label')||btn.title||'').trim().toLowerCase();
      if(/▶|►|play/.test(t)) return 'play';
      if(/pause|⏸|Ⅱ|\|\|/.test(t)) return 'pause';
      if(/stop|■|▪|square/.test(t)) return 'stop';
      return '';

    function onTransportTap(ev){
      var btn=ev.target&&ev.target.closest?ev.target.closest('button,.mff-control,[data-action],[data-mff-action]'):null;
      if(!btn || !app.contains(btn)) return;
      var role=detectRole(btn);
      if(!role) return;

      // Nur visuelles Feedback hart setzen. Audio-Logik bleibt bei bestehenden Handlern.
      if(role==='play'){
        applyTransportVisualState('play');
      }else if(role==='pause'){
        applyTransportVisualState('pause');
      }else if(role==='stop'){
        applyTransportVisualState('stop');
      }

    app.addEventListener('click',onTransportTap,true);
    app.addEventListener('touchend',onTransportTap,{capture:true,passive:true});

    setPanelLed('meta',metaOk?'ok':(playing?'warn':'off'),metaOk?'Metadaten empfangen':(playing?'Metadaten fehlen/leer':'noch keine Metadaten'));

    var active=inferActiveStream(meta);

      setPanelLed('main','off','Hauptstream nicht aktiv');
      setPanelLed('backup','off','Backupstream nicht aktiv');

  async function fetchMeta(){
    for(var i=0;i<META_ENDPOINTS.length;i++){
      var endpoint=META_ENDPOINTS[i];
      try{
        var raw=await fetchOne(endpoint+'?ts='+Date.now());
        var meta=normalizeMeta(raw);
        if(meta&&(meta.title||meta.listeners||meta.bitrate||meta.dj||meta.artwork)){
          meta.source=endpoint;
          return meta;
        }
      }catch(e){}
    }
    return null;

    if(cards[2]) cards[2].innerHTML=normalizeDj(meta.dj);

  function pseudoNoise(seed){
    var x=Math.sin(seed*12.9898+78.233)*43758.5453;
    return x-Math.floor(x);
  }

  function smoothPulse(t, speed, phase){
    var v=(Math.sin(t*speed+phase)+1)/2;
    return v*v*(3-2*v);
  }



  function pcClamp(value,min,max){
    return Math.max(min,Math.min(max,value));
  }

  function pcFallbackBarValue(index,total,intensity){
    var t=Date.now()/155;
    var mirrored=index<(total/2)?index:(total-1-index);
    var waveA=Math.abs(Math.sin(t+mirrored*.30));
    var waveB=Math.abs(Math.sin((t*.66)+mirrored*.17));
    var contour=1.16-((mirrored/Math.max(1,total/2))*.38);
    return 14+((waveA*68)+(waveB*18))*contour*intensity;
  }

  /* v23 removed old mobile EQ helper: pcPxToPercent */


  function pcSetSideMeterFromPercent(valuePercent){
    var next=(pcSmoothMeter*.58)+(pcClamp(valuePercent,12,98)*.42);
    pcSmoothMeter=next;
    return next/100;
  }

  function pcApplyBottomCenterOut(bottomBars,meterPercent){
    if(!bottomBars||!bottomBars.length)return;
    var mid=(bottomBars.length-1)/2;
    var level=pcClamp(meterPercent,12,98)/100;
    for(var i=0;i<bottomBars.length;i++){
      var dist=Math.abs(i-mid)/mid;
      var center=1-dist;
      var pulse=Math.abs(Math.sin(Date.now()/210+i*.13));
      var shaped=pcClamp((level*.70)+(center*.18)+(pulse*.12),.16,1);
      bottomBars[i].style.setProperty('--mff-bar-x',shaped.toFixed(3));
      bottomBars[i].style.setProperty('--mff-bar-opacity',(.44+shaped*.54).toFixed(2));
    }
  }

  /* v23 removed old mobile EQ helper: pcEqDirectEnsure */


  /* v23 removed old mobile EQ helper: pcEqDirectFallbackValue */


  /* v23 removed old mobile EQ helper: pcEqDirectWriteBars */

  function mffClamp(v,min,max){return Math.max(min,Math.min(max,v));}

  function mffBoostVisualOffset(){
    return (boostStage||0)*0.006;
  }

  function mffMeterHeadroom(v){
    return mffClamp(v,0.08,0.84);
  }


  function mffCleanEqBars(){
    return qa('#mffEqBars i');
  }

  function mffCleanEqEnsure(bars){
    if(!mffCleanEqValues.length || mffCleanEqValues.length!==bars.length){
      mffCleanEqValues=new Array(bars.length).fill(.28);
    }
  }

  function mffCleanEqReadAnalyser(){
    try{
      if(audioGraph && audioGraph.ok && audioGraph.analyser && audioGraph.freqData){
        audioGraph.analyser.getByteFrequencyData(audioGraph.freqData);
        var peak=0;
        for(var i=0;i<audioGraph.freqData.length;i++){
          if((audioGraph.freqData[i]||0)>peak) peak=audioGraph.freqData[i]||0;
        }
        if(peak>8) return audioGraph.freqData;
      }
    }catch(e){}
    return null;
  }

  function mffCleanEqTargetsFromAnalyser(data,count,boost){
    var halfBars=Math.max(1,Math.floor(count/2));
    var analysisWindow=Math.max(8,Math.floor(data.length*0.72));
    var slice=Math.max(1,Math.floor(analysisWindow/halfBars));
    var halfValues=[];
    var globalMax=0;

    /*
      Direkt am PC-Equalizer-Verhalten orientiert:
      - halfBars
      - analysisWindow 72%
      - pow(i, 1.65) Frequenzbandverteilung
      - pow(avg / 255, 0.72) Bar-Shaping
      - contour-Absenkung in höheren Bändern
    */
    for(var i=0;i<halfBars;i++){
      var total=0;
      var countBins=0;
      var start=Math.floor(Math.pow(i/Math.max(1,halfBars-1),1.65)*Math.max(1,analysisWindow-slice));
      var end=Math.min(analysisWindow,start+slice);

      for(var j=start;j<end;j++){
        var v=data[j]||0;
        total+=v;
        countBins++;
      }

      var avg=countBins?(total/countBins):0;
      globalMax=Math.max(globalMax,avg);

      var shaped=Math.pow(avg/255,0.72);
      var contour=1.16-((i/Math.max(1,halfBars-1))*0.36);
      var value=.14 + shaped*contour*.84 + (boost||0)*.006;
      halfValues.push(mffClamp(value,.13,.86));
    }

    var targets=[];
    for(var b=0;b<count;b++){
      var mirroredIndex=b<halfBars?b:(count-1-b);
      targets.push(halfValues[Math.min(mirroredIndex,halfValues.length-1)]||.14);
    }

    return {targets:targets, level:mffClamp(globalMax/255,.10,.86), mode:'pc-code-real'};
  }

  function mffCleanEqTargetsSynthetic(count,playing,boost){
    var half=Math.max(1,Math.floor(count/2));
    var targets=[];
    var intensity=(playing?1.0:0.36)+(boost||0)*0.018;

    /*
      v26:
      An PC js/equalizer.js ausgerichtet.
      Kein "organic random", sondern organisierte PC-Fallback-Welle:
      mirroredIndex, waveA, waveB, contour.
      Das wirkt strukturierter wie PC, statt wie künstliches Algorithmus-Flackern.
    */
    mffCleanEqPhase += playing ? 0.092 : 0.038;

    var t=mffCleanEqPhase;
    var peak=.14;

    for(var i=0;i<count;i++){
      var mirroredIndex=i<half?i:(count-1-i);
      var pos=mirroredIndex/Math.max(1,half-1);

      var waveA=Math.abs(Math.sin(t + mirroredIndex*0.30));
      var waveB=Math.abs(Math.sin((t*0.66) + mirroredIndex*0.17));
      var waveC=Math.abs(Math.sin((t*0.31) + mirroredIndex*0.39));

      var contour=1.16-(pos*0.38);
      var value=.14 + ((waveA*.52)+(waveB*.18)+(waveC*.07))*contour*intensity;

      // PC-artige ruhige Begrenzung, kein Vollanschlag.
      value=mffClamp(value,.13,.82);
      targets.push(value);
      peak=Math.max(peak,value);
    }

    return {targets:targets, level:peak, mode:'pc-code-fallback'};
  }

  function mffCleanEqRender(playing){
    var bars=mffCleanEqBars();
    if(!bars.length) return .14;

    mffCleanEqEnsure(bars);
    var boost=boostStage||0;
    var data=mffCleanEqReadAnalyser();
    var pack=data
      ? mffCleanEqTargetsFromAnalyser(data,bars.length,boost)
      : mffCleanEqTargetsSynthetic(bars.length,playing,boost);

    /*
      PC-Look: bars sind organisiert, aber nicht permanent gleich schnell.
      Wichtig: eine einzige Stelle schreibt transform/opacity.
    */
    var peak=.14;
    var inertia=pack.mode==='pc-code-real'?0.58:0.64;

    for(var i=0;i<bars.length;i++){
      var prev=mffCleanEqValues[i]||.22;
      var target=pack.targets[i]||.14;

      // leicht unterschiedliche Inertia nach Frequenzzone,
      // aber konstant/deterministisch, kein Layer, kein Random.
      var zone=i/Math.max(1,bars.length-1);
      var localInertia=mffClamp(inertia + (zone*.035),0.58,0.70);
      var next=(prev*localInertia)+(target*(1-localInertia));

      mffCleanEqValues[i]=next;
      peak=Math.max(peak,next);

      bars[i].style.setProperty('--mff-eq-scale',next.toFixed(3));
      bars[i].style.setProperty('--mff-eq-opacity',(0.48+next*.50).toFixed(3));
      bars[i].style.transform='scaleY('+next.toFixed(3)+')';
      bars[i].style.opacity=(0.48+next*.50).toFixed(3);
    }

    var app=q('#mffApp');
    if(app){
      app.setAttribute('data-mff-eq-engine','pc-match-v26');
      app.setAttribute('data-mff-meter-mode',pack.mode);
    }

    // Meter folgt Peak, aber mit Headroom und ohne Boost-Sättigung.
    var bottomLevel=mffMeterHeadroom((peak*.76)+mffBoostVisualOffset());
    updateBottomCenterOutSegments(bottomLevel,boost);
    document.documentElement.style.setProperty('--mff-level',bottomLevel.toFixed(3));
    return bottomLevel;
  }


  function updateBottomCenterOutSegments(level, boost){
    var bars=qa('#mffBottomBars i');
    if(!bars.length) return;
    var n=bars.length;
    var half=Math.floor(n/2);
    var active=Math.max(1,Math.min(half-2,Math.round(Math.min(level,.84)*half)));
    var pulse=(Math.sin(Date.now()/210)+1)/2;
    var boosted=(boost||0)*0.018;

    for(var i=0;i<n;i++){
      var isLeft=i<half;
      var distFromCenter=isLeft?(half-1-i):(i-half);
      var on=distFromCenter<active;
      var falloff=1-(distFromCenter/Math.max(1,half));
      var glow=Math.max(0.22,Math.min(1,falloff*level + pulse*0.10 + boosted));

      bars[i].classList.toggle('mff-seg-on',on);
      bars[i].style.setProperty('--mff-bar-on',on?'1':'0');
      bars[i].style.setProperty('--mff-bar-opacity',on?(0.55+glow*0.45).toFixed(2):'0.24');
      bars[i].style.setProperty('--mff-bar-scale',on?(0.72+glow*0.28).toFixed(3):'0.55');
    }
  }

  function averageRange(arr,start,end){
    var sum=0,count=0;
    for(var i=start;i<end&&i<arr.length;i++){sum+=arr[i];count++;}
    return count?sum/count:0;
  }
