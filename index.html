<script id="mobileInlineTopControlsForceScript">
(function(){
  var VERSION='MOBILE_INLINE_TOP_CONTROLS_FORCE_v1';
  function isMobile(){ return (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) || window.innerWidth <= 760; }

  function findBoostHost(){
    var exact = document.querySelector('.boost-panel,.mobile-boost-core,[data-mobile-top-controls-host]');
    if(exact) return exact;

    var all = Array.prototype.slice.call(document.querySelectorAll('div,section,article,main'));
    var candidates = all.filter(function(el){
      var t=(el.textContent||'').trim();
      return /\bBST\b/.test(t) && el.getBoundingClientRect && el.getBoundingClientRect().height > 40;
    });
    if(candidates.length){
      candidates.sort(function(a,b){
        var ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
        return Math.abs(ra.top-520)-Math.abs(rb.top-520);
      });
      return candidates[0];
    }
    return document.querySelector('.hud-panel,.player-shell,.mobile-shell,main') || document.body;
  }

  function ensureAudio(){
    var a=document.querySelector('audio');
    if(!a){
      a=document.createElement('audio');
      a.id='inlineMobileAudio';
      a.crossOrigin='anonymous';
      a.preload='none';
      a.playsInline=true;
      a.style.display='none';
      document.body.appendChild(a);
    }
    if(!a.getAttribute('src')){
      a.setAttribute('src','/stream');
    }
    return a;
  }

  function nativePlay(){
    var a=ensureAudio();
    try{
      if(!a.getAttribute('src')) a.setAttribute('src','/stream');
      var r=a.play();
      if(r && typeof r.catch==='function') r.catch(function(err){ console.warn('[666 inline play]', err); });
    }catch(err){ console.warn('[666 inline play]', err); }
  }

  function nativePause(){
    var a=document.querySelector('audio');
    if(a) a.pause();
  }

  function nativeStop(){
    var a=document.querySelector('audio');
    if(a){
      a.pause();
      try{ a.currentTime=0; }catch(e){}
    }
  }

  function boost(delta){
    var root=document.documentElement;
    var current=Number(root.getAttribute('data-inline-boost-stage')||'0');
    var next=Math.max(0,Math.min(3,current+delta));
    root.setAttribute('data-inline-boost-stage',String(next));
    var a=ensureAudio();
    var volumes=[0.86,0.94,1.0,1.0];
    try{ a.volume=volumes[next]; }catch(e){}
    var label=document.querySelector('#mobileInlineTopControlsForce .mi-bst');
    if(label) label.textContent='BST '+next;
    // vorhandene Boost-Buttons zusätzlich triggern, falls vorhanden
    var existing = delta>0
      ? document.querySelector('.boost-up,[data-action="boost-up"],[aria-label*="Boost mehr"],button[aria-label*="Boost mehr"]')
      : document.querySelector('.boost-down,[data-action="boost-down"],[aria-label*="Boost weniger"],button[aria-label*="Boost weniger"]');
    if(existing && !existing.closest('#mobileInlineTopControlsForce')){
      try{ existing.click(); }catch(e){}
    }
  }

  function install(){
    if(!isMobile()){
      document.body && document.body.setAttribute('data-inline-mobile-controls','off');
      return;
    }
    document.body.setAttribute('data-inline-mobile-controls','on');
    document.documentElement.setAttribute('data-inline-mobile-controls-version',VERSION);

    var controls=document.getElementById('mobileInlineTopControlsForce');
    if(!controls){
      controls=document.createElement('div');
      controls.id='mobileInlineTopControlsForce';
      controls.innerHTML=
        '<button type="button" class="mi-play" data-mi="play" aria-label="Play">▶</button>'+
        '<button type="button" data-mi="pause" aria-label="Pause">Ⅱ</button>'+
        '<button type="button" class="mi-stop" data-mi="stop" aria-label="Stop">■</button>'+
        '<button type="button" data-mi="bdown" aria-label="Boost weniger">−</button>'+
        '<span class="mi-bst">BST 0</span>'+
        '<button type="button" data-mi="bup" aria-label="Boost mehr">+</button>';
    }

    var host=findBoostHost();
    if(host){
      host.setAttribute('data-inline-controls-host','v1');
      Array.prototype.slice.call(host.querySelectorAll('img,svg,.logo,[class*="logo"],[class*="brand"],[class*="mark"]')).forEach(function(n){
        if(!n.closest('#mobileInlineTopControlsForce')) n.setAttribute('data-mobile-boost-logo-hide','force');
      });
      if(controls.parentNode!==host) host.insertBefore(controls, host.firstChild);
    }else{
      document.body.insertBefore(controls, document.body.firstChild);
    }

    if(!controls.__miBound){
      controls.__miBound=true;
      var handler=function(ev){
        var b=ev.target.closest && ev.target.closest('[data-mi]');
        if(!b) return;
        ev.preventDefault(); ev.stopPropagation();
        var a=b.getAttribute('data-mi');
        if(a==='play') nativePlay();
        if(a==='pause') nativePause();
        if(a==='stop') nativeStop();
        if(a==='bup') boost(1);
        if(a==='bdown') boost(-1);
      };
      controls.addEventListener('click',handler,{capture:true});
      controls.addEventListener('touchend',handler,{passive:false,capture:true});
    }
  }

  document.addEventListener('DOMContentLoaded',function(){
    install();
    setTimeout(install,250);
    setTimeout(install,1000);
    setTimeout(install,2200);
  });
  window.addEventListener('resize',install,{passive:true});
  window.addEventListener('orientationchange',install,{passive:true});
})();
</script>

 }
}

<!-- MOBILE_VISUAL_ORDER_CLEANUP_v1 -->
<script id="mobileVisualOrderCleanupScript">
(function(){
function isMobile(){return(window.matchMedia&&window.matchMedia('(max-width: 760px)').matches)||window.innerWidth<=760}
function apply(){
 if(!document.body)return;
 document.body.setAttribute('data-mobile-visual-order-cleanup',isMobile()?'v1':'desktop');
 var c=document.getElementById('mobileInlineTopControlsForce');
 if(c){c.setAttribute('data-mobile-clean-controls','v1');}
 var h=document.querySelector('[data-inline-controls-host="v1"],[data-mobile-ui-order-host="v1"],.mobile-boost-top-controls-host,.boost-panel,.mobile-boost-core,[class*="boost"]');
 if(h){
  h.setAttribute('data-mobile-clean-boost-host','v1');
  Array.prototype.slice.call(h.children).forEach(function(x){if(x.id!=='mobileInlineTopControlsForce')x.setAttribute('data-mobile-clean-hide','v1')});
  Array.prototype.slice.call(h.querySelectorAll('img,svg,.logo,[class*="logo"],[class*="brand"],[class*="mark"]')).forEach(function(x){if(!x.closest('#mobileInlineTopControlsForce'))x.setAttribute('data-mobile-clean-hide','v1')});
 }
 var eq=document.querySelector('.eq,.equalizer,[class*="equalizer"],[class*="eq"]');
 if(eq)eq.setAttribute('data-mobile-clean-eq','v1');
}
document.addEventListener('DOMContentLoaded',function(){apply();setTimeout(apply,250);setTimeout(apply,1000);setTimeout(apply,2400)});
window.addEventListener('resize',apply,{passive:true});
window.addEventListener('orientationchange',apply,{passive:true});
})();
