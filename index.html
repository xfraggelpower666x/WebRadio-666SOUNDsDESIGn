<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>666 Radio</title>
<style>
body{background:#111;color:#fff;font-family:Arial;text-align:center;padding:40px}
button{padding:15px;margin:10px}
</style>
</head>
<body>
<h1>666SOUNDsDESIGn</h1>
<button onclick="play()">PLAY</button>
<button onclick="stop()">STOP</button>
<audio id="a" playsinline></audio>
<script>
const a=document.getElementById("a");
function play(){a.src="/stream";a.play();}
function stop(){a.pause();}
</script>
</body>
</html>
