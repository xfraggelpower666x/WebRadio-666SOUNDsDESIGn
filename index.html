<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>666 Radio</title>
</head>
<body style="background:#111;color:#0ff;text-align:center;margin-top:50px">
<h1>666SOUNDsDESIGn</h1>
<button onclick="audio.play()">PLAY</button>
<p id="meta">...</p>
<script>
const BASE = window.location.origin;
let audio = new Audio(BASE + "/stream");
audio.crossOrigin="anonymous";

async function loadMeta(){
  try{
    const res = await fetch(BASE + "/metadata");
    const j = await res.json();
    document.getElementById("meta").innerText = j.title || "No Data";
  }catch(e){
    document.getElementById("meta").innerText = "Meta Error";
  }
}
setInterval(loadMeta, 5000);
loadMeta();
</script>
</body>
</html>
