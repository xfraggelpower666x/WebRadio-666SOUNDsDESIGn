<script id="mobileControlsLayerResetScript">
(function(){
  var VERSION='MOBILE_CONTROLS_LAYER_RESET_v1';
  var STREAM_URL='/stream';
  var boostStage=0;

  function isMobile(){
    return (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) || window.innerWidth <= 760;
  }

  function getAudio(){
    var a=document.querySelector('audio');
    if(!a){
      a=document.createElement('audio');
      a.id='mobileControlsLayerResetAudio';
      a.preload='none';
      a.crossOrigin='anonymous';
      a.playsInline=true;
      a.style.display='none';
      document.body.appendChild(a);
    }
    if(!a.getAttribute('src')) a.setAttribute('src', STREAM_URL);
    return a;
  }

  function setLabel(){
    var el=document.querySelector('#mobileControlsLayerReset .mclr-bst');
    if(el) el.textContent='BST ' + boostStage;
    document.documentElement.setAttribute('data-mobile-layer-reset-boost', String(boostStage));
  }

  function play(){
    var a=getAudio();
    try{
      if(!a.getAttribute('src')) a.setAttribute('src', STREAM_URL);
      var r=a.play();
      if(r && typeof r.catch==='function') r.catch(function(err){ console.warn('[MCLR play]', err); });
    }catch(err){ console.warn('[MCLR play]', err); }
  }

  function pause(){
    var a=document.querySelector('audio');
    if(a) a.pause();
  }

  function stop(){
    var a=document.querySelector('audio');
    if(a){
      a.pause();
      try{ a.currentTime=0; }catch(e){}
    }
  }

  function boost(delta){
    boostStage=Math.max(0,Math.min(3,boostStage+delta));
    var a=getAudio();
    var volumes=[0.86,0.94,1.0,1.0];
    try{ a.volume=volumes[boostStage]; }catch(e){}
    setLabel();

    // Bestehende Boost-Logik zusätzlich anstoßen, falls der alte Player sie bereitstellt.
    var selector = delta > 0
      ? '[data-mobile-top-action="boost-up"],[data-mi="bup"],[data-mobile-repair-action="boost-up"],button[aria-label*="Boost mehr"]'
      : '[data-mobile-top-action="boost-down"],[data-mi="bdown"],[data-mobile-repair-action="boost-down"],button[aria-label*="Boost weniger"]';
    var oldBtn=document.querySelector(selector);
    if(oldBtn && !oldBtn.closest('#mobileControlsLayerReset')){
      try{ oldBtn.click(); }catch(e){}
    }
  }

  function install(){
    if(!document.body) return;
    document.body.setAttribute('data-mobile-controls-layer-reset', isMobile() ? 'v1' : 'desktop');
    document.documentElement.setAttribute('data-mobile-controls-layer-reset-version', VERSION);

    var oldSelectors=[
      '#runtimeCacheBustProof',
      '#mobileInlineTopControlsForce',
      '#mobileTopControlsInBoostPanel',
      '#mobileTransportRepair',
      '.mobile-transport-repair'
    ];
    oldSelectors.forEach(function(sel){
      document.querySelectorAll(sel).forEach(function(n){
        if(n.id!=='mobileControlsLayerReset'){
          n.setAttribute('data-mclr-disabled','v1');
          n.style.display='none';
          n.style.visibility='hidden';
          n.style.opacity='0';
          n.style.pointerEvents='none';
        }
      });
    });

    if(!isMobile()) return;

    var bar=document.getElementById('mobileControlsLayerReset');
    if(!bar){
      bar=document.createElement('div');
      bar.id='mobileControlsLayerReset';
      bar.innerHTML=
        '<button type="button" class="mclr-play" data-mclr="play" aria-label="Play">▶</button>'+
        '<button type="button" data-mclr="pause" aria-label="Pause">Ⅱ</button>'+
        '<button type="button" class="mclr-stop" data-mclr="stop" aria-label="Stop">■</button>'+
        '<button type="button" data-mclr="bdown" aria-label="Boost weniger">−</button>'+
        '<span class="mclr-bst">BST 0</span>'+
        '<button type="button" data-mclr="bup" aria-label="Boost mehr">+</button>';
      document.body.appendChild(bar);
    }

    if(!bar.__mclrBound){
      bar.__mclrBound=true;
      var handler=function(ev){
        var btn=ev.target.closest && ev.target.closest('[data-mclr]');
        if(!btn) return;
        ev.preventDefault();
        ev.stopPropagation();
        var cmd=btn.getAttribute('data-mclr');
        if(cmd==='play') play();
        if(cmd==='pause') pause();
        if(cmd==='stop') stop();
        if(cmd==='bup') boost(1);
        if(cmd==='bdown') boost(-1);
      };
      bar.addEventListener('click',handler,{capture:true});
      bar.addEventListener('touchend',handler,{passive:false,capture:true});
    }

    setLabel();
  }

  document.addEventListener('DOMContentLoaded',function(){
    install(); setTimeout(install,250); setTimeout(install,900); setTimeout(install,2200);
  });
  window.addEventListener('resize',install,{passive:true});
  window.addEventListener('orientationchange',install,{passive:true});
})();
</script>
