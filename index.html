    };
    controls.addEventListener('click',handler,{capture:true});
    controls.addEventListener('touchend',handler,{passive:false,capture:true});

    var hbtn=q('.mff-history',app);
    if(hbtn){
      hbtn.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();toggleHistory();},{capture:true});
      hbtn.addEventListener('touchend',function(ev){ev.preventDefault();ev.stopPropagation();toggleHistory();},{passive:false,capture:true});
    }
    var hback=q('#mffHistoryBackdrop',app);
    if(hback){
      hback.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();toggleHistory(false);},{capture:true});
      hback.addEventListener('touchend',function(ev){ev.preventDefault();ev.stopPropagation();toggleHistory(false);},{passive:false,capture:true});
    }

    var hclose=q('[data-mff-history-close]',app);
    if(hclose){
      hclose.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();toggleHistory(false);},{capture:true});
      hclose.addEventListener('touchend',function(ev){ev.preventDefault();ev.stopPropagation();toggleHistory(false);},{passive:false,capture:true});
    }

    bindHistoryModalV17(app);
    setTransportState('stop');
    applyBoostRamp(0);
    setAnalyserMode('init');
    return app;
  }

  function killOldDom(){
    if(!isMobile())return;
    qa('body > *').forEach(function(n){
      if(n.id==='mffApp'||n.id==='mffAudio')return;
      if(n.tagName==='SCRIPT'||n.tagName==='STYLE'||n.tagName==='LINK')return;
      n.setAttribute('data-smfp-hidden','1');
      try{n.remove()}catch(e){}
    });
    qa('header,main:not(.mff-shell),.hero,.hero-image,.site-header,.main-header,.mobile-shell,.player-shell,.hud-panel,.panel:not(.mff-now):not(.mff-card):not(.mff-eq):not(.mff-controls):not(.mff-bottom),#mfmApp,#mobileHudDomMeterRepair,#mobileControlsLayerReset,#mobileInlineTopControlsForce,#mobileTopControlsInBoostPanel,#mobileTransportRepair,.mobile-hud-dom-meter-repair,.mobile-transport-repair,.mobile-top-controls-in-boost,.mobile-dom-side-meter,.mobile-dom-bottom-guard,.mobile-dom-bottom-track,.mobile-dom-bottom-left,.mobile-dom-bottom-right,.bottom-meter,.bottom-levelmeter,.gesture-guard,.mobile-bottom-meter,[class*="bottom"][class*="meter"],[class*="bottom"][class*="guard"],[class*="gesture"][class*="guard"]').forEach(function(n){
      if(n.closest&&n.closest('#mffApp'))return;
      n.setAttribute('data-smfp-hidden','1');
      try{n.remove()}catch(e){}
    });
    qa('body *').forEach(function(n){
      if(n.closest&&n.closest('#mffApp'))return;
      if(n.tagName==='SCRIPT'||n.tagName==='STYLE'||n.tagName==='LINK')return;
      var r=n.getBoundingClientRect?n.getBoundingClientRect():null;
      if(!r)return;
      var cs=window.getComputedStyle?window.getComputedStyle(n):null;
      var bg=cs?((cs.background||'')+' '+(cs.backgroundImage||'')+' '+(cs.boxShadow||'')):'';
      var bottomish=r.top>window.innerHeight*.72;
      var wide=r.width>window.innerWidth*.55;
      var flat=r.height>6&&r.height<95;
      var lowText=((n.textContent||'').trim().length<24);
      var colored=/linear-gradient|cyan|magenta|pink|rgba|rgb|255,\s*0|0,\s*255/i.test(bg);
      if(bottomish&&wide&&flat&&(lowText||colored)){
        n.setAttribute('data-v8-old-bottom','1');
        try{n.remove()}catch(e){}
      }
    });
  }

  function invalidMetaText(x){
    if(!x)return true;
    var s=String(x).trim();
    if(!s)return true;
    if(s.indexOf('<!DOCTYPE')>=0||s.indexOf('<!doctype')>=0||s.indexOf('<html')>=0||s.indexOf('<body')>=0||s.indexOf('<script')>=0)return true;
    if(s.length>260&&/<\/?[a-z][\s\S]*>/i.test(s))return true;
    return false;
  }

  function normalizeDj(raw){
    var dj=String(raw||'').trim();
    if(!dj)return 'DJ-666';
    if(/auto\s*dj|autodj|auto-dj|unknown|offline|none|null|undefined/i.test(dj))return 'DJ-666';
    return dj;
  }

  function normalizeMeta(data){
    if(!data)return null;
    if(typeof data==='string'){if(invalidMetaText(data))return null;return{title:data,dj:'DJ-666'};}
    var np=data.now_playing||data.nowPlaying||{};
    var song=np.song||data.song||{};
    var station=data.station||{};
    var title=data.title||data.current_title||data.nowplaying||data.nowPlaying||data.current_song||data.currentSong||song.text||song.title||'';
    var artist=data.artist||song.artist||'';
    var listeners=data.listeners||data.listener_count||data.currentlisteners||data.current_listeners||data.listeners_current||(data.stats&&data.stats.listeners)||'';
    var bitrate=data.bitrate||data.kbps||data.stream_bitrate||(data.stats&&data.stats.bitrate)||'';
    var dj=data.dj||data.dj_status||data.live_dj||data.streamer||data.server_name||station.name||data.station_name||data.stream_name||data.name||'';
    var artwork=data.icon||data.logo||data.artwork||data.image||data.cover||data.cover_url||data.art||station.icon||station.logo||station.image||song.art||'';
    title=String(title||'').trim();
    if(invalidMetaText(title))title='';
    return{title:title,artist:String(artist||'').trim(),listeners:String(listeners||'').trim(),bitrate:String(bitrate||'').trim(),dj:normalizeDj(dj),artwork:String(artwork||'').trim()};
  }

  async function fetchOne(url){
    var res=await fetch(url,{cache:'no-store',headers:{Accept:'application/json,*/*'}});
    if(!res.ok)throw new Error(url+' '+res.status);
    var ct=(res.headers.get('content-type')||'').toLowerCase();
    var text=await res.text();
    if(invalidMetaText(text)&&ct.indexOf('json')<0)throw new Error('HTML response '+url);
    try{return JSON.parse(text)}catch(e){}
    if(invalidMetaText(text))throw new Error('invalid meta text '+url);
    return text;
  }


  function normalizeHistoryItems(raw){
    var arr=[];
    if(!raw) return arr;
    if(Array.isArray(raw)) arr=raw;
    else if(Array.isArray(raw.history)) arr=raw.history;
    else if(Array.isArray(raw.recent)) arr=raw.recent;
    else if(Array.isArray(raw.songs)) arr=raw.songs;
    else if(Array.isArray(raw.tracks)) arr=raw.tracks;
    else if(raw.items && Array.isArray(raw.items)) arr=raw.items;
    return arr.map(function(item){
      if(typeof item==='string') return {title:item,artist:''};
      var song=item.song||item.track||item.now_playing&&item.now_playing.song||{};
      var title=item.title||item.name||item.text||item.current_song||song.text||song.title||'';
      var artist=item.artist||song.artist||item.dj||item.streamer||'';
      var time=item.time||item.played_at||item.timestamp||item.date||'';
      return {title:String(title||'').trim(),artist:String(artist||'').trim(),time:String(time||'').trim()};
    }).filter(function(x){return x.title;}).slice(0,18);
  }

  function pushLocalHistory(meta){
    if(!meta || !meta.title) return;
    var title=String(meta.title||'').trim();
    if(!title || title===lastHistoryTitle) return;
    lastHistoryTitle=title;
    localHistory.unshift({
      title:title,
      artist:String(meta.artist||'').trim(),
      time:new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
    });
    localHistory=localHistory.slice(0,18);
  }

  function renderHistory(items,source){
    var box=q('#mffHistoryList');
    if(!box) return;
    var list=(items&&items.length)?items:localHistory;
    if(!list || !list.length){
      box.innerHTML='<div class="mff-history-empty">Noch keine History-Daten vorhanden.</div>';
      return;
    }
    box.innerHTML=list.slice(0,18).map(function(item,idx){
      var sub=(item.artist||item.time||source||'');
      return '<div class="mff-history-item">'+
        '<div class="mff-history-num">'+String(idx+1).padStart(2,'0')+'</div>'+
        '<div><div class="mff-history-title">'+escapeHtml(item.title||'Unbekannter Titel')+'</div>'+
        '<div class="mff-history-sub">'+escapeHtml(sub||'played')+'</div></div></div>';
    }).join('');
  }

  function escapeHtml(str){
    return String(str||'').replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  async function fetchHistory(){
    for(var i=0;i<HISTORY_ENDPOINTS.length;i++){
      try{
        var raw=await fetchOne(HISTORY_ENDPOINTS[i]+'?ts='+Date.now());
        var items=normalizeHistoryItems(raw);
        if(items.length) return {items:items,source:HISTORY_ENDPOINTS[i]};
      }catch(e){}
    }
    return {items:localHistory,source:'local'};
  }

  async function toggleHistory(force){
    var app=q('#mffApp');
    if(!app) return;
    var open=app.getAttribute('data-history-open')==='1';
    var next=(typeof force==='boolean')?force:!open;
    app.setAttribute('data-history-open',next?'1':'0');
    var overlay=q('#mffHistoryOverlay');
    if(overlay) overlay.setAttribute('aria-hidden',next?'false':'true');
    if(next){
      renderHistory(localHistory,'local');
      try{
        var h=await fetchHistory();
        renderHistory(h.items,h.source);
      }catch(e){
        renderHistory(localHistory,'local');
      }
    }
  }


  async function fetchMeta(){
    for(var i=0;i<META_ENDPOINTS.length;i++){
      try{
        var raw=await fetchOne(META_ENDPOINTS[i]+'?ts='+Date.now());
        var meta=normalizeMeta(raw);
        if(meta&&(meta.title||meta.listeners||meta.bitrate||meta.dj||meta.artwork)){meta.source=META_ENDPOINTS[i];return meta}
      }catch(e){}
    }
    return null;
  }

  function applyMeta(meta){
    if(!meta)return;
    pushLocalHistory(meta);
    setMarqueeTitle(meta.title||'Metadaten werden geladen ...');
    var h2=q('#mffApp .mff-title h2');
    if(h2)h2.textContent=meta.artist||'Quelle: '+(meta.source||'API');
    setArtwork(meta.artwork||'');
    var cards=qa('#mffApp .mff-card strong');
    if(cards[0])cards[0].innerHTML=meta.listeners?(String(meta.listeners).indexOf('/')>=0?meta.listeners:meta.listeners+' / 250'):'0 / 250';
    if(cards[1])cards[1].textContent=meta.bitrate||'Unknown';
    if(cards[2])cards[2].innerHTML=normalizeDj(meta.dj);
  }

  async function tickMeta(){try{var meta=await fetchMeta();if(meta)applyMeta(meta)}catch(e){}}
  function startMeta(){if(metaTimer)return;tickMeta();metaTimer=setInterval(tickMeta,12000)}


  function setAnalyserMode(mode){
    analyserMode=mode;
    document.documentElement.setAttribute('data-mff-analyser',mode);
    var label=q('#mffAnalyserMode');
    if(label){
      label.textContent='';
      label.setAttribute('data-mode',mode);
    }
  }


  function pseudoNoise(seed){
    var x=Math.sin(seed*12.9898+78.233)*43758.5453;
    return x-Math.floor(x);
  }

  function smoothPulse(t, speed, phase){
    var v=(Math.sin(t*speed+phase)+1)/2;
    return v*v*(3-2*v);
  }



  function pcClamp(value,min,max){
    return Math.max(min,Math.min(max,value));
  }

  function pcFallbackBarValue(index,total,intensity){
    var t=Date.now()/155;
    var mirrored=index<(total/2)?index:(total-1-index);
    var waveA=Math.abs(Math.sin(t+mirrored*.30));
    var waveB=Math.abs(Math.sin((t*.66)+mirrored*.17));
    var contour=1.16-((mirrored/Math.max(1,total/2))*.38);
    return 14+((waveA*68)+(waveB*18))*contour*intensity;
  }

  function pcPxToPercent(px){
    return pcClamp(px,12,112);
  }

  function pcSetSideMeterFromPercent(valuePercent){
    var next=(pcSmoothMeter*.58)+(pcClamp(valuePercent,12,98)*.42);
    pcSmoothMeter=next;
    return next/100;
  }

  function pcApplyBottomCenterOut(bottomBars,meterPercent){
    if(!bottomBars||!bottomBars.length)return;
    var mid=(bottomBars.length-1)/2;
    var level=pcClamp(meterPercent,12,98)/100;
    for(var i=0;i<bottomBars.length;i++){
      var dist=Math.abs(i-mid)/mid;
      var center=1-dist;
      var pulse=Math.abs(Math.sin(Date.now()/210+i*.13));
      var shaped=pcClamp((level*.70)+(center*.18)+(pulse*.12),.16,1);
      bottomBars[i].style.setProperty('--mff-bar-x',shaped.toFixed(3));
      bottomBars[i].style.setProperty('--mff-bar-opacity',(.44+shaped*.54).toFixed(2));
    }
  }


  function syntheticMeterMotion(playing,reason){
    var eqBars=qa('#mffEqBars i');
    var bottomBars=qa('#mffBottomBars i');
    var app=q('#mffApp');
    var boost=(boostStage||0);
    var intensity=(playing?1.0:0.34) + boost*0.08;
    var t=Date.now()/155;

    if(app){
      app.setAttribute('data-mff-meter-mode','pc-hybrid');
      app.setAttribute('data-mff-meter-energy',playing?'normal':'idle');
    }

    if(!pcEqSmoothBars.length || pcEqSmoothBars.length!==eqBars.length){
      pcEqSmoothBars=new Array(eqBars.length).fill(18);
    }

    if(eqBars.length){
      for(var i=0;i<eqBars.length;i++){
        var mirroredIndex=i < (eqBars.length/2) ? i : (eqBars.length-1-i);
        var waveA=Math.abs(Math.sin(t + mirroredIndex*0.30));
        var waveB=Math.abs(Math.sin((t*0.66) + mirroredIndex*0.17));
        var contour=1.16 - ((mirroredIndex / Math.max(1, eqBars.length/2)) * 0.38);

        // Desktop-Fallback nachgebildet: ruhig, wellig, gespiegelt.
        var target=14 + ((waveA*68) + (waveB*18)) * contour * intensity;
        target=Math.max(12,Math.min(112,target));

        // Glättung gegen Flackern. Nicht jeder Frame springt direkt.
        var prev=pcEqSmoothBars[i] || target;
        var next=(prev*0.64)+(target*0.36);
        pcEqSmoothBars[i]=next;

        eqBars[i].style.height=next.toFixed(1)+'px';
        eqBars[i].style.opacity=(0.54 + Math.min(1,next/112)*0.42).toFixed(2);
        eqBars[i].style.filter='saturate('+(1+boost*0.08).toFixed(2)+')';
      }
    }

    var meter=playing
      ? 26 + (Math.abs(Math.sin(Date.now()/210))*62)
      : 18 + (Math.abs(Math.sin(Date.now()/300))*18);
    meter=Math.min(98,meter + boost*3);

    // Desktop smoothMeter: alter Wert 58%, neuer Wert 42%.
    pcSmoothMeter=(pcSmoothMeter*0.58)+(Math.max(12,Math.min(98,meter))*0.42);

    if(bottomBars.length){
      var mid=(bottomBars.length-1)/2;
      var norm=Math.max(0.12,Math.min(1,pcSmoothMeter/98));
      for(var j=0;j<bottomBars.length;j++){
        var dist=Math.abs(j-mid)/mid;
        var centerWeight=1-(dist*0.35);
        var x=Math.max(0.18,Math.min(1,norm*centerWeight));
        bottomBars[j].style.setProperty('--mff-bar-x',x.toFixed(3));
        bottomBars[j].style.setProperty('--mff-bar-opacity',(.45+x*.50).toFixed(2));
      }
    }

    setAnalyserMode('pc-hybrid');
    return Math.max(.10,Math.min(.96,pcSmoothMeter/98));
  }



  function pcMobileEqTimerTick(){
    if(!isMobile()) return;
    var audio=null;
    try{audio=getAudio();}catch(e){}
    var attrPlaying=document.documentElement.getAttribute('data-mff-playing')==='1';
    var audioPlaying=!!(audio && !audio.paused && !audio.ended);
    var playing=attrPlaying || audioPlaying;

    try{
      var level=updateEqFromAnalyser(audioGraph,playing);
      document.documentElement.style.setProperty('--mff-level',Math.max(.08,Math.min(.96,level)).toFixed(3));
      pcMobileEqLastTick=Date.now();
    }catch(err){
      var level2=syntheticMeterMotion(playing,'pc-hybrid');
      document.documentElement.style.setProperty('--mff-level',Math.max(.08,Math.min(.96,level2)).toFixed(3));
    }
  }

  function startPcMobileEqTimer(){
    if(pcMobileEqTimer) return;
    pcMobileEqTimer=window.setInterval(pcMobileEqTimerTick,110);
    pcMobileEqTimerTick();
    document.documentElement.setAttribute('data-mff-mobile-eq-engine','pc-single-loop-v20');
  }


  function averageRange(arr,start,end){
    var sum=0,count=0;
    for(var i=start;i<end&&i<arr.length;i++){sum+=arr[i];count++;}
    return count?sum/count:0;
  }

  function updateEqFromAnalyser(graph,playing){
    var eqBars=qa('#mffEqBars i');
    var bottomBars=qa('#mffBottomBars i');
    var app=q('#mffApp');
    var hasAnalyser=graph&&graph.ok&&graph.analyser&&graph.freqData;

    if(!hasAnalyser){
      return syntheticMeterMotion(playing,'pc-hybrid');
    }

    graph.analyser.getByteFrequencyData(graph.freqData);
    var data=graph.freqData;
    var halfBars=Math.max(1,Math.floor(eqBars.length/2));
    var analysisWindow=Math.max(8,Math.floor(data.length*0.72));
    var slice=Math.max(1,Math.floor(analysisWindow/halfBars));
    var shapedValues=[];
    var globalMax=0;
    var boost=(boostStage||0);

    for(var i=0;i<halfBars;i++){
      var total=0;
      var count=0;
      var start=Math.floor(Math.pow(i/Math.max(1,halfBars-1),1.65)*Math.max(1,analysisWindow-slice));
      var end=Math.min(analysisWindow,start+slice);

      for(var j=start;j<end;j++){
        total+=data[j]||0;
        count++;
      }

      var avg=count?(total/count):0;
      globalMax=Math.max(globalMax,avg);

      var shaped=Math.pow(avg/255,0.72);
      var contour=1.16 - ((i/Math.max(1,halfBars-1))*0.36);
      var px=12 + (shaped*contour*84);
      shapedValues.push(px);
    }

    if(globalMax<10){
      pcWeakFrameCounter++;
    }else{
      pcWeakFrameCounter=0;
    }

    var useHybrid=pcWeakFrameCounter>3 || globalMax<3;

    if(!pcEqSmoothBars.length || pcEqSmoothBars.length!==eqBars.length){
      pcEqSmoothBars=new Array(eqBars.length).fill(18);
    }

    if(useHybrid){
      return syntheticMeterMotion(playing,'pc-hybrid');
    }

    if(app){
      app.setAttribute('data-mff-meter-mode','pc-real');
      app.setAttribute('data-mff-meter-energy',globalMax>55?'high':'normal');
    }

    for(var b=0;b<eqBars.length;b++){
      var mirroredIndex=b<halfBars ? b : (eqBars.length-1-b);
      var px=shapedValues[Math.min(mirroredIndex,shapedValues.length-1)]||14;
      px=Math.max(12,Math.min(112,px + boost*2.5));

      var prev=pcEqSmoothBars[b]||px;
      var next=(prev*0.58)+(px*0.42);
      pcEqSmoothBars[b]=next;

      eqBars[b].style.height=next.toFixed(1)+'px';
      eqBars[b].style.opacity=(.50+Math.min(1,next/112)*.46).toFixed(2);
      eqBars[b].style.filter='saturate('+(1+boost*.08).toFixed(2)+')';
    }

    var meterValue=14+((globalMax/255)*84);
    pcSmoothMeter=(pcSmoothMeter*0.58)+(Math.max(12,Math.min(98,meterValue))*0.42);

    if(bottomBars.length){
      var mid=(bottomBars.length-1)/2;
      var norm=Math.max(.12,Math.min(1,pcSmoothMeter/98));
      for(var k=0;k<bottomBars.length;k++){
        var dist=Math.abs(k-mid)/mid;
        var centerWeight=1-(dist*.35);
        var x=Math.max(.18,Math.min(1,norm*centerWeight));
        bottomBars[k].style.setProperty('--mff-bar-x',x.toFixed(3));
        bottomBars[k].style.setProperty('--mff-bar-opacity',(.45+x*.50).toFixed(2));
      }
    }

    setAnalyserMode('pc-real');
    return Math.max(.10,Math.min(.96,pcSmoothMeter/98));
  }

  function animate(){
    // v20: Keine separate RAF-Meterengine mehr.
    // Die einzige aktive Meter-Schleife ist startPcMobileEqTimer() im 110ms-PC-Takt.
    rafStarted=false;
  }

  function install(){
    if(!document.body)return;
    document.documentElement.setAttribute('data-smfp-version',VERSION);
    document.body.setAttribute('data-smfp-active',isMobile()?'1':'0');
    if(!isMobile())return;
    buildApp();
    killOldDom();
    startMeta();
    startPcMobileEqTimer();
  }

  document.addEventListener('DOMContentLoaded',function(){install();setTimeout(install,150);setTimeout(install,650);setTimeout(install,1500);setTimeout(install,3200);setTimeout(install,6000)});
  window.addEventListener('load',install,{passive:true});
  window.addEventListener('resize',install,{passive:true});
  window.addEventListener('orientationchange',install,{passive:true});
})();
